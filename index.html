<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ストレス解消" />
  <meta name="theme-color" content="#fff6e9" />
  <title>ボコッと＆ブシャーッ！ストレス解消アプリ</title>
  <link id="app-icon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23fff3df'/%3E%3Cellipse cx='90' cy='80' rx='52' ry='62' fill='%23ff5a5f'/%3E%3Cellipse cx='72' cy='58' rx='12' ry='22' transform='rotate(-20 72 58)' fill='rgba(255,255,255,0.45)'/%3E%3Cpolygon points='82,140 98,140 90,150' fill='%23ff5a5f'/%3E%3Ccircle cx='74' cy='78' r='6' fill='%232b2d42'/%3E%3Ccircle cx='106' cy='78' r='6' fill='%232b2d42'/%3E%3Cpath d='M78 98 Q90 108 102 98' stroke='%232b2d42' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-top: #fff9ef;
      --bg-bottom: #ffe8cc;
      --ink: #2b2d42;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(43, 45, 66, 0.13);
      --accent: #ff595e;
      --accent-blue: #1982c4;
      --accent-green: #52b788;
      --gauge-bg: rgba(43, 45, 66, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "BIZ UDPGothic", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.72) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255, 214, 165, 0.45) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      transition: background 0.35s ease;
    }

    body.mode-soda {
      --bg-top: #eef9ff;
      --bg-bottom: #d4f1ff;
    }

    /* 背景のポップなドット模様 */
    .bg-dots {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.24;
      background-image: radial-gradient(#f4a261 1.6px, transparent 1.6px);
      background-size: 26px 26px;
    }

    body.mode-soda .bg-dots {
      background-image: radial-gradient(#48bfe3 1.7px, transparent 1.7px);
      opacity: 0.28;
    }

    /* 限界時の赤いビネット演出 */
    #danger-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, transparent 42%, rgba(255, 36, 66, 0.55) 100%);
      transition: opacity 0.08s linear;
      z-index: 2;
    }

    /* メイン描画キャンバス */
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      z-index: 1;
    }

    /* 上部HUD（カウンター＋ミュート＋キャラ切替） */
    .hud-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    .stats-bar {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid var(--panel-border);
      border-radius: 999px;
      padding: 6px 13px;
      box-shadow: 0 4px 12px rgba(43, 45, 66, 0.08);
      pointer-events: auto;
      cursor: pointer;
    }

    .stat-item {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      font-weight: 800;
      font-size: 12.5px;
      white-space: nowrap;
    }

    .stat-icon {
      font-size: 14px;
      line-height: 1;
    }

    .stat-value {
      font-size: 15.5px;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      min-width: 1.4ch;
      text-align: right;
    }

    .stat-divider {
      width: 1.5px;
      height: 15px;
      background: rgba(43, 45, 66, 0.16);
      border-radius: 2px;
    }

    .sound-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--panel-border);
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(43, 45, 66, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.12s ease, background-color 0.15s ease;
      padding: 0;
      color: var(--ink);
      flex-shrink: 0;
    }

    .sound-btn:active {
      transform: scale(0.9);
    }

    .sound-btn.muted {
      opacity: 0.65;
      background: rgba(235, 235, 240, 0.85);
    }

    /* キャラ切り替えタブ */
    .char-switcher-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .char-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid var(--panel-border);
      border-radius: 999px;
      padding: 4px;
      box-shadow: 0 4px 12px rgba(43, 45, 66, 0.08);
      pointer-events: auto;
    }

    .char-tab {
      border: none;
      background: transparent;
      color: rgba(43, 45, 66, 0.68);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
      white-space: nowrap;
    }

    .char-tab:active {
      transform: scale(0.94);
    }

    .char-tab.active {
      background: var(--ink);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(43, 45, 66, 0.22);
    }

    /* 炭酸ボトル専用：投入メントス数＆噴射パワーバッジ */
    .mentos-hud {
      display: none;
      align-self: center;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(43, 45, 66, 0.16);
      border-radius: 999px;
      padding: 4px 13px;
      font-size: 12.5px;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 0 3px 10px rgba(43, 45, 66, 0.08);
      transition: transform 0.12s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .mentos-hud.visible {
      display: inline-flex;
    }

    .mentos-hud.level-mid {
      border-color: #ff9f1c;
      background: #fff8e8;
    }

    .mentos-hud.level-high {
      border-color: #ff2e4c;
      background: #ffe8ec;
      color: #c9184a;
    }

    .mentos-hud.pop {
      transform: scale(1.12);
    }

    .mentos-power-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
    }

    .mentos-hud.level-mid .mentos-power-tag {
      background: #f77f00;
    }

    .mentos-hud.level-high .mentos-power-tag {
      background: #ff2e4c;
    }

    /* 下部UI（限界ゲージ＆操作ガイド） */
    .hud-bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 20px calc(env(safe-area-inset-bottom, 0px) + 16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .gauge-wrap {
      width: min(306px, 84vw);
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid var(--panel-border);
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: 0 6px 18px rgba(43, 45, 66, 0.08);
      opacity: 0.76;
      transform: translateY(0) scale(0.97);
      transition: opacity 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .gauge-wrap.active {
      opacity: 1;
      transform: translateY(-2px) scale(1);
    }

    .gauge-wrap.danger {
      border-color: rgba(255, 46, 76, 0.75);
      animation: gaugeShake 0.1s infinite;
    }

    @keyframes gaugeShake {
      0% { transform: translate(-1.5px, -2px) scale(1.01); }
      50% { transform: translate(1.5px, -1px) scale(1.01); }
      100% { transform: translate(-1px, -3px) scale(1.01); }
    }

    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
      padding: 0 2px;
    }

    .gauge-label {
      letter-spacing: 0.03em;
    }

    .gauge-percent {
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .gauge-track {
      width: 100%;
      height: 12px;
      background: var(--gauge-bg);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .gauge-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #52b788 0%, #ffb703 55%, #ff2e4c 100%);
      transition: width 0.04s linear;
    }

    .hint-pill {
      font-size: 12px;
      font-weight: 700;
      color: rgba(43, 45, 66, 0.72);
      background: rgba(255, 255, 255, 0.65);
      padding: 5px 14px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* 破裂・噴射後のオーバーレイメッセージ＆復活案内 */
    #burst-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1.4, 0.36, 1);
      z-index: 8;
      padding: 24px;
      text-align: center;
    }

    #burst-overlay.visible {
      opacity: 1;
      transform: scale(1);
    }

    .burst-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 4px solid var(--ink);
      border-radius: 26px;
      padding: 18px 26px;
      box-shadow: 0 10px 0 rgba(43, 45, 66, 0.16);
      max-width: 88vw;
    }

    .burst-onomatopoeia {
      font-size: 40px;
      font-weight: 900;
      color: #ff2e4c;
      line-height: 1.08;
      letter-spacing: 0.03em;
      text-shadow: 2px 2px 0 #ffd166;
      margin-bottom: 6px;
    }

    .burst-message {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .respawn-cta {
      display: inline-block;
      background: #ff595e;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 0 #c93338;
      animation: bounceCta 1.1s ease-in-out infinite;
    }

    @keyframes bounceCta {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="bg-dots" aria-hidden="true"></div>
  <div id="danger-vignette" aria-hidden="true"></div>

  <canvas id="stage"></canvas>

  <!-- 上部HUD：カウンター・ミュート・キャラ切り替え -->
  <header class="hud-top">
    <div class="hud-row">
      <div id="stats-bar" class="stats-bar" title="タップでカウントをリセット">
        <div class="stat-item">
          <span id="stat-action-icon" class="stat-icon" aria-hidden="true">👊</span>
          <span id="stat-action-label">殴った</span>
          <span id="action-count" class="stat-value">0</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="stat-item">
          <span id="stat-burst-icon" class="stat-icon" aria-hidden="true">💥</span>
          <span id="stat-burst-label">割った</span>
          <span id="burst-count" class="stat-value">0</span>
        </div>
      </div>

      <button id="sound-btn" class="sound-btn" type="button" aria-label="効果音のオン・オフを切り替え">
        🔊
      </button>
    </div>

    <!-- キャラ切り替えタブ -->
    <div class="char-switcher-wrap">
      <div id="char-switcher" class="char-switcher" role="tablist" aria-label="キャラクター選択"></div>
    </div>

    <!-- 炭酸ボトル用：投入メントス数バッジ -->
    <div id="mentos-hud" class="mentos-hud" aria-live="polite">
      <span>🍬 メントス × <strong id="mentos-current">0</strong></span>
      <span id="mentos-power-tag" class="mentos-power-tag">ノーマル</span>
    </div>
  </header>

  <!-- 破裂・噴射時のコミカルなメッセージ＆ワンタップ復活案内 -->
  <div id="burst-overlay" aria-live="polite">
    <div class="burst-badge">
      <div id="burst-onomatopoeia" class="burst-onomatopoeia">パンッ!!</div>
      <div id="burst-message" class="burst-message">スッキリした？</div>
      <div id="respawn-cta" class="respawn-cta">タップで新しい風船を出す</div>
    </div>
  </div>

  <!-- 下部ゲージと操作ガイド -->
  <footer class="hud-bottom">
    <div id="gauge-wrap" class="gauge-wrap">
      <div class="gauge-header">
        <span id="gauge-label" class="gauge-label">🤏 つねり限界ゲージ</span>
        <span id="gauge-percent" class="gauge-percent">0%</span>
      </div>
      <div class="gauge-track">
        <div id="gauge-fill" class="gauge-fill"></div>
      </div>
    </div>
    <div id="hint-pill" class="hint-pill">タップで殴る ／ 長押しでつねる</div>
  </footer>

  <script>
    (() => {
      "use strict";

      /* =========================================================
       * 1. ユーティリティ関数
       * ========================================================= */
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      function hexToRgb(hex) {
        const clean = hex.replace("#", "");
        const num = parseInt(clean, 16);
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
      }

      function mixColor(hexA, hexB, t) {
        const ct = clamp(t, 0, 1);
        const a = hexToRgb(hexA);
        const b = hexToRgb(hexB);
        const r = Math.round(lerp(a.r, b.r, ct));
        const g = Math.round(lerp(a.g, b.g, ct));
        const bl = Math.round(lerp(a.b, b.b, ct));
        return `#${((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1)}`;
      }

      function drawRoundedRect(ctx, x, y, w, h, r) {
        const rad = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w, y, x + w, y + h, rad);
        ctx.arcTo(x + w, y + h, x, y + h, rad);
        ctx.arcTo(x, y + h, x, y, rad);
        ctx.arcTo(x, y, x + w, y, rad);
        ctx.closePath();
      }

      /* =========================================================
       * 2. Web Audio API 効果音シンセサイザー（外部ファイル不要）
       * ========================================================= */
      const SoundEngine = {
        ctx: null,
        enabled: true,
        noiseBuffer: null,

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === "suspended") {
            this.ctx.resume().catch(() => {});
          }
          if (!this.noiseBuffer && this.ctx) {
            const sampleRate = this.ctx.sampleRate;
            const buffer = this.ctx.createBuffer(1, sampleRate * 2.5, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            this.noiseBuffer = buffer;
          }
          return this.ctx;
        },

        unlock() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.01);
          } catch (_) {}
        },

        // 【風船】「殴る」コミカルな音（ドスッ＋ボヨンッ）
        playPunch(pitchBase = 1.0) {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const jitter = (0.9 + Math.random() * 0.24) * pitchBase;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(210 * jitter, now);
          osc.frequency.exponentialRampToValueAtTime(58 * jitter, now + 0.075);
          osc.frequency.exponentialRampToValueAtTime(145 * jitter, now + 0.16);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.55, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);

          if (this.noiseBuffer) {
            const noise = ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = ctx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(1250 * jitter, now);
            filter.Q.value = 1.4;

            const nGain = ctx.createGain();
            nGain.gain.setValueAtTime(0.32, now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

            noise.connect(filter);
            filter.connect(nGain);
            nGain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + 0.07);
          }
        },

        // 【風船】「つねる・ゴムがきしむ」パルス音
        playPinchCreak(tension) {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const baseFreq = 260 + tension * 520 + (Math.random() - 0.5) * 35;

          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();

          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * (1.22 + tension * 0.25), now + 0.055);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, now + 0.095);

          filter.type = "bandpass";
          filter.frequency.setValueAtTime(baseFreq * 2.1, now);
          filter.Q.value = 4.5;

          const vol = 0.09 + tension * 0.12;
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        },

        // 【風船】つねり離し「ビヨヨーン」
        playRelease(tension) {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(160 + tension * 120, now);
          osc.frequency.exponentialRampToValueAtTime(340 + tension * 180, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.28);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.24, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.32);
        },

        // 【風船】破裂音「パンッ！！」
        playBurst() {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (this.noiseBuffer) {
            const noise = ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;

            const filter = ctx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.setValueAtTime(320, now);
            filter.frequency.exponentialRampToValueAtTime(1800, now + 0.18);

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.95, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + 0.26);
          }

          const sub = ctx.createOscillator();
          const subGain = ctx.createGain();
          sub.type = "sine";
          sub.frequency.setValueAtTime(180, now);
          sub.frequency.exponentialRampToValueAtTime(36, now + 0.16);

          subGain.gain.setValueAtTime(0.75, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          sub.connect(subGain);
          subGain.connect(ctx.destination);
          sub.start(now);
          sub.stop(now + 0.2);
        },

        // 【炭酸ボトル】メントス投入音「ポチャン！シュワァ！」
        playMentosDrop(count) {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const pitchBoost = 1 + Math.min(count, 15) * 0.04;

          // ポチャン（水滴ピッチ上昇）
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(290 * pitchBoost, now);
          osc.frequency.exponentialRampToValueAtTime(660 * pitchBoost, now + 0.085);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.36, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);

          // 直後のシュワァ！発泡音
          if (this.noiseBuffer) {
            const noise = ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;

            const filter = ctx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(2800 + Math.min(count, 12) * 180, now + 0.03);
            filter.Q.value = 1.2;

            const nGain = ctx.createGain();
            const dur = 0.18 + Math.min(count, 10) * 0.015;
            nGain.gain.setValueAtTime(0.001, now + 0.03);
            nGain.gain.linearRampToValueAtTime(0.22 + Math.min(count, 10) * 0.015, now + 0.055);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03 + dur);

            noise.connect(filter);
            filter.connect(nGain);
            nGain.connect(ctx.destination);
            noise.start(now + 0.03);
            noise.stop(now + 0.05 + dur);
          }
        },

        // 【炭酸ボトル】振る音「シャカッ！シュワ！」
        playShakeSlosh(tension) {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          // 液体のシャカッ（バンドパスノイズ）
          if (this.noiseBuffer) {
            const noise = ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;

            const filter = ctx.createBiquadFilter();
            filter.type = "bandpass";
            const freq = 950 + tension * 1900 + (Math.random() - 0.5) * 180;
            filter.frequency.setValueAtTime(freq, now);
            filter.frequency.exponentialRampToValueAtTime(freq * 1.35, now + 0.065);
            filter.Q.value = 2.0;

            const gain = ctx.createGain();
            const vol = 0.14 + tension * 0.18;
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(vol, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + 0.095);
          }

          // ボトルの軽いコポッ感
          const thump = ctx.createOscillator();
          const tGain = ctx.createGain();
          thump.type = "triangle";
          thump.frequency.setValueAtTime(160 + tension * 140, now);
          thump.frequency.exponentialRampToValueAtTime(95 + tension * 60, now + 0.05);
          tGain.gain.setValueAtTime(0.08 + tension * 0.07, now);
          tGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          thump.connect(tGain);
          tGain.connect(ctx.destination);
          thump.start(now);
          thump.stop(now + 0.065);
        },

        // 【炭酸ボトル】途中で振るのをやめたときの「プシュー…」
        playFizzCalm(tension) {
          if (!this.enabled || !this.noiseBuffer) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          const noise = ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = ctx.createBiquadFilter();
          filter.type = "highpass";
          filter.frequency.setValueAtTime(2200, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.08 + tension * 0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.27);
        },

        // 【炭酸ボトル】噴射音「ポンッ!! ブシャーーーッ!!」（メントス数でスケールアップ）
        playErupt(mentosCount) {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const power = clamp(mentosCount / 10, 0, 1.5);
          const sprayDur = 1.05 + Math.min(mentosCount, 12) * 0.11;

          // 1. キャップが吹き飛ぶ「ポンッ!!」
          const pop = ctx.createOscillator();
          const popGain = ctx.createGain();
          pop.type = "sine";
          pop.frequency.setValueAtTime(420 + power * 180, now);
          pop.frequency.exponentialRampToValueAtTime(95, now + 0.09);
          popGain.gain.setValueAtTime(0.85, now);
          popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          pop.connect(popGain);
          popGain.connect(ctx.destination);
          pop.start(now);
          pop.stop(now + 0.12);

          // 2. 豪快な噴射ジェットノイズ「ブシャーーーッ!!」
          if (this.noiseBuffer) {
            const noise = ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;

            const filter = ctx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(1600 + power * 900, now);
            filter.frequency.exponentialRampToValueAtTime(3400, now + 0.25);
            filter.frequency.exponentialRampToValueAtTime(950, now + sprayDur);
            filter.Q.value = 0.75;

            const nGain = ctx.createGain();
            const peakVol = clamp(0.48 + power * 0.34, 0.48, 0.92);
            nGain.gain.setValueAtTime(0.01, now);
            nGain.gain.linearRampToValueAtTime(peakVol, now + 0.05);
            nGain.gain.setValueAtTime(peakVol * 0.85, now + sprayDur * 0.45);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + sprayDur);

            noise.connect(filter);
            filter.connect(nGain);
            nGain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + sprayDur + 0.05);
          }

          // 3. メントスが多いときの低音ゴゴゴ衝撃
          if (mentosCount >= 3) {
            const sub = ctx.createOscillator();
            const subGain = ctx.createGain();
            sub.type = "sawtooth";
            const subFilter = ctx.createBiquadFilter();
            subFilter.type = "lowpass";
            subFilter.frequency.value = 180;

            sub.frequency.setValueAtTime(125 + Math.min(mentosCount, 12) * 4, now);
            sub.frequency.exponentialRampToValueAtTime(42, now + Math.min(0.65, sprayDur * 0.5));

            subGain.gain.setValueAtTime(0.001, now);
            subGain.gain.linearRampToValueAtTime(clamp(0.2 + power * 0.28, 0.2, 0.55), now + 0.04);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + Math.min(0.75, sprayDur * 0.55));

            sub.connect(subFilter);
            subFilter.connect(subGain);
            subGain.connect(ctx.destination);
            sub.start(now);
            sub.stop(now + 0.8);
          }
        },

        // 復活音「ポンッ！」
        playSpawn() {
          if (!this.enabled) return;
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.11);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.28, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      };

      /* =========================================================
       * 3. 物体カタログ定義（キャラ追加・拡張ポイント）
       * ---------------------------------------------------------
       * 各キャラは tapAction / holdAction / burstAction / render を持ち、
       * 新キャラ（スライムやサンドバッグ等）も同様にここへ追加できます。
       * ========================================================= */
      const OBJECT_CATALOG = {
        /* -------------------------------------------------------
         * キャラ1：風船（タップで殴る / 長押しでつねる→割れる）
         * ------------------------------------------------------- */
        balloon: {
          id: "balloon",
          name: "風船",
          tabIcon: "🎈",
          bodyClass: "mode-balloon",
          hud: {
            actionIcon: "👊",
            actionLabel: "殴った",
            burstIcon: "💥",
            burstLabel: "割った",
            gaugeIdle: "🤏 つねり限界ゲージ",
            gaugeBurst: "💥 限界突破！",
            hintAlive: "タップで殴る ／ 長押しでつねる",
            hintDead: "画面をタップで新しい風船を出す"
          },
          colors: [
            { main: "#ff595e", shade: "#d9383e", highlight: "rgba(255,255,255,0.48)" },
            { main: "#1982c4", shade: "#115e91", highlight: "rgba(255,255,255,0.45)" },
            { main: "#ffca3a", shade: "#e09f1f", highlight: "rgba(255,255,255,0.55)" },
            { main: "#8ac926", shade: "#659b14", highlight: "rgba(255,255,255,0.45)" },
            { main: "#ff6b9d", shade: "#d94377", highlight: "rgba(255,255,255,0.48)" },
            { main: "#9b5de5", shade: "#7236bd", highlight: "rgba(255,255,255,0.45)" }
          ],
          dangerColor: "#ff1738",
          dangerShade: "#b8001f",
          physics: {
            springK: 230,
            damping: 10.5,
            holdDuration: 2.3,
            coolDownRate: 0.75,
            punchPitch: 1.0
          },
          texts: {
            punchWords: ["オラッ！", "バシッ！", "ボコッ！", "ポカッ！", "ドガッ！", "ベシッ！", "スカッ！", "ドゴッ！"],
            holdCry: ["うぐぐ…", "のびるぅ！", "ヤバい！", "もう限界ッ！"],
            burstWord: "パンッ!!",
            burstMessages: [
              "スッキリした？",
              "ストレス粉砕ッ！",
              "見事な破裂っぷり！",
              "あ〜あ、割れちゃった！",
              "爽快MAX！",
              "モヤモヤ吹き飛んだ！"
            ],
            respawnLabel: "タップで新しい風船を出す"
          },

          onTap(x, y, state, api) {
            const dx = x - api.centerX;
            const dy = y - api.centerY;
            const angle = Math.atan2(dy, dx);

            state.dentAngle = angle;
            state.dentAmount = 1.0;
            state.hurtTimer = 0.28;

            const dirX = Math.cos(angle);
            const dirY = Math.sin(angle);
            state.velX += -dirX * 420 + (Math.random() - 0.5) * 140;
            state.velY += -dirY * 360 - 80;
            state.velScaleX += (Math.abs(dirX) > Math.abs(dirY) ? -2.8 : 2.6);
            state.velScaleY += (Math.abs(dirX) > Math.abs(dirY) ? 2.6 : -2.8);
            state.velRot += (dx >= 0 ? -1 : 1) * (4.2 + Math.random() * 2.5);
            state.screenShake = Math.max(state.screenShake, 5);

            api.incrementAction();
            SoundEngine.playPunch(this.physics.punchPitch);

            api.addShockwave(x, y, 12, api.baseRadius * 0.95, 0.26, "#ff9f1c");
            const sparkColors = ["#ffbe0b", "#ff595e", "#ffffff", "#fb5607"];
            for (let i = 0; i < 12; i++) {
              const ang = (Math.PI * 2 * i) / 12 + (Math.random() - 0.5) * 0.35;
              const speed = 180 + Math.random() * 260;
              api.addParticle({
                kind: i % 3 === 0 ? "star" : "spark",
                x, y,
                vx: Math.cos(ang) * speed,
                vy: Math.sin(ang) * speed,
                size: 6 + Math.random() * 7,
                rot: ang,
                vRot: (Math.random() - 0.5) * 12,
                color: pick(sparkColors),
                gravity: 360,
                maxLife: 0.32 + Math.random() * 0.16
              });
            }
            api.addPopup(
              pick(this.texts.punchWords),
              x + (Math.random() - 0.5) * 34,
              y - 24,
              pick(["#ff2e4c", "#ff6d00", "#d90429", "#7209b7"]),
              34 + Math.random() * 8
            );
          },

          onHoldStart(x, y, state, api) {
            state.pinchAngle = Math.atan2(y - api.centerY, x - api.centerX);
            state.holdSoundTimer = 0;
          },

          onHoldMove(x, y, state, api) {
            state.pinchAngle = Math.atan2(y - api.centerY, x - api.centerX);
          },

          onHoldUpdate(dt, state, api) {
            state.tension = clamp(state.tension + dt / this.physics.holdDuration, 0, 1);
            state.pinchPull = lerp(state.pinchPull, 0.35 + state.tension * 0.75, clamp(dt * 12, 0, 1));

            state.holdSoundTimer -= dt;
            if (state.holdSoundTimer <= 0) {
              SoundEngine.playPinchCreak(state.tension);
              state.holdSoundTimer = lerp(0.24, 0.085, state.tension);
            }
            if (state.tension >= 1) {
              api.triggerBurst();
            }
          },

          onHoldEnd(state, playSound) {
            const prevTension = state.tension;
            if (state.alive && prevTension > 0.06) {
              const dirX = Math.cos(state.pinchAngle);
              const dirY = Math.sin(state.pinchAngle);
              state.velX += -dirX * (300 + prevTension * 480);
              state.velY += -dirY * (300 + prevTension * 480);
              state.velScaleX += 3.2;
              state.velScaleY -= 3.2;
              if (playSound) SoundEngine.playRelease(prevTension);
            }
          },

          onIdleUpdate(dt, state) {
            state.tension = Math.max(0, state.tension - dt * this.physics.coolDownRate);
            state.pinchPull = lerp(state.pinchPull, 0, clamp(dt * 14, 0, 1));
          },

          onBurst(state, api) {
            state.alive = false;
            state.tension = 1;
            state.pinchPull = 0;
            state.screenShake = 18;
            state.respawnReadyAt = performance.now() + 450;

            SoundEngine.playBurst();
            api.addShockwave(api.centerX, api.centerY, api.baseRadius * 0.4, Math.max(api.viewW, api.viewH) * 0.65, 0.38, "#ff2e4c");

            const burstColors = [state.palette.main, "#ff1738", "#ffd166", "#06d6a0", "#4cc9f0", "#ffffff"];
            for (let i = 0; i < 48; i++) {
              const ang = Math.random() * Math.PI * 2;
              const speed = 190 + Math.random() * 520;
              api.addParticle({
                kind: i < 18 ? "shard" : (i % 4 === 0 ? "star" : "confetti"),
                x: api.centerX + (Math.random() - 0.5) * api.baseRadius * 0.5,
                y: api.centerY + (Math.random() - 0.5) * api.baseRadius * 0.5,
                vx: Math.cos(ang) * speed,
                vy: Math.sin(ang) * speed - 120,
                size: 8 + Math.random() * 12,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 18,
                color: i < 18 ? state.palette.main : pick(burstColors),
                gravity: 680,
                maxLife: 0.75 + Math.random() * 0.55
              });
            }

            api.showBurstOverlay(this.texts.burstWord, pick(this.texts.burstMessages), this.texts.respawnLabel);
          },

          render(ctx, state, env) {
            if (!state.alive) return;
            const { cx, cy, baseR, time } = env;
            const palette = state.palette;
            const tension = state.tension;

            const fillColor = mixColor(palette.main, this.dangerColor, Math.pow(tension, 1.3));
            const shadeColor = mixColor(palette.shade, this.dangerShade, Math.pow(tension, 1.3));

            const shakeAmp = tension > 0.05 ? (2 + tension * tension * 14) : 0;
            const shakeX = shakeAmp ? (Math.random() - 0.5) * 2 * shakeAmp : 0;
            const shakeY = shakeAmp ? (Math.random() - 0.5) * 2 * shakeAmp : 0;

            const floatY = Math.sin(time * 2.4) * 6;
            const posX = cx + state.offsetX + shakeX;
            const posY = cy - baseR * 0.06 + floatY + state.offsetY + shakeY;

            const swell = 1 + tension * 0.22;
            const sx = state.scaleX * swell * state.spawnScale;
            const sy = state.scaleY * swell * state.spawnScale;

            ctx.save();
            ctx.translate(posX, posY);
            ctx.rotate(state.rot);
            ctx.scale(sx, sy);

            // 1. 紐
            const knotY = baseR * 1.12;
            const sway1 = Math.sin(time * 2.8) * 14 - state.offsetX * 0.35;
            const sway2 = Math.cos(time * 2.1) * 18 - state.offsetX * 0.5;
            ctx.beginPath();
            ctx.moveTo(0, knotY + 8);
            ctx.bezierCurveTo(sway1, knotY + baseR * 0.45, sway2, knotY + baseR * 0.85, sway1 * 0.7, knotY + baseR * 1.25);
            ctx.strokeStyle = "rgba(43, 45, 66, 0.45)";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            ctx.stroke();

            // 2. 結び目
            ctx.beginPath();
            ctx.moveTo(-10, knotY + 10);
            ctx.lineTo(10, knotY + 10);
            ctx.lineTo(3, knotY - 4);
            ctx.lineTo(-3, knotY - 4);
            ctx.closePath();
            ctx.fillStyle = shadeColor;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // 3. 本体メッシュ
            const points = 56;
            ctx.beginPath();
            for (let i = 0; i <= points; i++) {
              const angle = (i / points) * Math.PI * 2;
              const cosA = Math.cos(angle);
              const sinA = Math.sin(angle);

              let rx = baseR * 0.94;
              let ry = baseR * 1.12;
              if (sinA > 0) rx *= 1 - 0.14 * sinA * sinA;
              else rx *= 1 + 0.05 * (-sinA);

              let px = cosA * rx;
              let py = sinA * ry;

              if (state.dentAmount > 0.005) {
                const diff = Math.atan2(Math.sin(angle - state.dentAngle), Math.cos(angle - state.dentAngle));
                const influence = Math.exp(-(diff * diff) / 0.32);
                const push = 1 - state.dentAmount * 0.42 * influence;
                const oppDiff = Math.atan2(Math.sin(angle - (state.dentAngle + Math.PI)), Math.cos(angle - (state.dentAngle + Math.PI)));
                const bulge = 1 + state.dentAmount * 0.14 * Math.exp(-(oppDiff * oppDiff) / 0.7);
                px *= push * bulge;
                py *= push * bulge;
              }

              if (state.pinchPull > 0.005) {
                const diff = Math.atan2(Math.sin(angle - state.pinchAngle), Math.cos(angle - state.pinchAngle));
                const tip = Math.exp(-(diff * diff) / 0.14);
                const neck = Math.exp(-((Math.abs(diff) - 0.52) ** 2) / 0.09);
                const stretch = 1 + state.pinchPull * (0.58 * tip - 0.11 * neck);
                px *= stretch;
                py *= stretch;
              }

              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();

            const grad = ctx.createRadialGradient(-baseR * 0.3, -baseR * 0.38, baseR * 0.12, 0, 0, baseR * 1.35);
            grad.addColorStop(0, mixColor(fillColor, "#ffffff", 0.25));
            grad.addColorStop(0.55, fillColor);
            grad.addColorStop(1, shadeColor);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // 4. ツヤ
            ctx.save();
            ctx.translate(-baseR * 0.36, -baseR * 0.42);
            ctx.rotate(-0.42);
            ctx.beginPath();
            ctx.ellipse(0, 0, baseR * 0.14, baseR * 0.27, 0, 0, Math.PI * 2);
            ctx.fillStyle = palette.highlight;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-baseR * 0.02, baseR * 0.38, baseR * 0.06, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 5. 表情
            this.renderFace(ctx, state, baseR, time);

            // 6. 汗・血管マーク
            if (tension > 0.35) {
              const alpha = clamp((tension - 0.35) / 0.3, 0, 1);
              ctx.save();
              ctx.globalAlpha = alpha;
              const dropY = -baseR * 0.48 + ((time * 70) % 24);
              ctx.fillStyle = "#4cc9f0";
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(baseR * 0.56, dropY - 12);
              ctx.quadraticCurveTo(baseR * 0.68, dropY + 4, baseR * 0.56, dropY + 10);
              ctx.quadraticCurveTo(baseR * 0.44, dropY + 4, baseR * 0.56, dropY - 12);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            if (tension > 0.65) {
              ctx.save();
              ctx.translate(baseR * 0.36, -baseR * 0.54);
              const pulse = 1 + Math.sin(time * 28) * 0.14;
              ctx.scale(pulse, pulse);
              ctx.strokeStyle = "#ffe066";
              ctx.lineWidth = 4;
              ctx.lineCap = "round";
              const r = 10;
              [
                [-r, -3, -3, -3, -3, -r],
                [r, -3, 3, -3, 3, -r],
                [-r, 3, -3, 3, -3, r],
                [r, 3, 3, 3, 3, r]
              ].forEach(([x1, y1, x2, y2, x3, y3]) => {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.quadraticCurveTo(x2, y2, x3, y3);
                ctx.stroke();
              });
              ctx.restore();
            }

            ctx.restore();
          },

          renderFace(ctx, state, baseR, time) {
            const eyeY = -baseR * 0.06;
            const eyeX = baseR * 0.27;
            ctx.strokeStyle = "#2b2d42";
            ctx.fillStyle = "#2b2d42";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (state.hurtTimer > 0) {
              ctx.lineWidth = 5;
              ctx.beginPath();
              ctx.moveTo(-eyeX - 11, eyeY - 10);
              ctx.lineTo(-eyeX + 9, eyeY);
              ctx.lineTo(-eyeX - 11, eyeY + 10);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(eyeX + 11, eyeY - 10);
              ctx.lineTo(eyeX - 9, eyeY);
              ctx.lineTo(eyeX + 11, eyeY + 10);
              ctx.stroke();

              ctx.beginPath();
              ctx.ellipse(0, baseR * 0.24, baseR * 0.14, baseR * 0.17, 0, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();
              ctx.beginPath();
              ctx.ellipse(0, baseR * 0.31, baseR * 0.08, baseR * 0.06, 0, 0, Math.PI * 2);
              ctx.fillStyle = "#ff8fa3";
              ctx.fill();
            } else if (state.isHolding || state.tension > 0.22) {
              const t = state.tension;
              ctx.lineWidth = 4.5;
              if (t > 0.65) {
                [-eyeX, eyeX].forEach((x) => {
                  ctx.beginPath();
                  ctx.arc(x, eyeY, 13, 0, Math.PI * 2);
                  ctx.fillStyle = "#ffffff";
                  ctx.fill();
                  ctx.stroke();
                  ctx.beginPath();
                  ctx.arc(x + Math.sin(time * 30) * 2, eyeY + Math.cos(time * 30) * 2, 4.5, 0, Math.PI * 2);
                  ctx.fillStyle = "#2b2d42";
                  ctx.fill();
                });
              } else {
                ctx.beginPath();
                ctx.moveTo(-eyeX - 10, eyeY - 7);
                ctx.lineTo(-eyeX + 8, eyeY + 1);
                ctx.lineTo(-eyeX - 9, eyeY + 8);
                ctx.moveTo(eyeX + 10, eyeY - 7);
                ctx.lineTo(eyeX - 8, eyeY + 1);
                ctx.lineTo(eyeX + 9, eyeY + 8);
                ctx.stroke();
              }
              ctx.beginPath();
              const mouthY = baseR * 0.24;
              ctx.moveTo(-22, mouthY);
              ctx.quadraticCurveTo(-11, mouthY - 8 - t * 6, 0, mouthY + 4);
              ctx.quadraticCurveTo(11, mouthY + 14 + t * 6, 22, mouthY);
              ctx.stroke();
            } else {
              ctx.beginPath();
              ctx.arc(-eyeX, eyeY, 7.5, 0, Math.PI * 2);
              ctx.arc(eyeX, eyeY, 7.5, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(-eyeX - 2.5, eyeY - 2.5, 2.6, 0, Math.PI * 2);
              ctx.arc(eyeX - 2.5, eyeY - 2.5, 2.6, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
              ctx.beginPath();
              ctx.ellipse(-eyeX - 10, eyeY + 18, 10, 6, 0, 0, Math.PI * 2);
              ctx.ellipse(eyeX + 10, eyeY + 18, 10, 6, 0, 0, Math.PI * 2);
              ctx.fill();

              ctx.lineWidth = 4.5;
              ctx.beginPath();
              ctx.arc(0, baseR * 0.14, baseR * 0.15, 0.18 * Math.PI, 0.82 * Math.PI);
              ctx.stroke();
            }
          }
        },

        /* -------------------------------------------------------

          initExtra(state) {
            state.soda = {

              overlayShown: false,

              fallingMentos: [],      // 上から落ちてくるメントス粒
              seatedMentos: [],       // ボトル底にたまったメントス粒

            // 初期の炭酸泡を配置
            for (let i = 0; i < 16; i++) {

                nx: (Math.random() - 0.5) * 0.78,
                ny: Math.random(),
                r: 2.2 + Math.random() * 3.8,

          onTap(x, y, state, api) {
            const sd = state.soda;
            sd.mentosCount += 1;
            sd.capOpenTimer = 0.26;
            state.hurtTimer = 0.24;

            // ボトルが少し弾む＆液体がチャポンと揺れる
            state.velY += 110;
            state.velScaleX += 1.9;
            state.velScaleY -= 1.9;
            sd.sloshVel += (Math.random() > 0.5 ? 1 : -1) * 5.5;

            // メントス投入でベース炭酸圧も少し上昇（投入だけでは最大62%までにして振る楽しみを残す）
            if (state.tension < 0.62) {
              state.tension = Math.min(0.62, state.tension + 0.045);
            }

            // 上からボトル口へ落ちるメントス粒を追加
            const mentosPalette = ["#ffffff", "#fff0f6", "#e7f5ff", "#fff9db", "#ebfbee"];
            sd.fallingMentos.push({
              progress: 0,
              startXOffset: clamp((x - api.centerX) * 0.35, -60, 60),

            });

            // 泡を一気に増やす
            const extraBubbles = Math.min(4 + Math.floor(sd.mentosCount / 3), 10);
            for (let i = 0; i < extraBubbles; i++) {
              if (sd.bubbles.length < 70) {
                sd.bubbles.push({
                  nx: (Math.random() - 0.5) * 0.75,
                  ny: 0.05 + Math.random() * 0.2,
                  r: 2.5 + Math.random() * 4.5,
                  speed: 0.55 + Math.random() * 0.85
                });
              }

            // ボトル口から小さな泡スパーク

                vx: Math.cos(ang) * spd,

                size: 4 + Math.random() * 5,
                rot: 0,
                vRot: 0,
                color: state.palette.foam,
                gravity: 340,
                maxLife: 0.35 + Math.random() * 0.18
              });
            }

            api.incrementAction();
            api.pulseMentosHUD();
            SoundEngine.playMentosDrop(sd.mentosCount);

            // メントス数に応じたコミカル擬音
            let wordPool = this.texts.mentosWordsLow;
            let color = "#0077b6";
            if (sd.mentosCount >= 8) {
              wordPool = this.texts.mentosWordsHigh;
              color = "#ff0054";
            } else if (sd.mentosCount >= 4) {
              wordPool = this.texts.mentosWordsMid;
              color = "#f77f00";
