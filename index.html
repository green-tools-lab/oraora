          feedOneSnack(originX, originY, state, api, tensionGain) {
            const sn = state.snack;
            if (!sn || !state.alive) return;

            sn.eatenCount += 1;
            sn.chewTimer = 0.34;
            sn.digestDelay = 2.8;
            sn.bellyVel += 4.2;

            state.tension = clamp(state.tension + tensionGain, 0, 1);
            state.velY += 70;
            state.velScaleX += 1.45;
            state.velScaleY -= 1.35;

            const emoji = pick(this.texts.snacks);
            const side = originX >= api.centerX ? 1 : -1;
            sn.flyingSnacks.push({
              emoji,
              progress: 0,
              startX: clamp(originX, 40, api.viewW - 40),
              startY: clamp(originY, 120, api.viewH - 120),
              arcX: side * (25 + Math.random() * 35),
              rot: (Math.random() - 0.5) * 1.4
            });

            api.incrementAction();
            api.pulseSubHUD();
            SoundEngine.playSnackEat(sn.eatenCount);

            // お菓子のかけらパーティクル
            const mouthY = api.centerY - api.baseRadius * 0.24;
            for (let i = 0; i < 5; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 70 + Math.random() * 110;
              api.addParticle({
                kind: i === 0 ? "star" : "confetti",
                x: api.centerX + (Math.random() - 0.5) * 26,
                y: mouthY,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 45,
                size: 5 + Math.random() * 4,
                rot: Math.random() * Math.PI,
                vRot: (Math.random() - 0.5) * 12,
                color: pick(["#ffd166", "#ff8fab", "#ffffff", "#f4a261"]),
                gravity: 340,
                maxLife: 0.36
              });
            }

            // 限界が近いとホックからも軋み音＆スパーク
            if (state.tension >= 0.58 && state.tension < 1) {
              SoundEngine.playHookStrain(state.tension);
              const waistY = api.centerY + api.baseRadius * 0.54;
              for (let i = 0; i < 4; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 90 + Math.random() * 120;
                api.addParticle({
                  kind: "spark",
                  x: api.centerX,
                  y: waistY,
                  vx: Math.cos(ang) * spd,
                  vy: Math.sin(ang) * spd,
                  size: 5 + Math.random() * 5,
                  rot: ang,
                  vRot: 0,
                  color: pick(["#ffbe0b", "#ff2e4c", "#ffffff"]),
                  gravity: 200,
                  maxLife: 0.26
                });
              }
            }

            // 状態に応じたコミカル擬音
            let pool = this.texts.eatWordsLow;
            let col = "#e76f51";
            if (state.tension >= 0.75) {
              pool = this.texts.eatWordsHigh;
              col = "#ff0054";
            } else if (state.tension >= 0.42) {
              pool = this.texts.eatWordsMid;
              col = "#f77f00";
            }
            api.addPopup(
              pick(pool),
              clamp(originX + (Math.random() - 0.5) * 30, 75, api.viewW - 75),
              Math.min(originY - 26, api.centerY - api.baseRadius * 0.65),
              col,
              state.tension >= 0.75 ? 32 : 28
            );

            if (state.tension >= 1) {
              api.triggerBurst();
            }
          },

          onTap(x, y, state, api) {
            this.feedOneSnack(x, y, state, api, 0.095);
          },

          onHoldStart(x, y, state, api) {
            state.snack.eatCooldown = 0;
            state.snack.strainSoundTimer = 0.05;
            this.feedOneSnack(x, y, state, api, 0.065);
          },

          onHoldMove() {},

          onHoldUpdate(dt, state, api) {
            const sn = state.snack;
            sn.digestDelay = 2.8;
            // 押し続けている間もお腹がじわじわ膨らみつつ、テンポよくお菓子を口に放り込む！
            state.tension = clamp(state.tension + dt / (this.physics.holdDuration * 1.45), 0, 1);

            sn.eatCooldown -= dt;
            if (sn.eatCooldown <= 0 && state.tension < 1) {
              sn.eatCooldown = lerp(0.24, 0.14, state.tension);
              const side = Math.random() > 0.5 ? 1 : -1;
              const sx = api.centerX + side * (api.baseRadius * (0.75 + Math.random() * 0.45));
              const sy = api.centerY + (Math.random() - 0.2) * api.baseRadius * 0.7;
              this.feedOneSnack(sx, sy, state, api, 0.048);
            }

            if (state.tension >= 0.5) {
              sn.strainSoundTimer -= dt;
              if (sn.strainSoundTimer <= 0 && state.alive) {
                SoundEngine.playHookStrain(state.tension);
                sn.strainSoundTimer = lerp(0.26, 0.09, (state.tension - 0.5) / 0.5);
              }
            }

            if (state.tension >= 1 && state.alive) {
              api.triggerBurst();
            }
          },

          onHoldEnd() {},

          onIdleUpdate(dt, state) {
            const sn = state.snack;
            if (!sn) return;
            if (sn.digestDelay > 0) {
              sn.digestDelay = Math.max(0, sn.digestDelay - dt);
            } else if (state.tension > 0) {
              state.tension = Math.max(0, state.tension - dt * this.physics.coolDownRate);
            }
          },

          onPostPhysics(dt, state, api) {
            const sn = state.snack;
            if (!sn) return;

            sn.chewTimer = Math.max(0, sn.chewTimer - dt);

            // お腹のボヨンボヨン揺れバネ
            const bAcc = -180 * sn.bellyJiggle - 7.5 * sn.bellyVel;
            sn.bellyVel += bAcc * dt;
            sn.bellyJiggle = clamp(sn.bellyJiggle + sn.bellyVel * dt, -0.35, 0.45);

            // 口へ飛ぶお菓子のアニメーション
            for (let i = sn.flyingSnacks.length - 1; i >= 0; i--) {
              const fs = sn.flyingSnacks[i];
              fs.progress += dt * 4.8;
              if (fs.progress >= 1) {
                sn.flyingSnacks.splice(i, 1);
              }
            }

            // 弾け飛んだ金属ホックの弾道物理
            if (sn.hookPopped) {
              sn.hookVy += 980 * dt;
              sn.hookX += sn.hookVx * dt;
              sn.hookY += sn.hookVy * dt;
              sn.hookRot += sn.hookVRot * dt;
            }

            if (!state.alive && !sn.overlayShown) {
              sn.overlayDelay -= dt;
              if (sn.overlayDelay <= 0) {
                sn.overlayShown = true;
                api.showBurstOverlay(sn.pendingOno, sn.pendingMsg, this.texts.respawnLabel);
              }
            }
          },

          onBurst(state, api) {
            const sn = state.snack;
            state.alive = false;
            state.tension = 1;

            // ホックがウエストから弾丸のように斜め上へ吹っ飛ぶ！
            const waistY = api.centerY + api.baseRadius * 0.54;
            sn.hookPopped = true;
            sn.hookX = api.centerX;
            sn.hookY = waistY;
            const flyDir = Math.random() > 0.5 ? 1 : -1;
            sn.hookVx = flyDir * (290 + Math.random() * 190);
            sn.hookVy = -(620 + Math.random() * 180);
            sn.hookRot = 0;
            sn.hookVRot = flyDir * 24;

            // 解放されたお腹がボヨンッと弾む！
            sn.bellyVel = 14.5;
            state.velY = -170;
            state.velScaleX = 3.2;
            state.velScaleY = -2.6;
            state.screenShake = 16;

            sn.overlayShown = false;
            sn.overlayDelay = 0.68;
            state.respawnReadyAt = performance.now() + 900;

            SoundEngine.playHookPop();
            api.pulseSubHUD();

            // ウエスト位置から強烈な衝撃リング＋火花＋星エフェクト
            api.addShockwave(api.centerX, waistY, 12, api.baseRadius * 1.55, 0.34, "#ff2e4c");
            api.addShockwave(api.centerX, waistY, 8, api.baseRadius * 1.05, 0.25, "#ffd166");

            const burstColors = ["#ffd166", "#ff2e4c", "#ff8fab", "#ffffff", "#4cc9f0"];
            for (let i = 0; i < 36; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 160 + Math.random() * 420;
              api.addParticle({
                kind: i % 3 === 0 ? "star" : (i % 3 === 1 ? "spark" : "confetti"),
                x: api.centerX + (Math.random() - 0.5) * 18,
                y: waistY + (Math.random() - 0.5) * 12,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 90,
                size: 6 + Math.random() * 9,
                rot: ang,
                vRot: (Math.random() - 0.5) * 16,
                color: pick(burstColors),
                gravity: 560,
                maxLife: 0.62 + Math.random() * 0.42
              });
            }

            api.addPopup("パチンッ!! ブチッ!!", api.centerX, waistY - 26, "#ff2e4c", 36);
            sn.pendingOno = this.texts.popOno;
            sn.pendingMsg = pick(this.texts.popMessages);
          },

          render(ctx, state, env) {
            const sn = state.snack;
            if (!sn) return;
            const { cx, cy, baseR, time } = env;
            const pal = state.palette;
            const tension = state.tension;
            const popped = !state.alive;

            // おかっぱ女子の頭〜ウエスト・スカートまで全身が綺麗に収まる比率
            const unit = baseR * 0.74;
            const idleFloat = state.alive ? Math.sin(time * 2.3) * 2.5 : 0;
            const strainShake = state.alive && tension > 0.62 ? (tension - 0.62) * 11 : 0;
            const sxShake = strainShake ? (Math.random() - 0.5) * strainShake : 0;
            const syShake = strainShake ? (Math.random() - 0.5) * strainShake : 0;

            const posX = cx + state.offsetX + sxShake;
            const posY = cy - baseR * 0.04 + idleFloat + state.offsetY + syShake;

            // お腹の膨らみ係数（食べるほどぽっこり、外れたらボヨンッとさらに解放！）
            const bellyCurve = popped
              ? 1.18 + sn.bellyJiggle * 0.45
              : Math.pow(tension, 0.9) + sn.bellyJiggle * 0.16;

            ctx.save();
            ctx.translate(posX, posY);
            ctx.rotate(state.rot);
            ctx.scale(state.scaleX * state.spawnScale, state.scaleY * state.spawnScale);

            const hairColor = "#24222c";
            const hairHighlight = "rgba(255, 255, 255, 0.22)";
            const skinColor = "#ffe2cc";
            const skinShade = "#f7c7a7";

            // 各パーツの基準Y座標
            const headCy = -unit * 0.88;
            const headR = unit * 0.84;
            const shoulderY = unit * 0.04;
            const waistY = unit * 0.78;
            const skirtBottomY = unit * 1.56;

            /* --- 1. 後ろ髪（ぱっつん内巻きおかっぱ） --- */
            ctx.beginPath();
            ctx.moveTo(-headR * 1.16, headCy + headR * 0.72);
            ctx.bezierCurveTo(-headR * 1.24, headCy - headR * 0.3, -headR * 1.02, headCy - headR * 1.24, 0, headCy - headR * 1.24);
            ctx.bezierCurveTo(headR * 1.02, headCy - headR * 1.24, headR * 1.24, headCy - headR * 0.3, headR * 1.16, headCy + headR * 0.72);
            ctx.quadraticCurveTo(headR * 1.1, headCy + headR * 1.0, headR * 0.7, headCy + headR * 0.95);
            ctx.lineTo(-headR * 0.7, headCy + headR * 0.95);
            ctx.quadraticCurveTo(-headR * 1.1, headCy + headR * 1.0, -headR * 1.16, headCy + headR * 0.72);
            ctx.closePath();
            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.lineWidth = 4.2;
            ctx.strokeStyle = "#181720";
            ctx.stroke();

            /* --- 2. 腕（お菓子をモグモグ食べる動き＆外れた後は慌ててお腹を押さえる！） --- */
            const armWave = sn.chewTimer > 0 ? Math.sin((sn.chewTimer / 0.34) * Math.PI * 2) * 14 : 0;
            const drawArm = (side) => {
              ctx.save();
              ctx.lineWidth = 3.8;
              ctx.strokeStyle = "#2b2d42";
              ctx.fillStyle = pal.top;

              const sx = side * unit * 0.62;
              const sy = shoulderY + unit * 0.14;
              const ex = side * unit * (0.94 + bellyCurve * 0.12);
              const ey = popped
                ? waistY - unit * 0.04
                : (sn.chewTimer > 0 && side === 1 ? headCy + headR * 0.65 - armWave : shoulderY + unit * 0.62);

              ctx.beginPath();
              ctx.moveTo(sx, sy);
              ctx.quadraticCurveTo(side * unit * 1.06, sy + unit * 0.25, ex, ey);
              ctx.lineWidth = unit * 0.28;
              ctx.lineCap = "round";
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              ctx.lineWidth = unit * 0.2;
              ctx.strokeStyle = pal.top;
              ctx.stroke();

              // 小さな丸い手
              ctx.beginPath();
              ctx.arc(ex, ey, unit * 0.13, 0, Math.PI * 2);
              ctx.fillStyle = skinColor;
              ctx.fill();
              ctx.lineWidth = 3.2;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
              ctx.restore();
            };
            drawArm(-1);
            drawArm(1);

            /* --- 3. 上半身（トップス＋ぽっこり膨らむお腹！） --- */
            const waistHalfW = unit * (0.64 + bellyCurve * 0.28);
            const torsoBulge = unit * (0.04 + bellyCurve * 0.24);

            ctx.beginPath();
            ctx.moveTo(-unit * 0.56, shoulderY + unit * 0.08);
            ctx.quadraticCurveTo(-unit * 0.25, shoulderY - unit * 0.06, 0, shoulderY - unit * 0.06);
            ctx.quadraticCurveTo(unit * 0.25, shoulderY - unit * 0.06, unit * 0.56, shoulderY + unit * 0.08);
            // 右わき腹（食べるほど外へ丸く膨らむ！）
            ctx.bezierCurveTo(
              unit * 0.72 + torsoBulge, shoulderY + unit * 0.35,
              waistHalfW + torsoBulge * 0.5, waistY - unit * 0.12,
              waistHalfW, waistY + unit * 0.06
            );
            ctx.lineTo(-waistHalfW, waistY + unit * 0.06);
            // 左わき腹
            ctx.bezierCurveTo(
              -waistHalfW - torsoBulge * 0.5, waistY - unit * 0.12,
              -unit * 0.72 - torsoBulge, shoulderY + unit * 0.35,
              -unit * 0.56, shoulderY + unit * 0.08
            );
            ctx.closePath();
            ctx.fillStyle = pal.top;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // ぽっこりお腹の丸みを強調する陰影＆ハイライト（食べるほどくっきり！）
            if (bellyCurve > 0.18) {
              const bAlpha = clamp((bellyCurve - 0.18) / 0.7, 0, 1);
              ctx.save();
              ctx.globalAlpha = bAlpha;
              // お腹の丸いふくらみライン
              const bellyR = unit * (0.34 + bellyCurve * 0.2);
              const bellyCy = waistY - unit * 0.18;
              const bGrad = ctx.createRadialGradient(-bellyR * 0.25, bellyCy - bellyR * 0.25, 4, 0, bellyCy, bellyR * 1.15);
              bGrad.addColorStop(0, "#ffffff");
              bGrad.addColorStop(0.65, pal.top);
              bGrad.addColorStop(1, "rgba(43, 45, 66, 0.12)");
              ctx.beginPath();
              ctx.ellipse(0, bellyCy, bellyR * 1.15, bellyR * 0.76, 0, 0, Math.PI * 2);
              ctx.fillStyle = bGrad;
              ctx.fill();

              // 服のパツパツ張りジワ（放射状の小さな線）
              ctx.strokeStyle = "rgba(43, 45, 66, 0.28)";
              ctx.lineWidth = 2.4;
              ctx.lineCap = "round";
              [-1, 1].forEach((dir) => {
                ctx.beginPath();
                ctx.moveTo(dir * bellyR * 0.72, bellyCy - unit * 0.08);
                ctx.quadraticCurveTo(dir * bellyR * 0.92, bellyCy + unit * 0.02, dir * bellyR * 0.85, bellyCy + unit * 0.16);
                ctx.stroke();
              });
              ctx.restore();
            }

            // 可愛い襟＆リボン
            ctx.beginPath();
            ctx.moveTo(-unit * 0.28, shoulderY);
            ctx.quadraticCurveTo(-unit * 0.12, shoulderY + unit * 0.26, 0, shoulderY + unit * 0.12);
            ctx.quadraticCurveTo(unit * 0.12, shoulderY + unit * 0.26, unit * 0.28, shoulderY);
            ctx.fillStyle = pal.collar;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            /* --- 4. ハイウエストスカート＆限界ホック!! --- */
            const bandH = unit * 0.24;
            const skirtTopW = waistHalfW * (popped ? 1.06 : 1.0);
            const skirtBotW = unit * (0.98 + bellyCurve * 0.24);

            // スカート本体（台形プリーツ）
            ctx.beginPath();
            ctx.moveTo(-skirtTopW, waistY + bandH * 0.85);
            ctx.lineTo(skirtTopW, waistY + bandH * 0.85);
            ctx.lineTo(skirtBotW, skirtBottomY);
            ctx.quadraticCurveTo(0, skirtBottomY + unit * 0.1, -skirtBotW, skirtBottomY);
            ctx.closePath();
            ctx.fillStyle = pal.skirt;
            ctx.fill();
            ctx.lineWidth = 4.2;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // プリーツ線
            ctx.strokeStyle = pal.skirtShade;
            ctx.lineWidth = 3;
            [-0.58, -0.28, 0.28, 0.58].forEach((r) => {
              ctx.beginPath();
              ctx.moveTo(skirtTopW * r, waistY + bandH);
              ctx.lineTo(skirtBotW * r * 1.05, skirtBottomY + unit * 0.02);
              ctx.stroke();
            });

            // 中央の前立てライン
            ctx.beginPath();
            ctx.moveTo(0, waistY + bandH);
            ctx.lineTo(0, skirtBottomY + unit * 0.04);
            ctx.strokeStyle = "#2b2d42";
            ctx.lineWidth = 2.8;
            ctx.stroke();

            // ウエストベルト帯（ホックが付いている最重要パーツ！）
            const bandTop = waistY - bandH * 0.15;
            const gapPull = popped
              ? unit * 0.34
              : (tension > 0.38 ? Math.pow((tension - 0.38) / 0.62, 1.35) * unit * 0.22 : 0);

            if (!popped) {
              // ベルト左右ベース
              drawRoundedRect(ctx, -skirtTopW - 2, bandTop, (skirtTopW + 2) * 2, bandH, 7);
              ctx.fillStyle = pal.skirtShade;
              ctx.fill();
              ctx.lineWidth = 4;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              // 引っ張られて少し開いてきた隙間からトップスの生地が覗く演出
              if (gapPull > 1.5) {
                ctx.beginPath();
                ctx.moveTo(-gapPull * 0.72, bandTop + 3);
                ctx.lineTo(gapPull * 0.72, bandTop + 3);
                ctx.lineTo(gapPull * 0.28, bandTop + bandH - 3);
                ctx.lineTo(-gapPull * 0.28, bandTop + bandH - 3);
                ctx.closePath();
                ctx.fillStyle = pal.top;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#2b2d42";
                ctx.stroke();
              }

              // 限界で震える金属ホック（左のフック＋右の留め具＋ボタン）
              const hookShakeX = tension > 0.55 ? (Math.random() - 0.5) * (tension - 0.55) * 10 : 0;
              const hookShakeY = tension > 0.55 ? (Math.random() - 0.5) * (tension - 0.55) * 7 : 0;
              const hCy = bandTop + bandH * 0.5 + hookShakeY;
              const metalColor = tension > 0.72 ? mixColor("#e2e8f0", "#ff3b5c", (tension - 0.72) / 0.28) : "#e9eef5";

              ctx.save();
              ctx.translate(hookShakeX, 0);

              // 右の受け金具（バー）
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 6;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(gapPull * 0.68 + 6, hCy - 7);
              ctx.lineTo(gapPull * 0.68 + 6, hCy + 7);
              ctx.stroke();
              ctx.strokeStyle = metalColor;
              ctx.lineWidth = 3;
              ctx.stroke();

              // 左から右へ必死に引っ張られるフック金具（コの字フック）
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 6.5;
              ctx.beginPath();
              ctx.moveTo(-gapPull * 0.68 - 9, hCy);
              ctx.lineTo(gapPull * 0.68 + 5, hCy);
              ctx.stroke();
              ctx.strokeStyle = metalColor;
              ctx.lineWidth = 3.4;
              ctx.stroke();

              // 左の丸ボタン（ホック留めボタン）
              ctx.beginPath();
              ctx.arc(-gapPull * 0.68 - 11, hCy, 7.5, 0, Math.PI * 2);
              ctx.fillStyle = metalColor;
              ctx.fill();
              ctx.lineWidth = 2.8;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              // ボタンの縫い穴2つ
              ctx.fillStyle = "#2b2d42";
              ctx.beginPath();
              ctx.arc(-gapPull * 0.68 - 13, hCy, 1.4, 0, Math.PI * 2);
              ctx.arc(-gapPull * 0.68 - 9, hCy, 1.4, 0, Math.PI * 2);
              ctx.fill();

              // ギチギチ緊張ライン（60%超えでピキピキ光る！）
              if (tension > 0.52) {
                const sAlpha = clamp((tension - 0.52) / 0.35, 0, 1);
                ctx.globalAlpha = sAlpha;
                ctx.strokeStyle = tension > 0.78 ? "#ff2e4c" : "#ff9f1c";
                ctx.lineWidth = 3;
                const pulse = 1 + Math.sin(time * 32) * 0.16;
                for (let k = 0; k < 6; k++) {
                  const ang = (k / 6) * Math.PI * 2 + 0.3;
                  const r0 = (16 + gapPull * 0.4) * pulse;
                  const r1 = (26 + gapPull * 0.5) * pulse;
                  ctx.beginPath();
                  ctx.moveTo(Math.cos(ang) * r0, hCy + Math.sin(ang) * r0 * 0.75);
                  ctx.lineTo(Math.cos(ang) * r1, hCy + Math.sin(ang) * r1 * 0.75);
                  ctx.stroke();
                }
              }

              ctx.restore();
            } else {
              // ホックが弾け飛んだ後：ベルトがパカッと左右に開き、解放されたぽっこりお腹がボヨンッと前に！
              // 中からトップスの丸い裾が可愛く覗く（完全健全コミカル表現）
              ctx.beginPath();
              ctx.ellipse(0, bandTop + bandH * 0.25, unit * 0.42, unit * 0.28, 0, 0, Math.PI * 2);
              ctx.fillStyle = pal.top;
              ctx.fill();
              ctx.lineWidth = 3.5;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              // 左ベルト（少しめくれて垂れる）
              ctx.save();
              ctx.translate(-gapPull * 0.65, bandTop);
              ctx.rotate(-0.18);
              drawRoundedRect(ctx, -(skirtTopW - gapPull * 0.5), 0, skirtTopW - gapPull * 0.45, bandH, 6);
              ctx.fillStyle = pal.skirtShade;
              ctx.fill();
              ctx.lineWidth = 3.8;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
              ctx.restore();

              // 右ベルト（少しめくれて垂れる）
              ctx.save();
              ctx.translate(gapPull * 0.65, bandTop);
              ctx.rotate(0.18);
              drawRoundedRect(ctx, 0, 0, skirtTopW - gapPull * 0.45, bandH, 6);
              ctx.fillStyle = pal.skirtShade;
              ctx.fill();
              ctx.lineWidth = 3.8;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
              ctx.restore();

              // ホックがあった場所からほわほわ湯気（解放感！）
              ctx.save();
              ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
              ctx.lineWidth = 3.5;
              ctx.lineCap = "round";
              for (let k = -1; k <= 1; k++) {
                const wx = k * 16;
                const wy = bandTop - 8 - ((time * 32 + (k + 1) * 9) % 24);
                ctx.beginPath();
                ctx.moveTo(wx, wy + 12);
                ctx.quadraticCurveTo(wx + 5, wy + 6, wx, wy);
                ctx.stroke();
              }
              ctx.restore();
            }

            /* --- 5. 首と顔（おかっぱ女子の可愛い顔＋表情変化） --- */
            drawRoundedRect(ctx, -headR * 0.2, headCy + headR * 0.72, headR * 0.4, headR * 0.42, 10);
            ctx.fillStyle = skinShade;
            ctx.fill();
            ctx.lineWidth = 3.4;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // もぐもぐ中はほっぺがぷくっと動く
            const chewPuff = sn.chewTimer > 0 ? Math.abs(Math.sin((sn.chewTimer / 0.34) * Math.PI * 2)) * 0.08 : 0;

            ctx.beginPath();
            ctx.moveTo(0, headCy - headR * 0.9);
            ctx.bezierCurveTo(
              headR * 0.96, headCy - headR * 0.9,
              headR * (0.98 + chewPuff), headCy + headR * 0.15,
              headR * (0.86 + chewPuff * 0.8), headCy + headR * 0.56
            );
            ctx.quadraticCurveTo(headR * 0.56, headCy + headR * 0.92, 0, headCy + headR * 0.93);
            ctx.quadraticCurveTo(-headR * 0.56, headCy + headR * 0.92, -headR * (0.86 + chewPuff * 0.8), headCy + headR * 0.56);
            ctx.bezierCurveTo(
              -headR * (0.98 + chewPuff), headCy + headR * 0.15,
              -headR * 0.96, headCy - headR * 0.9,
              0, headCy - headR * 0.9
            );
            ctx.closePath();

            const faceTint = popped
              ? "#ffcfc2"
              : (tension > 0.6 ? mixColor(skinColor, "#ffc2be", (tension - 0.6) * 0.8) : skinColor);
            ctx.fillStyle = faceTint;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // 表情パーツ
            const eyeY = headCy + headR * 0.06;
            const eyeX = headR * 0.36;
            const mouthY = headCy + headR * 0.47;

            // チーク（弾け飛んだ後は真っ赤に照れる！）
            ctx.fillStyle = popped ? "rgba(255, 77, 109, 0.58)" : "rgba(255, 118, 148, 0.4)";
            ctx.beginPath();
            ctx.ellipse(-headR * 0.5, headCy + headR * 0.28, headR * 0.16, headR * 0.1, 0, 0, Math.PI * 2);
            ctx.ellipse(headR * 0.5, headCy + headR * 0.28, headR * 0.16, headR * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#2b2d42";
            ctx.fillStyle = "#2b2d42";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (popped) {
              // ホックが飛んだ直後の「真っ赤＆びっくり恥ずかし顔！」
              ctx.lineWidth = 3.8;
              [-eyeX, eyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.arc(ex, eyeY, 11.5, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(ex, eyeY, 3.6, 0, Math.PI * 2);
                ctx.fillStyle = "#2b2d42";
                ctx.fill();
              });
              // アワアワ震える口
              ctx.beginPath();
              ctx.moveTo(-14, mouthY + 4);
              ctx.quadraticCurveTo(-7, mouthY - 5, 0, mouthY + 4);
              ctx.quadraticCurveTo(7, mouthY - 5, 14, mouthY + 4);
              ctx.stroke();
            } else if (tension >= 0.72) {
              // ホック限界間近：焦りつつも食べちゃう「＞ ＜」顔！
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(-eyeX - 10, eyeY - 8);
              ctx.lineTo(-eyeX + 8, eyeY);
              ctx.lineTo(-eyeX - 10, eyeY + 8);
              ctx.moveTo(eyeX + 10, eyeY - 8);
              ctx.lineTo(eyeX - 8, eyeY);
              ctx.lineTo(eyeX + 10, eyeY + 8);
              ctx.stroke();

              // 大きな口 or 歯を食いしばる口
              if (sn.chewTimer > 0.16) {
                ctx.beginPath();
                ctx.ellipse(0, mouthY, 12, 10, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#e63960";
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.stroke();
              } else {
                ctx.beginPath();
                ctx.moveTo(-14, mouthY + 2);
                ctx.quadraticCurveTo(0, mouthY - 6, 14, mouthY + 2);
                ctx.stroke();
              }
            } else if (sn.chewTimer > 0) {
              // モグモグ幸せ顔（^ ^）＋パクッと口！
              ctx.lineWidth = 4;
              [-eyeX, eyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.arc(ex, eyeY + 4, 11, 1.15 * Math.PI, 1.85 * Math.PI);
                ctx.stroke();
              });
              if (sn.chewTimer > 0.18) {
                // あーん！大きく開いた口
                ctx.beginPath();
                ctx.ellipse(0, mouthY, 13, 12, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#e63960";
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.stroke();
              } else {
                // ほっぺ膨らませてモグモグ
                ctx.beginPath();
                ctx.moveTo(-11, mouthY);
                ctx.quadraticCurveTo(0, mouthY + 9, 11, mouthY);
                ctx.stroke();
              }
            } else {
              // 通常時：お菓子待ちのキラキラ瞳＆にっこり口
              [-eyeX, eyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.ellipse(ex, eyeY, 9.5, 11.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#2b2d42";
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(ex - 3, eyeY - 4, 3.4, 0, Math.PI * 2);
                ctx.arc(ex + 3, eyeY + 4, 1.6, 0, Math.PI * 2);
                ctx.fill();
              });
              ctx.lineWidth = 3.5;
              ctx.beginPath();
              ctx.arc(0, mouthY - 4, 11, 0.15 * Math.PI, 0.85 * Math.PI);
              ctx.stroke();
            }

            /* --- 6. おかっぱの前髪＆サイドの髪 --- */
            ctx.fillStyle = hairColor;
            ctx.strokeStyle = "#181720";
            ctx.lineWidth = 3.8;

            // 左サイド
            ctx.beginPath();
            ctx.moveTo(-headR * 0.86, headCy - headR * 0.62);
            ctx.bezierCurveTo(-headR * 1.16, headCy - headR * 0.1, -headR * 1.14, headCy + headR * 0.58, -headR * 0.72, headCy + headR * 0.94);
            ctx.quadraticCurveTo(-headR * 0.76, headCy + headR * 0.48, -headR * 0.82, headCy - headR * 0.15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 右サイド
            ctx.beginPath();
            ctx.moveTo(headR * 0.86, headCy - headR * 0.62);
            ctx.bezierCurveTo(headR * 1.16, headCy - headR * 0.1, headR * 1.14, headCy + headR * 0.58, headR * 0.72, headCy + headR * 0.94);
            ctx.quadraticCurveTo(headR * 0.76, headCy + headR * 0.48, headR * 0.82, headCy - headR * 0.15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // ぱっつん前髪
            const bangY = headCy - headR * 0.22;
            ctx.beginPath();
            ctx.moveTo(-headR * 0.92, headCy - headR * 0.35);
            ctx.quadraticCurveTo(-headR * 0.92, headCy - headR * 1.15, 0, headCy - headR * 1.16);
            ctx.quadraticCurveTo(headR * 0.92, headCy - headR * 1.15, headR * 0.92, headCy - headR * 0.35);
            ctx.lineTo(headR * 0.84, bangY);
            ctx.lineTo(headR * 0.36, bangY + 2);
            ctx.lineTo(headR * 0.31, bangY - 10);
            ctx.lineTo(headR * 0.26, bangY + 2);
            ctx.lineTo(-headR * 0.24, bangY + 2);
            ctx.lineTo(-headR * 0.29, bangY - 10);
            ctx.lineTo(-headR * 0.34, bangY + 2);
            ctx.lineTo(-headR * 0.84, bangY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 天使の輪ハイライト
            ctx.save();
            ctx.strokeStyle = hairHighlight;
            ctx.lineWidth = 6.5;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.arc(0, headCy - headR * 0.2, headR * 0.68, 1.2 * Math.PI, 1.46 * Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, headCy - headR * 0.2, headR * 0.68, 1.56 * Math.PI, 1.76 * Math.PI);
            ctx.stroke();
            ctx.restore();

            // ヘアピン
            ctx.save();
            ctx.translate(-headR * 0.54, headCy - headR * 0.44);
            ctx.rotate(-0.22);
            drawRoundedRect(ctx, -13, -3.5, 26, 7, 3.5);
            ctx.fillStyle = pal.pin;
            ctx.fill();
            ctx.lineWidth = 2.4;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();
            ctx.restore();

            // 焦りの冷や汗（ホックがキツくなってきたら＆弾けた後）
            if (tension > 0.55 || popped) {
              ctx.save();
              const dropY = headCy - headR * 0.1 + ((time * 65) % 18);
              ctx.fillStyle = "#4cc9f0";
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(headR * 0.72, dropY - 9);
              ctx.quadraticCurveTo(headR * 0.82, dropY + 4, headR * 0.72, dropY + 9);
              ctx.quadraticCurveTo(headR * 0.62, dropY + 4, headR * 0.72, dropY - 9);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            /* --- 7. 限界ホックの漫画風ズームアップ枠（55%以上で右脇に表示！） --- */
            if (state.alive && tension >= 0.55) {
              const zAlpha = clamp((tension - 0.55) / 0.2, 0, 1);
              const zoomR = unit * 0.46;
              const zoomX = Math.min(unit * 1.48, (env.viewW * 0.46) - zoomR);
              const zoomY = waistY - unit * 0.16;
              const zPull = clamp((tension - 0.5) / 0.5, 0, 1);
              const zShakeX = (Math.random() - 0.5) * (2 + zPull * 7);
              const zShakeY = (Math.random() - 0.5) * (2 + zPull * 5);

              ctx.save();
              ctx.globalAlpha = zAlpha;

              // リード線（ウエストのホック→ズーム円）
              ctx.beginPath();
              ctx.moveTo(14, bandTop + bandH * 0.5);
              ctx.lineTo(zoomX - zoomR * 0.85, zoomY + zoomR * 0.2);
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 2.8;
              ctx.setLineDash([5, 4]);
              ctx.stroke();
              ctx.setLineDash([]);

              // ズーム円の背景
              ctx.save();
              ctx.translate(zoomX + zShakeX, zoomY + zShakeY);
              ctx.beginPath();
              ctx.arc(0, 0, zoomR, 0, Math.PI * 2);
              ctx.fillStyle = zPull > 0.65 ? "#fff0f3" : "#ffffff";
              ctx.fill();
              ctx.save();
              ctx.clip();

              // 拡大ベルト左右
              const zGap = 4 + zPull * 16;
              ctx.fillStyle = pal.skirtShade;
              ctx.fillRect(-zoomR - 4, -14, zoomR + 4 - zGap * 0.5, 28);
              ctx.fillRect(zGap * 0.5, -14, zoomR + 4, 28);
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 3;
              ctx.strokeRect(-zoomR - 4, -14, zoomR + 4 - zGap * 0.5, 28);
              ctx.strokeRect(zGap * 0.5, -14, zoomR + 4, 28);

              // 拡大された金属ホック（限界でグニャッとたわむ！）
              const metalZ = zPull > 0.55 ? mixColor("#dee2e6", "#ff2e4c", (zPull - 0.55) / 0.45) : "#e9ecef";
              // 右受けバー
              ctx.lineWidth = 7;
              ctx.strokeStyle = "#2b2d42";
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(zGap * 0.5 + 8, -10);
              ctx.lineTo(zGap * 0.5 + 8, 10);
              ctx.stroke();
              ctx.lineWidth = 3.6;
              ctx.strokeStyle = metalZ;
              ctx.stroke();

              // 必死に引っかかるフック（しなり表現）
              ctx.lineWidth = 8;
              ctx.strokeStyle = "#2b2d42";
              ctx.beginPath();
              ctx.moveTo(-zGap * 0.5 - 12, 0);
              ctx.quadraticCurveTo(0, -zPull * 6, zGap * 0.5 + 7, 0);
              ctx.stroke();
              ctx.lineWidth = 4.2;
              ctx.strokeStyle = metalZ;
              ctx.stroke();

              // ズーム枠内のギチチ文字
              ctx.font = `900 ${Math.round(zoomR * 0.34)}px sans-serif`;
              ctx.textAlign = "center";
              ctx.fillStyle = "#ff2e4c";
              ctx.fillText(zPull > 0.72 ? "限界!!" : "ギチチ…", 0, -zoomR * 0.48);

              ctx.restore();
              // ズーム円の太枠
              ctx.beginPath();
              ctx.arc(0, 0, zoomR, 0, Math.PI * 2);
              ctx.lineWidth = 4;
              ctx.strokeStyle = zPull > 0.65 ? "#ff2e4c" : "#2b2d42";
              ctx.stroke();
              ctx.restore();

              ctx.restore();
            }

            ctx.restore();

            /* --- 8. ワールド座標：口へ飛び込むお菓子 --- */
            const worldMouthX = posX;
            const worldMouthY = posY + (headCy + headR * 0.47) * state.scaleY;
            for (const fs of sn.flyingSnacks) {
              const p = fs.progress;
              const inv = 1 - p;
              const ctrlX = (fs.startX + worldMouthX) * 0.5 + fs.arcX;
              const ctrlY = Math.min(fs.startY, worldMouthY) - 65;
              const fx = inv * inv * fs.startX + 2 * inv * p * ctrlX + p * p * worldMouthX;
              const fy = inv * inv * fs.startY + 2 * inv * p * ctrlY + p * p * worldMouthY;
              const fScale = lerp(1.15, 0.45, p);

              ctx.save();
              ctx.translate(fx, fy);
              ctx.rotate(fs.rot + p * 5);
              ctx.scale(fScale, fScale);
              ctx.font = "34px sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(fs.emoji, 0, 0);
              ctx.restore();
            }

            /* --- 9. ワールド座標：弾け飛んだ金属ホック＆ボタン --- */
            if (sn.hookPopped && sn.hookY < env.viewH + 120 && sn.hookX > -120 && sn.hookX < env.viewW + 120) {
              ctx.save();
              ctx.translate(sn.hookX, sn.hookY);
              ctx.rotate(sn.hookRot);

              // 光のスピード線
              ctx.strokeStyle = "rgba(255, 209, 102, 0.85)";
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(-26, -6);
              ctx.lineTo(-8, -3);
              ctx.moveTo(-24, 6);
              ctx.lineTo(-8, 3);
              ctx.stroke();

              // 飛んでいく金属ホック＋丸ボタン
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 6.5;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(-6, 0);
              ctx.lineTo(14, 0);
              ctx.lineTo(14, 7);
              ctx.stroke();
              ctx.strokeStyle = "#e9eef5";
              ctx.lineWidth = 3.2;
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(-8, 0, 9.5, 0, Math.PI * 2);
              ctx.fillStyle = "#f1f5f9";
              ctx.fill();
              ctx.lineWidth = 3;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              ctx.fillStyle = "#2b2d42";
              ctx.beginPath();
              ctx.arc(-10.5, 0, 1.8, 0, Math.PI * 2);
              ctx.arc(-5.5, 0, 1.8, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          }
        }
      };

      const OBJECT_ORDER = ["balloon", "soda", "gum", "pet", "snack"];

      /* =========================================================
       * 4. アプリ状態管理・DOM要素
       * ========================================================= */
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const statActionIconEl = document.getElementById("stat-action-icon");
      const statActionLabelEl = document.getElementById("stat-action-label");
      const actionCountEl = document.getElementById("action-count");
      const statBurstIconEl = document.getElementById("stat-burst-icon");
      const statBurstLabelEl = document.getElementById("stat-burst-label");
      const burstCountEl = document.getElementById("burst-count");
      const statsBarEl = document.getElementById("stats-bar");
      const soundBtnEl = document.getElementById("sound-btn");
      const charSwitcherEl = document.getElementById("char-switcher");
      const subHudEl = document.getElementById("sub-hud");
      const subHudTextEl = document.getElementById("sub-hud-text");
      const subPowerTagEl = document.getElementById("sub-power-tag");
      const gaugeWrapEl = document.getElementById("gauge-wrap");
      const gaugeLabelEl = document.getElementById("gauge-label");
      const gaugePercentEl = document.getElementById("gauge-percent");
      const gaugeFillEl = document.getElementById("gauge-fill");
      const dangerVignetteEl = document.getElementById("danger-vignette");
      const burstOverlayEl = document.getElementById("burst-overlay");
      const burstOnoEl = document.getElementById("burst-onomatopoeia");
      const burstMsgEl = document.getElementById("burst-message");
      const respawnCtaEl = document.getElementById("respawn-cta");
      const respawnCtaOutsideEl = document.getElementById("respawn-cta-outside");
      const hintPillEl = document.getElementById("hint-pill");
      let speechTypeTimer = null;

      function stopSpeechTyping() {
        if (speechTypeTimer !== null) {
          clearInterval(speechTypeTimer);
          speechTypeTimer = null;
        }
      }

      const STORAGE_KEY_V2 = "stress_pop_stats_v2";
      const STORAGE_KEY_V1 = "stress_balloon_stats_v1";

      let currentObjectId = "snack";
      const getCurrentObject = () => OBJECT_CATALOG[currentObjectId];

      // キャラごとの累計カウント
      const statsByChar = {
        balloon: { action: 0, burst: 0 },
        soda: { action: 0, burst: 0 },
        gum: { action: 0, burst: 0 },
        pet: { action: 0, burst: 0 },
        snack: { action: 0, burst: 0 }
      };

      function loadStats() {
        try {
          const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (rawV2) {
            const parsed = JSON.parse(rawV2);
            for (const id of OBJECT_ORDER) {
              if (parsed[id]) {
                statsByChar[id] = {
                  action: Number(parsed[id].action) || 0,
                  burst: Number(parsed[id].burst) || 0
                };
              }
            }
          } else {
            const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
            if (rawV1) {
              const p1 = JSON.parse(rawV1);
              statsByChar.balloon.action = Number(p1.punches) || 0;
              statsByChar.balloon.burst = Number(p1.bursts) || 0;
            }
          }
        } catch (_) {}
        updateStatsUI();
      }

      function saveStats() {
        try {
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(statsByChar));
        } catch (_) {}
      }

      function updateStatsUI() {
        const obj = getCurrentObject();
        const st = statsByChar[currentObjectId] || { action: 0, burst: 0 };
        statActionIconEl.textContent = obj.hud.actionIcon;
        statActionLabelEl.textContent = obj.hud.actionLabel;
        statBurstIconEl.textContent = obj.hud.burstIcon;
        statBurstLabelEl.textContent = obj.hud.burstLabel;
        actionCountEl.textContent = st.action.toLocaleString("ja-JP");
        burstCountEl.textContent = st.burst.toLocaleString("ja-JP");
      }

      function updateSubHUD() {
        const obj = getCurrentObject();
        const info = obj.getSubHudInfo ? obj.getSubHudInfo(state) : null;
        if (!info) {
          subHudEl.classList.remove("visible", "level-mid", "level-high");
          return;
        }
        subHudEl.classList.add("visible");
        subHudTextEl.textContent = info.text;
        subPowerTagEl.textContent = info.tag;
        subHudEl.classList.remove("level-mid", "level-high");
        if (info.level === "mid") subHudEl.classList.add("level-mid");
        else if (info.level === "high") subHudEl.classList.add("level-high");
      }

      function pulseSubHUD() {
        updateSubHUD();
        subHudEl.classList.remove("pop");
        void subHudEl.offsetWidth;
        subHudEl.classList.add("pop");
        setTimeout(() => subHudEl.classList.remove("pop"), 140);
      }

      // 物理＆アニメーション状態
      const state = {
        alive: true,
        respawnReadyAt: 0,
        paletteIndex: 0,
        palette: OBJECT_CATALOG.balloon.colors[0],

        offsetX: 0,
        offsetY: 0,
        velX: 0,
        velY: 0,
        scaleX: 1,
        scaleY: 1,
        velScaleX: 0,
        velScaleY: 0,
        rot: 0,
        velRot: 0,
        spawnScale: 1,

        dentAmount: 0,
        dentAngle: 0,
        hurtTimer: 0,

        isHolding: false,
        pinchPull: 0,
        pinchAngle: 0,
        tension: 0,
        holdSoundTimer: 0,

        screenShake: 0,
        soda: null,
        gum: null,
        pet: null,
        snack: null
      };

      const popups = [];
      const shockwaves = [];
      const particles = [];

      // ポインター操作管理（短押し=タップ / 長押し=ホールド）
      const LONG_PRESS_MS = 175;
      const pointer = {
        active: false,
        id: null,
        downTime: 0,
        downX: 0,
        downY: 0,
        x: 0,
        y: 0,
        longPressTimer: null
      };

      let viewW = window.innerWidth;
      let viewH = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      let centerX = viewW / 2;
      let centerY = viewH / 2;
      let baseRadius = Math.min(viewW, viewH) * 0.25;

      function resizeCanvas() {
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.floor(viewW * dpr);
        canvas.height = Math.floor(viewH * dpr);
        canvas.style.width = `${viewW}px`;
        canvas.style.height = `${viewH}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        centerX = viewW * 0.5;
        centerY = viewH * 0.51;
        baseRadius = clamp(Math.min(viewW, viewH) * 0.255, 82, 144);
      }

      /* =========================================================
       * 5. キャラ共通API＆アクション制御
       * ========================================================= */
      function getApi() {
        return {
          viewW,
          viewH,
          centerX,
          centerY,
          baseRadius,
          incrementAction() {
            statsByChar[currentObjectId].action += 1;
            updateStatsUI();
            saveStats();
          },
          pulseSubHUD,
          addPopup(text, x, y, color = "#ff2e4c", size = 34) {
            popups.push({
              text,
              x: clamp(x, 65, viewW - 65),
              y: clamp(y, 125, viewH - 130),
              vx: (Math.random() - 0.5) * 85,
              vy: -115 - Math.random() * 55,
              rot: (Math.random() - 0.5) * 0.34,
              color,
              size,
              life: 0,
              maxLife: 0.64
            });
          },
          addShockwave(x, y, r, maxR, maxLife, color) {
            shockwaves.push({ x, y, r, maxR, life: 0, maxLife, color });
          },
          addParticle(p) {
            if (particles.length > 260) particles.shift();
            particles.push({ ...p, life: 0 });
          },
          showBurstOverlay(ono, msg, cta) {
            stopSpeechTyping();
            const obj = getCurrentObject();
            const isSpeech = obj.overlayStyle === "speech";
            burstOverlayEl.classList.toggle("pos-bottom", obj.overlayPosition === "bottom");
            burstOverlayEl.classList.toggle("speech-mode", isSpeech);
            burstOnoEl.textContent = ono;
            respawnCtaEl.textContent = cta;
            respawnCtaOutsideEl.textContent = cta;
            burstOverlayEl.classList.add("visible");
            hintPillEl.textContent = obj.hud.hintDead;
            dangerVignetteEl.style.opacity = "0";

            if (isSpeech) {
              // 吹き出しで1文字ずつしゃべるように表示
              const chars = Array.from(msg);
              let idx = 0;
              burstMsgEl.textContent = "";
              speechTypeTimer = setInterval(() => {
                idx += 1;
                burstMsgEl.textContent = chars.slice(0, idx).join("");
                const ch = chars[idx - 1];
                if (idx % 2 === 1 && ch && !/[「」、。！？…〜!\?]/.test(ch)) {
                  SoundEngine.playVoiceBlip();
                }
                if (idx >= chars.length) {
                  stopSpeechTyping();
                }
              }, 36);
            } else {
              burstMsgEl.textContent = msg;
            }
          },
          triggerBurst() {
            triggerBurst();
          }
        };
      }

      function triggerBurst() {
        if (!state.alive) return;
        const obj = getCurrentObject();
        state.isHolding = false;
        statsByChar[currentObjectId].burst += 1;
        updateStatsUI();
        saveStats();
        obj.onBurst(state, getApi());
      }

      function respawnObject(playSound = true, keepFirstColor = false) {
        const obj = getCurrentObject();
        if (keepFirstColor) {
          state.paletteIndex = 0;
        } else {
          state.paletteIndex = (state.paletteIndex + 1 + Math.floor(Math.random() * Math.max(1, obj.colors.length - 1))) % obj.colors.length;
        }
        state.palette = obj.colors[state.paletteIndex];

        state.alive = true;
        state.offsetX = 0;
        state.offsetY = 30;
        state.velX = 0;
        state.velY = -160;
        state.scaleX = 0.76;
        state.scaleY = 1.26;
        state.velScaleX = 3.2;
        state.velScaleY = -2.4;
        state.rot = 0;
        state.velRot = 0;
        state.spawnScale = 0.16;
        state.dentAmount = 0;
        state.hurtTimer = 0;
        state.isHolding = false;
        state.pinchPull = 0;
        state.tension = 0;
        state.holdSoundTimer = 0;
        state.soda = null;
        state.gum = null;
        state.pet = null;
        state.snack = null;

        if (obj.initExtra) obj.initExtra(state);

        stopSpeechTyping();
        burstOverlayEl.classList.remove("visible", "pos-bottom", "speech-mode");
        dangerVignetteEl.style.opacity = "0";
        hintPillEl.textContent = obj.hud.hintAlive;
        updateSubHUD();
        if (playSound) SoundEngine.playSpawn();
      }

      function switchCharacter(newId) {
        if (!OBJECT_CATALOG[newId] || newId === currentObjectId) return;
        clearLongPressTimer();
        pointer.active = false;
        pointer.id = null;

        currentObjectId = newId;
        const obj = getCurrentObject();

        document.body.classList.remove("mode-balloon", "mode-soda", "mode-gum", "mode-pet", "mode-snack");
        if (obj.bodyClass) document.body.classList.add(obj.bodyClass);

        for (const btn of charSwitcherEl.querySelectorAll(".char-tab")) {
          const isActive = btn.dataset.charId === newId;
          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-selected", String(isActive));
        }

        popups.length = 0;
        shockwaves.length = 0;
        particles.length = 0;

        updateStatsUI();
        respawnObject(true, true);
      }

      function buildCharacterSwitcher() {
        charSwitcherEl.innerHTML = "";
        for (const id of OBJECT_ORDER) {
          const obj = OBJECT_CATALOG[id];
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `char-tab${id === currentObjectId ? " active" : ""}`;
          btn.dataset.charId = id;
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", String(id === currentObjectId));
          btn.textContent = `${obj.tabIcon} ${obj.name}`;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            SoundEngine.unlock();
            switchCharacter(id);
          });
          charSwitcherEl.appendChild(btn);
        }
      }

      /* =========================================================
       * 6. 入力イベント処理（iPhone Safari・Android最適化）
       * ========================================================= */
      function clearLongPressTimer() {
        if (pointer.longPressTimer !== null) {
          clearTimeout(pointer.longPressTimer);
          pointer.longPressTimer = null;
        }
      }

      function handlePointerDown(e) {
        if (e.isPrimary === false) return;
        e.preventDefault();
        SoundEngine.unlock();

        if (!state.alive) {
          if (performance.now() >= state.respawnReadyAt) {
            respawnObject(true, false);
          }
          return;
        }

        clearLongPressTimer();
        pointer.active = true;
        pointer.id = e.pointerId;
        pointer.downTime = performance.now();
        pointer.downX = e.clientX;
        pointer.downY = e.clientY;
        pointer.x = e.clientX;
        pointer.y = e.clientY;

        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (_) {}

        state.velScaleX += 0.85;
        state.velScaleY -= 0.85;

        pointer.longPressTimer = setTimeout(() => {
          pointer.longPressTimer = null;
          if (pointer.active && state.alive) {
            state.isHolding = true;
            getCurrentObject().onHoldStart(pointer.x, pointer.y, state, getApi());
          }
        }, LONG_PRESS_MS);
      }

      function handlePointerMove(e) {
        if (!pointer.active || e.pointerId !== pointer.id) return;
        e.preventDefault();
        pointer.x = e.clientX;
        pointer.y = e.clientY;

        const obj = getCurrentObject();
        // 「なでなで」などドラッグ即反応キャラは、10px以上動かしたら待機なしで即ホールド開始
        if (!state.isHolding && state.alive && obj.supportsDragImmediate) {
          const moved = Math.hypot(e.clientX - pointer.downX, e.clientY - pointer.downY);
          if (moved >= 10) {
            clearLongPressTimer();
            state.isHolding = true;
            obj.onHoldStart(pointer.downX, pointer.downY, state, getApi());
          }
        }

        if (state.isHolding && state.alive) {
          obj.onHoldMove(e.clientX, e.clientY, state, getApi());
        }
      }

      function handlePointerUpOrCancel(e) {
        if (!pointer.active || e.pointerId !== pointer.id) return;
        e.preventDefault();
        const elapsed = performance.now() - pointer.downTime;
        const wasHolding = state.isHolding;
        const upX = e.clientX || pointer.x;
        const upY = e.clientY || pointer.y;

        clearLongPressTimer();
        pointer.active = false;
        pointer.id = null;
        state.isHolding = false;

        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}

        const obj = getCurrentObject();
        if (wasHolding) {
          obj.onHoldEnd(state, e.type !== "pointercancel");
        } else if (e.type === "pointerup" && elapsed < LONG_PRESS_MS + 45 && state.alive) {
          obj.onTap(upX, upY, state, getApi());
        }
      }

      canvas.addEventListener("pointerdown", handlePointerDown, { passive: false });
      canvas.addEventListener("pointermove", handlePointerMove, { passive: false });
      canvas.addEventListener("pointerup", handlePointerUpOrCancel, { passive: false });
      canvas.addEventListener("pointercancel", handlePointerUpOrCancel, { passive: false });

      // iOS Safariのダブルタップズーム・長押しメニュー・ピンチ拡大を防止
      canvas.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
      window.addEventListener("blur", () => {
        clearLongPressTimer();
        pointer.active = false;
        if (state.isHolding) {
          state.isHolding = false;
          getCurrentObject().onHoldEnd(state, false);
        }
      });

      soundBtnEl.addEventListener("click", (e) => {
        e.stopPropagation();
        SoundEngine.enabled = !SoundEngine.enabled;
        soundBtnEl.textContent = SoundEngine.enabled ? "🔊" : "🔇";
        soundBtnEl.classList.toggle("muted", !SoundEngine.enabled);
        if (SoundEngine.enabled) {
          SoundEngine.unlock();
          SoundEngine.playSpawn();
        }
      });

      statsBarEl.addEventListener("click", (e) => {
        e.stopPropagation();
        const st = statsByChar[currentObjectId];
        if (st.action === 0 && st.burst === 0) return;
        const obj = getCurrentObject();
        if (window.confirm(`「${obj.name}」のカウントを 0 にリセットしますか？`)) {
          st.action = 0;
          st.burst = 0;
          updateStatsUI();
          saveStats();
        }
      });

      /* =========================================================
       * 7. メイン物理更新＆描画ループ
       * ========================================================= */
      function updateGaugeUI(obj) {
        const pct = Math.round(clamp(state.tension, 0, 1) * 100);
        gaugeFillEl.style.width = `${pct}%`;
        gaugePercentEl.textContent = `${pct}%`;

        const isActive = state.isHolding || pct > 0;
        gaugeWrapEl.classList.toggle("active", isActive);
        gaugeWrapEl.classList.toggle("danger", state.alive && pct >= 70);

        if (!state.alive) {
          gaugeLabelEl.textContent = obj.hud.gaugeBurst;
        } else if (state.isHolding) {
          const cries = obj.texts.holdCry;
          const idx = Math.min(cries.length - 1, Math.floor(state.tension * cries.length));
          gaugeLabelEl.textContent = `${obj.tabIcon} ${cries[idx]}`;
        } else {
          gaugeLabelEl.textContent = obj.hud.gaugeIdle;
        }

        if (currentObjectId === "pet" || currentObjectId === "snack") {
          updateSubHUD();
        }
        if (state.alive && state.tension > 0.38) {
          const vAlpha = clamp((state.tension - 0.38) / 0.62, 0, 1);
          dangerVignetteEl.style.opacity = String(vAlpha * 0.88);
        } else {
          dangerVignetteEl.style.opacity = "0";
        }
      }

      function stepPhysics(dt, obj) {
        const k = obj.physics.springK;
        const d = obj.physics.damping;

        if (state.spawnScale < 1) {
          state.spawnScale = Math.min(1, state.spawnScale + dt * 5.8);
        }

        const directShake = currentObjectId === "soda" && state.isHolding && state.alive;
        if (!directShake) {
          const ax = -k * state.offsetX - d * state.velX;
          const ay = -k * state.offsetY - d * state.velY;
          state.velX += ax * dt;
          state.velY += ay * dt;
          state.offsetX += state.velX * dt;
          state.offsetY += state.velY * dt;

          const aRot = -k * 0.85 * state.rot - d * 0.85 * state.velRot;
          state.velRot += aRot * dt;
          state.rot = clamp(state.rot + state.velRot * dt, -0.55, 0.55);
        }

        const asx = -k * 1.15 * (state.scaleX - 1) - d * 0.9 * state.velScaleX;
        const asy = -k * 1.15 * (state.scaleY - 1) - d * 0.9 * state.velScaleY;
        state.velScaleX += asx * dt;
        state.velScaleY += asy * dt;
        state.scaleX = clamp(state.scaleX + state.velScaleX * dt, 0.58, 1.5);
        state.scaleY = clamp(state.scaleY + state.velScaleY * dt, 0.58, 1.5);

        state.dentAmount = Math.max(0, state.dentAmount - dt * 4.4);
        state.hurtTimer = Math.max(0, state.hurtTimer - dt);

        if (state.alive) {
          if (state.isHolding) {
            obj.onHoldUpdate(dt, state, getApi());
          } else {
            obj.onIdleUpdate(dt, state, getApi());
          }
        }

        if (obj.onPostPhysics) {
          obj.onPostPhysics(dt, state, getApi());
        }

        state.screenShake = Math.max(0, state.screenShake - dt * 52);

        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.life += dt;
          if (sw.life >= sw.maxLife) shockwaves.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.985;
          p.rot += p.vRot * dt;
        }

        for (let i = popups.length - 1; i >= 0; i--) {
          const pop = popups[i];
          pop.life += dt;
          if (pop.life >= pop.maxLife) {
            popups.splice(i, 1);
            continue;
          }
          pop.x += pop.vx * dt;
          pop.y += pop.vy * dt;
          pop.vy *= 0.92;
        }
      }

      function drawStar(ctx, r) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 === 0 ? r : r * 0.45;
          const ang = (i * Math.PI) / 5 - Math.PI / 2;
          const x = Math.cos(ang) * rad;
          const y = Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      function renderScene(time, obj) {
        ctx.clearRect(0, 0, viewW, viewH);

        ctx.save();
        if (state.screenShake > 0.2) {
          const sx = (Math.random() - 0.5) * 2 * state.screenShake;
          const sy = (Math.random() - 0.5) * 2 * state.screenShake;
          ctx.translate(sx, sy);
        }

        // 地面のやわらかい影
        if (state.alive || currentObjectId === "soda" || currentObjectId === "gum" || currentObjectId === "pet" || currentObjectId === "snack") {
          const shadowScale = clamp(1 - state.offsetY / 420, 0.65, 1.25) * state.spawnScale;
          let shadowY = centerY + baseRadius * 1.62;
          if (currentObjectId === "soda") shadowY = centerY + baseRadius * 1.18;
          else if (currentObjectId === "gum") shadowY = centerY + baseRadius * 1.24;
          else if (currentObjectId === "pet") shadowY = centerY + baseRadius * 1.1;
          else if (currentObjectId === "snack") shadowY = centerY + baseRadius * 1.24;

          ctx.save();
          ctx.beginPath();
          ctx.ellipse(
            centerX + state.offsetX * 0.45,
            shadowY,
            baseRadius * 0.66 * shadowScale,
            baseRadius * 0.14 * shadowScale,
            0, 0, Math.PI * 2
          );
          ctx.fillStyle = "rgba(43, 45, 66, 0.1)";
          ctx.fill();
          ctx.restore();
        }

        // メイン物体の描画
        obj.render(ctx, state, {
          cx: centerX,
          cy: centerY,
          baseR: baseRadius,
          viewW,
          viewH,
          time
        });

        // 衝撃リング
        for (const sw of shockwaves) {
          const t = sw.life / sw.maxLife;
          const r = lerp(sw.r, sw.maxR, 1 - Math.pow(1 - t, 3));
          ctx.save();
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, r, 0, Math.PI * 2);
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = 1 - t;
          ctx.lineWidth = lerp(9, 1.5, t);
          ctx.stroke();
          ctx.restore();
        }

        // パーティクル描画
        for (const p of particles) {
          const t = p.life / p.maxLife;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = clamp(1 - t * t, 0, 1);
          ctx.fillStyle = p.color;
          ctx.strokeStyle = "#2b2d42";
          ctx.lineWidth = 2;

          if (p.kind === "heart") {
            const s = p.size * 0.72;
            ctx.beginPath();
            ctx.moveTo(0, s * 0.45);
            ctx.bezierCurveTo(-s * 1.35, -s * 0.45, -s * 0.7, -s * 1.5, 0, -s * 0.55);
            ctx.bezierCurveTo(s * 0.7, -s * 1.5, s * 1.35, -s * 0.45, 0, s * 0.45);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (p.kind === "note") {
            ctx.font = `900 ${Math.round(p.size * 2.1)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#ffffff";
            ctx.strokeText("♪", 0, 0);
            ctx.fillText("♪", 0, 0);
          } else if (p.kind === "star") {
            drawStar(ctx, p.size);
            ctx.fill();
            ctx.stroke();
          } else if (p.kind === "shard") {
            ctx.beginPath();
            ctx.moveTo(-p.size, -p.size * 0.35);
            ctx.quadraticCurveTo(0, -p.size * 0.8, p.size, 0);
            ctx.lineTo(-p.size * 0.4, p.size * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (p.kind === "spark") {
            ctx.beginPath();
            ctx.moveTo(-p.size * 1.1, 0);
            ctx.lineTo(0, -p.size * 0.35);
            ctx.lineTo(p.size * 1.1, 0);
            ctx.lineTo(0, p.size * 0.35);
            ctx.closePath();
            ctx.fill();
          } else if (p.kind === "foam") {
            ctx.beginPath();
            ctx.arc(0, 0, p.size * (0.85 + t * 0.4), 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(43, 45, 66, 0.25)";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          } else if (p.kind === "droplet") {
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 1.25, p.size * 0.65, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size * 0.5, -p.size * 0.35, p.size, p.size * 0.7);
          }
          ctx.restore();
        }

        // コミカル擬音ポップアップ
        for (const pop of popups) {
          const t = pop.life / pop.maxLife;
          const scale = t < 0.18 ? lerp(0.4, 1.18, t / 0.18) : lerp(1.18, 0.96, (t - 0.18) / 0.82);
          const alpha = t < 0.65 ? 1 : 1 - (t - 0.65) / 0.35;

          ctx.save();
          ctx.translate(pop.x, pop.y);
          ctx.rotate(pop.rot);
          ctx.scale(scale, scale);
          ctx.globalAlpha = clamp(alpha, 0, 1);

          ctx.font = `900 ${pop.size}px "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineJoin = "round";

          ctx.lineWidth = 8;
          ctx.strokeStyle = "#ffffff";
          ctx.strokeText(pop.text, 0, 0);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#2b2d42";
          ctx.strokeText(pop.text, 0, 0);
          ctx.fillStyle = pop.color;
          ctx.fillText(pop.text, 0, 0);
          ctx.restore();
        }

        ctx.restore();
      }

      /* =========================================================
       * 8. ホーム画面追加用アイコン生成
       * ========================================================= */
      function generateAppleTouchIcon() {
        try {
          const iconCanvas = document.createElement("canvas");
          iconCanvas.width = 180;
          iconCanvas.height = 180;
          const ictx = iconCanvas.getContext("2d");
          ictx.fillStyle = "#fff3df";
          ictx.fillRect(0, 0, 180, 180);

          ictx.fillStyle = "#ff595e";
          ictx.strokeStyle = "#2b2d42";
          ictx.lineWidth = 6;
          ictx.beginPath();
          ictx.ellipse(90, 82, 50, 60, 0, 0, Math.PI * 2);
          ictx.fill();
          ictx.stroke();

          ictx.fillStyle = "rgba(255,255,255,0.45)";
          ictx.beginPath();
          ictx.ellipse(70, 58, 11, 20, -0.35, 0, Math.PI * 2);
          ictx.fill();

          ictx.fillStyle = "#2b2d42";
          ictx.beginPath();
          ictx.arc(73, 80, 6, 0, Math.PI * 2);
          ictx.arc(107, 80, 6, 0, Math.PI * 2);
          ictx.fill();

          ictx.beginPath();
          ictx.arc(90, 92, 14, 0.15 * Math.PI, 0.85 * Math.PI);
          ictx.stroke();

          const link = document.getElementById("app-icon");
          if (link) link.href = iconCanvas.toDataURL("image/png");
        } catch (_) {}
      }

      /* =========================================================
       * 9. 初期化＆アニメーション開始
       * ========================================================= */
      let lastTs = performance.now();
      function loop(ts) {
        const dt = Math.min((ts - lastTs) / 1000, 0.05);
        lastTs = ts;

        const obj = getCurrentObject();
        stepPhysics(dt, obj);
        renderScene(ts / 1000, obj);
        updateGaugeUI(obj);

        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resizeCanvas);
      if (getCurrentObject().bodyClass) {
        document.body.classList.add(getCurrentObject().bodyClass);
      }
      buildCharacterSwitcher();
      loadStats();
      resizeCanvas();
      respawnObject(false, true);
      generateAppleTouchIcon();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
