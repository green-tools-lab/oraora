          onHoldUpdate(dt, state, api) {
            const sd = state.soda;
            const speedBoost = 1 + Math.min(sd.mentosCount, 12) * 0.075;
            state.tension = clamp(state.tension + (dt * speedBoost) / this.physics.holdDuration, 0, 1);

            const shakeFreq = 22 + state.tension * 18;
            sd.shakePhase += dt * shakeFreq;
            const shakeAmpY = 26 + state.tension * 22;
            const shakeAmpX = 9 + state.tension * 10;

            state.offsetY = Math.sin(sd.shakePhase) * shakeAmpY;
            state.offsetX = Math.cos(sd.shakePhase * 0.5) * shakeAmpX;
            state.rot = Math.sin(sd.shakePhase * 0.5) * (0.16 + state.tension * 0.16);
            sd.sloshVel += Math.cos(sd.shakePhase) * (16 + state.tension * 24) * dt;

            state.holdSoundTimer -= dt;
            if (state.holdSoundTimer <= 0) {
              SoundEngine.playShakeSlosh(state.tension);
              state.holdSoundTimer = lerp(0.17, 0.08, state.tension);
            }

            if (state.tension >= 1) {
              api.triggerBurst();
            }
          },

          onHoldEnd(state, playSound) {
            if (state.alive && state.tension > 0.12) {
              state.velY = -120;
              state.velScaleX += 1.6;
              state.velScaleY -= 1.6;
              if (playSound) SoundEngine.playFizzCalm(state.tension);
            }
          },

          onIdleUpdate(dt, state) {
            const sd = state.soda;
            const minBase = Math.min(sd.mentosCount * 0.03, 0.32);
            if (state.tension > minBase) {
              state.tension = Math.max(minBase, state.tension - dt * this.physics.coolDownRate);
            }
          },

          onPostPhysics(dt, state, api) {
            const sd = state.soda;
            if (!sd) return;

            sd.capOpenTimer = Math.max(0, sd.capOpenTimer - dt);

            const sloshAcc = -42 * sd.sloshAngle - 5.2 * sd.sloshVel;
            sd.sloshVel += sloshAcc * dt;
            sd.sloshAngle = clamp(sd.sloshAngle + sd.sloshVel * dt, -0.55, 0.55);

            for (let i = sd.fallingMentos.length - 1; i >= 0; i--) {
              const fm = sd.fallingMentos[i];
              fm.progress += dt * 4.2;
              if (fm.progress >= 1) {
                if (sd.seatedMentos.length < 28) {
                  sd.seatedMentos.push({
                    nx: (Math.random() - 0.5) * 0.62,
                    ny: Math.random() * 0.16,
                    rot: (Math.random() - 0.5) * 1.4,
                    color: fm.color
                  });
                }
                sd.fallingMentos.splice(i, 1);
              }
            }

            const fizzSpeed = 1 + state.tension * 3.8 + Math.min(sd.mentosCount, 12) * 0.28;
            for (const b of sd.bubbles) {
              b.ny += b.speed * fizzSpeed * dt;
              b.nx += Math.sin(performance.now() * 0.008 + b.r * 5) * 0.18 * dt;
              if (b.ny > 1) {
                b.ny = 0.02;
                b.nx = (Math.random() - 0.5) * 0.78;
              }
            }

            if (sd.capPopped) {
              sd.capVy += 920 * dt;
              sd.capX += sd.capVx * dt;
              sd.capY += sd.capVy * dt;
              sd.capRot += sd.capVRot * dt;
            }

            if (!state.alive && sd.eruptTimer > 0) {
              sd.eruptTimer = Math.max(0, sd.eruptTimer - dt);
              const progress = sd.eruptTimer / sd.eruptMax;
              const power = sd.eruptPower;

              const targetMinLiquid = clamp(0.32 - power * 0.08, 0.08, 0.32);
              sd.liquidLevel = Math.max(targetMinLiquid, sd.liquidLevel - dt * (0.34 + power * 0.12));

              state.offsetY = lerp(state.offsetY, 18 + power * 10, dt * 10) + (Math.random() - 0.5) * (4 + power * 3);
              state.offsetX = (Math.random() - 0.5) * (3 + power * 2.5);
              state.screenShake = Math.max(state.screenShake, (3 + power * 4.5) * progress);

              const nozzleX = api.centerX + state.offsetX;
              const nozzleY = api.centerY + state.offsetY - api.baseRadius * 1.05;
              const emitCount = Math.ceil((3 + power * 4.2) * (0.35 + progress * 0.65));

              for (let i = 0; i < emitCount; i++) {
                const spread = 0.16 + (1 - progress) * 0.25 + power * 0.05;
                const ang = -Math.PI / 2 + (Math.random() - 0.5) * spread * 2;
                const speed = (480 + power * 280 + Math.random() * 260) * (0.55 + progress * 0.55);
                const isFoam = Math.random() < 0.55;
                api.addParticle({
                  kind: isFoam ? "foam" : "droplet",
                  x: nozzleX + (Math.random() - 0.5) * (14 + power * 5),
                  y: nozzleY,
                  vx: Math.cos(ang) * speed,
                  vy: Math.sin(ang) * speed,
                  size: (isFoam ? 7 : 5) + Math.random() * (6 + power * 4.5),
                  rot: ang,
                  vRot: (Math.random() - 0.5) * 10,
                  color: isFoam ? state.palette.foam : (Math.random() < 0.5 ? state.palette.liquidTop : state.palette.main),
                  gravity: 780,
                  maxLife: 0.72 + Math.random() * 0.55
                });
              }

              if (sd.mentosCount >= 5 && Math.random() < 0.35 * progress) {
                const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
                const speed = 380 + Math.random() * 340;
                api.addParticle({
                  kind: "star",
                  x: nozzleX,
                  y: nozzleY,
                  vx: Math.cos(ang) * speed,
                  vy: Math.sin(ang) * speed,
                  size: 8 + Math.random() * 7,
                  rot: Math.random() * Math.PI,
                  vRot: (Math.random() - 0.5) * 15,
                  color: pick(["#ffd166", "#ff595e", "#ffffff", "#4cc9f0"]),
                  gravity: 520,
                  maxLife: 0.65
                });
              }
            }

            if (!state.alive && !sd.overlayShown) {
              sd.overlayDelay -= dt;
              if (sd.overlayDelay <= 0) {
                sd.overlayShown = true;
                api.showBurstOverlay(sd.pendingOno, sd.pendingMsg, this.texts.respawnLabel);
              }
            }
          },

          onBurst(state, api) {
            const sd = state.soda;
            const m = sd.mentosCount;

            state.alive = false;
            state.tension = 1;

            const power = 1 + Math.min(m, 20) * 0.16;
            const duration = 1.0 + Math.min(m, 14) * 0.11;

            sd.eruptPower = power;
            sd.eruptMax = duration;
            sd.eruptTimer = duration;
            sd.overlayShown = false;
            sd.overlayDelay = Math.min(0.65 + m * 0.05, 1.35);
            state.respawnReadyAt = performance.now() + sd.overlayDelay * 1000 + 250;

            sd.capPopped = true;
            sd.capX = api.centerX;
            sd.capY = api.centerY - api.baseRadius * 1.15;
            sd.capVx = (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 140);
            sd.capVy = -(720 + power * 240);
            sd.capRot = 0;
            sd.capVRot = (sd.capVx > 0 ? 1 : -1) * 18;

            state.screenShake = 12 + Math.min(m, 15) * 1.4;
            state.velY += 260 + power * 90;
            state.velScaleX += 3.2;
            state.velScaleY -= 3.2;

            SoundEngine.playErupt(m);

            const nozzleY = api.centerY - api.baseRadius * 1.05;
            api.addShockwave(api.centerX, nozzleY, 16, api.baseRadius * (1.2 + power * 0.45), 0.35, state.palette.liquidTop);
            if (m >= 5) {
              api.addShockwave(api.centerX, nozzleY, 24, Math.max(api.viewW, api.viewH) * 0.62, 0.48, "#ffd166");
            }

            let ono = "ブシャーッ!!";
            let msg = "普通に大惨事！テーブルびしょびしょ！";
            if (m >= 12) {
              ono = "成層圏突破!!";
              msg = `メントス${m}個は反則!! 宇宙まで噴射した！`;
            } else if (m >= 8) {
              ono = "超・大噴火!!";
              msg = `メントス${m}個の破壊力！天井に穴が空いた！`;
            } else if (m >= 4) {
              ono = "ドバーーーッ!!";
              msg = `メントス${m}個で特大間欠泉！スッキリ爽快！`;
            } else if (m >= 1) {
              ono = "プシャーーッ!!";
              msg = `メントス${m}個の効果バツグン！泡まみれ！`;
            }

            sd.pendingOno = ono;
            sd.pendingMsg = msg;
            api.addPopup(ono, api.centerX, api.centerY - api.baseRadius * 0.9, "#ff2e4c", m >= 6 ? 44 : 38);
          },

          render(ctx, state, env) {
            const sd = state.soda;
            if (!sd) return;
            const { cx, cy, baseR, time } = env;
            const pal = state.palette;
            const tension = state.tension;

            const bodyW = baseR * 1.24;
            const bodyH = baseR * 1.78;
            const neckW = bodyW * 0.34;
            const topY = -bodyH * 0.62;
            const shoulderY = -bodyH * 0.34;
            const bottomY = bodyH * 0.56;

            const shakeAmp = state.alive && tension > 0.25 ? (1.5 + tension * tension * 9) : 0;
            const shakeX = shakeAmp ? (Math.random() - 0.5) * 2 * shakeAmp : 0;
            const shakeY = shakeAmp ? (Math.random() - 0.5) * 2 * shakeAmp : 0;

            const idleFloat = state.alive && !state.isHolding ? Math.sin(time * 2.2) * 3 : 0;
            const posX = cx + state.offsetX + shakeX;
            const posY = cy + baseR * 0.08 + idleFloat + state.offsetY + shakeY;

            const bulge = state.alive ? 1 + tension * 0.11 : 1;
            const sx = state.scaleX * bulge * state.spawnScale;
            const sy = state.scaleY * (1 + (state.alive ? tension * 0.04 : 0)) * state.spawnScale;

            if (!state.alive && sd.eruptTimer > 0) {
              const progress = sd.eruptTimer / sd.eruptMax;
              const power = sd.eruptPower;
              const nozzleWorldX = posX;
              const nozzleWorldY = posY + topY * sy;
              const jetW = (18 + power * 18) * (0.45 + progress * 0.55);
              const jetH = Math.min(nozzleWorldY + 40, (240 + power * 240) * (0.4 + progress * 0.7));

              ctx.save();
              const jetGrad = ctx.createLinearGradient(nozzleWorldX, nozzleWorldY, nozzleWorldX, nozzleWorldY - jetH);
              jetGrad.addColorStop(0, pal.liquidTop);
              jetGrad.addColorStop(0.35, pal.foam);
              jetGrad.addColorStop(1, "rgba(255, 255, 255, 0.88)");

              ctx.beginPath();
              ctx.moveTo(nozzleWorldX - jetW * 0.36, nozzleWorldY + 6);
              ctx.quadraticCurveTo(
                nozzleWorldX - jetW * (0.55 + Math.sin(time * 40) * 0.08),
                nozzleWorldY - jetH * 0.55,
                nozzleWorldX - jetW * 1.15,
                nozzleWorldY - jetH
              );
              ctx.lineTo(nozzleWorldX + jetW * 1.15, nozzleWorldY - jetH);
              ctx.quadraticCurveTo(
                nozzleWorldX + jetW * (0.55 + Math.cos(time * 40) * 0.08),
                nozzleWorldY - jetH * 0.55,
                nozzleWorldX + jetW * 0.36,
                nozzleWorldY + 6
              );
              ctx.closePath();
              ctx.fillStyle = jetGrad;
              ctx.fill();
              ctx.strokeStyle = "rgba(255,255,255,0.9)";
              ctx.lineWidth = 4;
              ctx.stroke();
              ctx.restore();
            }

            ctx.save();
            ctx.translate(posX, posY);
            ctx.rotate(state.rot);
            ctx.scale(sx, sy);

            const traceBottlePath = () => {
              const halfW = bodyW * 0.5;
              const halfNeck = neckW * 0.5;
              ctx.beginPath();
              ctx.moveTo(-halfNeck, topY);
              ctx.lineTo(halfNeck, topY);
              ctx.lineTo(halfNeck, topY + 20);
              ctx.bezierCurveTo(halfNeck, shoulderY - 12, halfW, shoulderY - 14, halfW, shoulderY + 18);
              ctx.bezierCurveTo(halfW + 3, 0, halfW - 6, bodyH * 0.14, halfW, bodyH * 0.28);
              ctx.lineTo(halfW, bottomY - 20);
              ctx.quadraticCurveTo(halfW, bottomY, halfW - 22, bottomY);
              ctx.quadraticCurveTo(halfW * 0.45, bottomY + 3, halfW * 0.22, bottomY - 7);
              ctx.quadraticCurveTo(0, bottomY + 2, -halfW * 0.22, bottomY - 7);
              ctx.quadraticCurveTo(-halfW * 0.45, bottomY + 3, -halfW + 22, bottomY);
              ctx.quadraticCurveTo(-halfW, bottomY, -halfW, bottomY - 20);
              ctx.lineTo(-halfW, bodyH * 0.28);
              ctx.bezierCurveTo(-halfW + 6, bodyH * 0.14, -halfW - 3, 0, -halfW, shoulderY + 18);
              ctx.bezierCurveTo(-halfW, shoulderY - 14, -halfNeck, shoulderY - 12, -halfNeck, topY + 20);
              ctx.closePath();
            };

            traceBottlePath();
            const glassGrad = ctx.createLinearGradient(-bodyW * 0.5, 0, bodyW * 0.5, 0);
            glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.85)");
            glassGrad.addColorStop(0.35, "rgba(235, 248, 255, 0.55)");
            glassGrad.addColorStop(1, "rgba(200, 230, 245, 0.65)");
            ctx.fillStyle = glassGrad;
            ctx.fill();

            ctx.save();
            traceBottlePath();
            ctx.clip();

            const totalInsideH = bottomY - (topY + 16);
            const liqTopY = bottomY - totalInsideH * sd.liquidLevel;
            const foamThickness = 10 + tension * 34 + Math.min(sd.mentosCount, 12) * 2.4;

            const liqMain = state.alive && tension > 0.55
              ? mixColor(pal.main, "#ff1e42", (tension - 0.55) * 0.9)
              : pal.main;
            const liqTopCol = state.alive && tension > 0.55
              ? mixColor(pal.liquidTop, "#ff6b6b", (tension - 0.55) * 0.8)
              : pal.liquidTop;

            const waveTilt = sd.sloshAngle * bodyW * 0.45;
            const waveBob = Math.sin(time * (6 + tension * 18)) * (4 + tension * 9);
            ctx.beginPath();
            ctx.moveTo(-bodyW, bottomY + 20);
            ctx.lineTo(-bodyW, liqTopY - waveTilt);
            ctx.quadraticCurveTo(-bodyW * 0.25, liqTopY - waveTilt * 0.4 + waveBob, 0, liqTopY);
            ctx.quadraticCurveTo(bodyW * 0.25, liqTopY + waveTilt * 0.4 - waveBob, bodyW, liqTopY + waveTilt);
            ctx.lineTo(bodyW, bottomY + 20);
            ctx.closePath();

            const liqGrad = ctx.createLinearGradient(0, liqTopY - 20, 0, bottomY);
            liqGrad.addColorStop(0, liqTopCol);
            liqGrad.addColorStop(0.55, liqMain);
            liqGrad.addColorStop(1, mixColor(liqMain, "#000000", 0.28));
            ctx.fillStyle = liqGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-bodyW, liqTopY - waveTilt + 6);
            ctx.quadraticCurveTo(0, liqTopY + 8, bodyW, liqTopY + waveTilt + 6);
            ctx.lineTo(bodyW, liqTopY + waveTilt - foamThickness);
            ctx.quadraticCurveTo(0, liqTopY - foamThickness - waveBob * 0.7, -bodyW, liqTopY - waveTilt - foamThickness);
            ctx.closePath();
            ctx.fillStyle = pal.foam;
            ctx.fill();

            for (let i = 0; i < sd.seatedMentos.length; i++) {
              const sm = sd.seatedMentos[i];
              const bounce = state.isHolding ? Math.sin(time * 28 + i * 2.1) * (10 + tension * 18) : Math.sin(time * 4 + i) * 1.5;
              const mx = sm.nx * bodyW * 0.5;
              const my = bottomY - 14 - sm.ny * bodyH * 0.45 - Math.abs(bounce);
              ctx.save();
              ctx.translate(mx, my);
              ctx.rotate(sm.rot + (state.isHolding ? time * 8 : 0));
              ctx.fillStyle = sm.color;
              ctx.strokeStyle = "rgba(43, 45, 66, 0.55)";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.ellipse(0, 0, 9.5, 5.5, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
            for (const b of sd.bubbles) {
              const bx = b.nx * bodyW * 0.5;
              const by = lerp(bottomY - 8, liqTopY - foamThickness * 0.5, b.ny);
              ctx.beginPath();
              ctx.arc(bx, by, b.r * (0.85 + tension * 0.35), 0, Math.PI * 2);
              ctx.fill();
            }

            const labelTop = -bodyH * 0.08;
            const labelH = bodyH * 0.39;
            ctx.fillStyle = pal.label;
            ctx.fillRect(-bodyW * 0.6, labelTop, bodyW * 1.2, labelH);

            ctx.fillStyle = "rgba(255,255,255,0.92)";
            ctx.fillRect(-bodyW * 0.6, labelTop + 4, bodyW * 1.2, 4);
            ctx.fillRect(-bodyW * 0.6, labelTop + labelH - 8, bodyW * 1.2, 4);

            this.renderFace(ctx, state, bodyW, labelTop + labelH * 0.5, time);

            ctx.restore();

            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.58)";
            ctx.lineWidth = 7;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-bodyW * 0.34, shoulderY + 20);
            ctx.lineTo(-bodyW * 0.34, bottomY - 26);
            ctx.stroke();
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(bodyW * 0.36, shoulderY + 34);
            ctx.lineTo(bodyW * 0.36, bottomY - 40);
            ctx.stroke();
            ctx.restore();

            traceBottlePath();
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            drawRoundedRect(ctx, -neckW * 0.58, topY + 13, neckW * 1.16, 8, 4);
            ctx.fillStyle = "#e8f4fa";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            if (!sd.capPopped) {
              ctx.save();
              const openLift = sd.capOpenTimer > 0 ? Math.sin((sd.capOpenTimer / 0.26) * Math.PI) : 0;
              ctx.translate(openLift * 14, topY - 14 - openLift * 18);
              ctx.rotate(openLift * 0.55);

              drawRoundedRect(ctx, -neckW * 0.56, -8, neckW * 1.12, 22, 6);
              ctx.fillStyle = pal.cap;
              ctx.fill();
              ctx.lineWidth = 4;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              ctx.strokeStyle = "rgba(255,255,255,0.45)";
              ctx.lineWidth = 2;
              for (let gx = -neckW * 0.35; gx <= neckW * 0.35; gx += neckW * 0.23) {
                ctx.beginPath();
                ctx.moveTo(gx, -4);
                ctx.lineTo(gx, 10);
                ctx.stroke();
              }
              ctx.restore();
            }

            for (const fm of sd.fallingMentos) {
              const p = fm.progress;
              const mx = lerp(fm.startXOffset, 0, Math.min(1, p * 1.5));
              const my = lerp(topY - 95, bottomY - 25, p * p);
              ctx.save();
              ctx.translate(mx, my);
              ctx.rotate(fm.rot + p * 6);
              ctx.fillStyle = fm.color;
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 2.6;
              ctx.beginPath();
              ctx.ellipse(0, 0, 11, 6.5, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            if (state.alive && tension > 0.55) {
              ctx.save();
              ctx.translate(bodyW * 0.44, shoulderY + 6);
              const pulse = 1 + Math.sin(time * 30) * 0.16;
              ctx.scale(pulse, pulse);
              ctx.strokeStyle = "#ff2e4c";
              ctx.lineWidth = 4.2;
              ctx.lineCap = "round";
              const r = 10;
              [
                [-r, -3, -3, -3, -3, -r],
                [r, -3, 3, -3, 3, -r],
                [-r, 3, -3, 3, -3, r],
                [r, 3, 3, 3, 3, r]
              ].forEach(([x1, y1, x2, y2, x3, y3]) => {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.quadraticCurveTo(x2, y2, x3, y3);
                ctx.stroke();
              });
              ctx.restore();
            }

            ctx.restore();

            if (sd.capPopped && sd.capY < env.viewH + 100) {
              ctx.save();
              ctx.translate(sd.capX, sd.capY);
              ctx.rotate(sd.capRot);
              drawRoundedRect(ctx, -neckW * 0.56, -11, neckW * 1.12, 22, 6);
              ctx.fillStyle = pal.cap;
              ctx.fill();
              ctx.lineWidth = 4;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
              ctx.restore();
            }
          },

          renderFace(ctx, state, bodyW, cy, time) {
            const eyeX = bodyW * 0.2;
            const eyeY = cy - 6;
            const sd = state.soda;
            ctx.strokeStyle = "#ffffff";
            ctx.fillStyle = "#ffffff";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (!state.alive) {
              ctx.lineWidth = 3.5;
              [-eyeX, eyeX].forEach((x) => {
                ctx.beginPath();
                ctx.arc(x, eyeY, 9, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x + Math.cos(time * 20) * 2, eyeY + Math.sin(time * 20) * 2, 3, 0, Math.PI * 2);
                ctx.fill();
              });
              ctx.beginPath();
              ctx.ellipse(0, cy + 15, 11, 13, 0, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 2.5;
              ctx.stroke();
            } else if (state.hurtTimer > 0) {
              ctx.lineWidth = 3.5;
              [-eyeX, eyeX].forEach((x) => {
                ctx.beginPath();
                ctx.arc(x, eyeY, 9, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, eyeY, 3.8, 0, Math.PI * 2);
                ctx.fillStyle = "#2b2d42";
                ctx.fill();
              });
              ctx.beginPath();
              ctx.arc(0, cy + 16, 8, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 2.5;
              ctx.stroke();
            } else if (state.isHolding || state.tension > 0.45) {
              ctx.lineWidth = 4.2;
              ctx.beginPath();
              ctx.moveTo(-eyeX - 9, eyeY - 7);
              ctx.lineTo(-eyeX + 7, eyeY);
              ctx.lineTo(-eyeX - 9, eyeY + 7);
              ctx.moveTo(eyeX + 9, eyeY - 7);
              ctx.lineTo(eyeX - 7, eyeY);
              ctx.lineTo(eyeX + 9, eyeY + 7);
              ctx.stroke();

              ctx.beginPath();
              const my = cy + 15;
              ctx.moveTo(-18, my);
              ctx.lineTo(-9, my - 5);
              ctx.lineTo(0, my + 4);
              ctx.lineTo(9, my - 5);
              ctx.lineTo(18, my);
              ctx.stroke();
            } else {
              ctx.beginPath();
              ctx.arc(-eyeX, eyeY, 6.2, 0, Math.PI * 2);
              ctx.arc(eyeX, eyeY, 6.2, 0, Math.PI * 2);
              ctx.fill();

              ctx.lineWidth = 3.8;
              if (sd.mentosCount >= 5) {
                ctx.beginPath();
                ctx.moveTo(-14, cy + 15);
                ctx.quadraticCurveTo(0, cy + 8, 14, cy + 15);
                ctx.stroke();
              } else {
                ctx.beginPath();

            ctx.quadraticCurveTo(headR * 0.14, headR * 1.22, headR * 0.28, headR * 0.98);

            ctx.lineWidth = 3;
            ctx.strokeStyle = "#2b2d42";

                ctx.moveTo(ex + dir * 8, eyeY - 8);
                ctx.lineTo(ex + dir * 15, eyeY - 12);

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(ex - 3.5, eyeY - 4.5, 3.8, 0, Math.PI * 2);
                ctx.arc(ex + 3.5, eyeY + 4.5, 1.8, 0, Math.PI * 2);
                ctx.fill();

              ctx.lineWidth = 3.6;

            ctx.moveTo(headR * 0.86, -headR * 0.62);

            ctx.stroke();

            const bangY = -headR * 0.22;
            ctx.beginPath();
            ctx.moveTo(-headR * 0.92, -headR * 0.35);
            ctx.quadraticCurveTo(-headR * 0.92, -headR * 1.15, 0, -headR * 1.16);
            ctx.quadraticCurveTo(headR * 0.92, -headR * 1.15, headR * 0.92, -headR * 0.35);
            ctx.lineTo(headR * 0.84, bangY);
            // ぱっつんライン＋わずかな毛束スリット
            ctx.lineTo(headR * 0.38, bangY + 2);
            ctx.lineTo(headR * 0.33, bangY - 12);
            ctx.lineTo(headR * 0.28, bangY + 2);
            ctx.lineTo(-headR * 0.24, bangY + 2);
            ctx.lineTo(-headR * 0.29, bangY - 11);
            ctx.lineTo(-headR * 0.34, bangY + 2);

            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = hairHighlight;
            ctx.lineWidth = 7;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.arc(0, -headR * 0.2, headR * 0.68, 1.2 * Math.PI, 1.46 * Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, -headR * 0.2, headR * 0.68, 1.56 * Math.PI, 1.76 * Math.PI);
            ctx.stroke();
            ctx.restore();

            // 可愛いクロスヘアピン（フレーバーと連動色）
            ctx.save();
            ctx.translate(headR * 0.56, -headR * 0.44);
            ctx.rotate(0.22);
            drawRoundedRect(ctx, -15, -4, 30, 8, 4);
            ctx.fillStyle = pal.pin;
            ctx.fill();
            ctx.lineWidth = 2.6;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();
            ctx.restore();

            // 膨らませ限界間近の冷や汗
            if (state.alive && tension > 0.52) {
              const alpha = clamp((tension - 0.52) / 0.25, 0, 1);
              ctx.save();
              ctx.globalAlpha = alpha;
              const dropY = -headR * 0.1 + ((time * 65) % 20);
              ctx.fillStyle = "#4cc9f0";
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(-headR * 0.72, dropY - 10);
              ctx.quadraticCurveTo(-headR * 0.62, dropY + 5, -headR * 0.72, dropY + 10);
              ctx.quadraticCurveTo(-headR * 0.82, dropY + 5, -headR * 0.72, dropY - 10);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            /* --- 5. 膨らむ風船ガム（長押し中） --- */
            if (state.alive && tension > 0.01) {
              // ガム粒数が多いほどさらに巨大に膨らむ！
              const sizeBonus = 1 + Math.min(gm.gumCount - 1, 8) * 0.07;
              const bubbleR = (14 + Math.pow(tension, 0.85) * headR * 1.15) * sizeBonus;
              const wobble = Math.sin(time * (14 + tension * 26)) * (1.2 + tension * 4.5);
              const gumX = 0 + (tension > 0.7 ? (Math.random() - 0.5) * 6 : 0);
              const gumY = mouthY + bubbleR * 0.22 + (tension > 0.7 ? (Math.random() - 0.5) * 6 : 0);

              ctx.save();
              ctx.translate(gumX, gumY);

              // 限界に近づくほど膜が薄く透けてテカる
              const rx = bubbleR + wobble;
              const ry = bubbleR * 0.96 - wobble * 0.7;

              ctx.beginPath();
              ctx.ellipse(0, 0, Math.max(4, rx), Math.max(4, ry), 0, 0, Math.PI * 2);

              const gGrad = ctx.createRadialGradient(-rx * 0.32, -ry * 0.35, rx * 0.08, 0, 0, rx * 1.12);
              gGrad.addColorStop(0, "rgba(255, 255, 255, 0.82)");
              gGrad.addColorStop(0.28, pal.light);
              gGrad.addColorStop(0.75, pal.main);
              gGrad.addColorStop(1, pal.shade);

              ctx.globalAlpha = lerp(0.95, 0.78, tension);
              ctx.fillStyle = gGrad;
              ctx.fill();

              ctx.globalAlpha = 1;
              ctx.lineWidth = lerp(3.8, 2.6, tension);
              ctx.strokeStyle = mixColor("#2b2d42", pal.shade, 0.35);
              ctx.stroke();

              // 風船ガムらしいぷっくりツヤ光沢
              ctx.save();
              ctx.translate(-rx * 0.34, -ry * 0.34);
              ctx.rotate(-0.55);
              ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
              ctx.beginPath();
              ctx.ellipse(0, 0, rx * 0.14, ry * 0.28, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();

              if (tension > 0.82) {

                ctx.lineWidth = 2.6;
                ctx.beginPath();

                ctx.lineTo(rx * 0.42, -ry * 0.05);
                ctx.lineTo(rx * 0.3, ry * 0.12);
                ctx.stroke();
              }

              ctx.restore();
            }

            /* --- 6. 破裂後：顔面にベシャッ!!と張り付いた風船ガム --- */
            if (!state.alive && gm.splatLobes.length > 0) {
              const sp = gm.splatProgress; // 0→1で一気にベシャッと張り付く
              const easeOut = 1 - Math.pow(1 - sp, 3);
              const drip = Math.min(gm.dripPhase * 12, 16); // 時間経過でじわっと下に少し垂れる
              const splatCenterY = headR * 0.22;

              ctx.save();
              ctx.translate(0, splatCenterY);
              ctx.scale(lerp(1.32, 1.0, easeOut), lerp(0.68, 1.0, easeOut));

              // 1) ベシャッ本体（不定形ベジェブロブ）
              const lobes = gm.splatLobes;
              const pts = lobes.map((lb) => {
                const extraDrip = Math.sin(lb.ang) > 0.45 ? drip * Math.sin(lb.ang) : 0;
                return {
                  x: Math.cos(lb.ang) * lb.r * headR * 0.92,
                  y: Math.sin(lb.ang) * lb.r * headR * 0.86 + extraDrip
                };
              });

              ctx.beginPath();
              for (let i = 0; i < pts.length; i++) {
                const curr = pts[i];
                const next = pts[(i + 1) % pts.length];
                const midX = (curr.x + next.x) * 0.5;
                const midY = (curr.y + next.y) * 0.5;
                if (i === 0) {
                  const prev = pts[pts.length - 1];
                  ctx.moveTo((prev.x + curr.x) * 0.5, (prev.y + curr.y) * 0.5);
                }
                ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
              }
              ctx.closePath();

              // 顔に貼り付いた少し半透明でツヤのあるガム質感
              const splatGrad = ctx.createRadialGradient(-headR * 0.2, -headR * 0.2, 8, 0, 0, headR * 1.15);
              splatGrad.addColorStop(0, pal.light);
              splatGrad.addColorStop(0.55, pal.main);
              splatGrad.addColorStop(1, pal.shade);
              ctx.globalAlpha = 0.88;
              ctx.fillStyle = splatGrad;
              ctx.fill();
              ctx.globalAlpha = 1;
              ctx.lineWidth = 3.5;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              // 2) ガムのシワ・粘着ツヤ（ベタッと張り付いた立体感）
              ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
              ctx.lineWidth = 5;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.arc(-headR * 0.22, -headR * 0.14, headR * 0.24, 1.1 * Math.PI, 1.65 * Math.PI);
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(headR * 0.25, headR * 0.12, headR * 0.16, 0.1 * Math.PI, 0.65 * Math.PI);
              ctx.stroke();

              // 口のあたりがうっすら透けて見える＆小さく破れた穴から片目がチラ見え！
              ctx.beginPath();
              ctx.ellipse(eyeX, eyeY - splatCenterY, 15, 13, -0.1, 0, Math.PI * 2);
              ctx.fillStyle = skinColor;
              ctx.fill();
              ctx.lineWidth = 2.8;
              ctx.strokeStyle = pal.shade;
              ctx.stroke();

              // 穴から覗くしょんぼり・呆然とした片目！
              ctx.beginPath();
              ctx.arc(eyeX, eyeY - splatCenterY, 8.5, 0, Math.PI * 2);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
              ctx.lineWidth = 2.5;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(eyeX - 1, eyeY - splatCenterY + 1, 3.2, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();

              // 3) びよーんと垂れる粘着糸と小粒ガム
              for (const d of gm.splatDots) {
                const dx = Math.cos(d.ang) * d.dist * headR;
                const dy = Math.sin(d.ang) * d.dist * headR + (Math.sin(d.ang) > 0.3 ? drip * 0.5 : 0);

                // 本体とつなぐ細いガムの糸
                ctx.beginPath();
                ctx.moveTo(dx * 0.52, dy * 0.52);
                ctx.quadraticCurveTo(dx * 0.78, dy * 0.78 + 6, dx, dy);
                ctx.strokeStyle = pal.main;
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // 飛び散った小粒ガム
                ctx.save();
                ctx.translate(dx, dy);
                ctx.rotate(d.rot);
                ctx.beginPath();
                ctx.ellipse(0, 0, d.rx, d.ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = pal.main;
                ctx.fill();
                ctx.lineWidth = 2.4;
                ctx.strokeStyle = "#2b2d42";
                ctx.stroke();
                ctx.restore();
              }

              // 4) 画面のキャラ右上にコミカルな「ガーン！」の縦線（落ち込み表現）
              ctx.save();
              ctx.strokeStyle = "#4895ef";
              ctx.lineWidth = 3.2;
              ctx.lineCap = "round";
              for (let k = 0; k < 4; k++) {
                const lx = headR * 0.85 + k * 7;
                const ly = -headR * 0.95 + (k % 2) * 5;
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx, ly + 26 + (k % 2) * 8);
                ctx.stroke();
              }
              ctx.restore();

              ctx.restore();
            }

            ctx.restore();
          }

            pt.overlayDelay = 0.52;

            state.velY = -220;
            state.velScaleX = 2.4;
            state.velScaleY = -2.0;

            SoundEngine.playPetHappyMax();
            api.pulseSubHUD();

            // ハッピー光輪＆大量のハート・星・音符を祝福放出！
            api.addShockwave(api.centerX, api.centerY - api.baseRadius * 0.15, 24, api.baseRadius * 1.85, 0.48, "#ffd166");
            api.addShockwave(api.centerX, api.centerY - api.baseRadius * 0.15, 16, api.baseRadius * 1.4, 0.36, "#ff758f");

            const happyColors = ["#ff758f", "#ff8fab", "#ffd166", "#ffbe0b", "#72efdd", "#ffffff"];
            for (let i = 0; i < 38; i++) {
              const ang = Math.random() * Math.PI * 2;
              const speed = 150 + Math.random() * 340;
              api.addParticle({
                kind: i % 3 === 0 ? "heart" : (i % 3 === 1 ? "star" : "note"),
                x: api.centerX + (Math.random() - 0.5) * 40,
                y: api.centerY - api.baseRadius * 0.15 + (Math.random() - 0.5) * 40,
                vx: Math.cos(ang) * speed,
                vy: Math.sin(ang) * speed - 90,
                size: 8 + Math.random() * 9,
                rot: (Math.random() - 0.5) * 0.8,
                vRot: (Math.random() - 0.5) * 8,
                color: pick(happyColors),
                gravity: 220,
                maxLife: 0.9 + Math.random() * 0.5
              });
            }

            api.addPopup("パァァッ!!✨", api.centerX, api.centerY - api.baseRadius * 1.0, "#ff4d6d", 36);
            pt.pendingOno = this.texts.happyOno;
            pt.pendingMsg = pick(this.texts.happyMessages);
          },

          render(ctx, state, env) {
            const pt = state.pet;
            if (!pt) return;
            const { cx, cy, baseR, time } = env;
            const mood = state.alive ? state.tension : 1.0;

            // キャラ表示サイズ（元画像 226x339 = 2:3 比率を維持）
            const drawH = baseR * 2.48;
            const drawW = drawH * (226 / 339);

            // 顔が見やすいようやや上寄りに配置（下部吹き出しとも被らない）
            const idleBob = state.alive ? Math.sin(time * 2.2) * 3 : 0;
            const rubSquishX = 1 + pt.rubIntensity * 0.045 * Math.sin(time * 18);
            const rubSquishY = 1 - pt.rubIntensity * 0.045 * Math.sin(time * 18);

            const posX = cx + state.offsetX;
            const posY = cy - baseR * 0.14 + idleBob + state.offsetY;

            /* --- 1. ごきげんMAX時のあたたかい後光（サンバースト） --- */
            if (!state.alive || mood > 0.7) {
              const rayAlpha = !state.alive ? 0.55 : clamp((mood - 0.7) / 0.3, 0, 1) * 0.35;
              ctx.save();
              ctx.translate(posX, posY - drawH * 0.08);
              ctx.rotate(time * 0.45);
              ctx.globalAlpha = rayAlpha;
              const rayCount = 12;
              const rayR = baseR * 1.95;
              for (let i = 0; i < rayCount; i++) {
                const a0 = (i / rayCount) * Math.PI * 2;
                const a1 = a0 + (Math.PI / rayCount) * 0.72;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, rayR, a0, a1);
                ctx.closePath();
                const rg = ctx.createRadialGradient(0, 0, 10, 0, 0, rayR);
                rg.addColorStop(0, "rgba(255, 224, 102, 0.95)");
                rg.addColorStop(1, "rgba(255, 224, 102, 0)");
                ctx.fillStyle = rg;
                ctx.fill();
              }
              ctx.restore();
            }

            /* --- 2. キャラクター本体（元画像＋表情モーフィング合成） --- */
            ctx.save();
            ctx.translate(posX, posY);
            ctx.rotate(state.rot);
            ctx.scale(state.scaleX * rubSquishX * state.spawnScale, state.scaleY * rubSquishY * state.spawnScale);

            const left = -drawW * 0.5;
            const top = -drawH * 0.5;

            if (petCharLoaded) {
              ctx.drawImage(petCharImage, left, top, drawW, drawH);
            }

            // 表情オーバーレイ（元画像の顔座標比率に厳密フィット！）
            this.renderExpressionOverlay(ctx, left, top, drawW, drawH, mood, state, time);

            ctx.restore();

            /* --- 3. なでなでのキラキラ軌跡＆手のひらエフェクト --- */
            for (const tr of pt.trail) {
              const t = tr.life / tr.maxLife;
              ctx.save();
              ctx.globalAlpha = (1 - t) * 0.55;
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(tr.x, tr.y, tr.size * (1 - t * 0.5), 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            if (pt.handVisible && state.alive) {
              ctx.save();
              ctx.translate(pt.handX, pt.handY);
              ctx.rotate(clamp(pt.handVx * 0.03, -0.45, 0.45));
              // やさしい光のオーラ
              const hg = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
              hg.addColorStop(0, "rgba(255, 255, 255, 0.72)");
              hg.addColorStop(1, "rgba(255, 190, 215, 0)");
              ctx.fillStyle = hg;
              ctx.beginPath();
              ctx.arc(0, 0, 34, 0, Math.PI * 2);
              ctx.fill();

              // コミカルな手のひら絵文字（指のすぐ上に少しずらして見やすく）
              ctx.font = "34px sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("🖐️", 0, -10);
              ctx.restore();
            }
          },

          renderExpressionOverlay(ctx, left, top, w, h, mood, state, time) {
            const xOf = (r) => left + w * r;
            const yOf = (r) => top + h * r;

            const lEyeX = xOf(0.3319);
            const rEyeX = xOf(0.6239);
            const eyeY = yOf(0.3687);
            const mouthX = xOf(0.4779);
            const mouthY = yOf(0.5103);
            const lCheekX = xOf(0.2876);
            const rCheekX = xOf(0.6726);
            const cheekY = yOf(0.4543);
            const isMax = !state.alive;

            // 1. ほっぺの赤み（なでるほどぽわっと赤くなる！）
            if (mood > 0.12 || isMax) {
              const blushAlpha = isMax ? 0.62 : clamp((mood - 0.12) / 0.75, 0, 1) * 0.52;
              ctx.save();
              ctx.fillStyle = `rgba(255, 112, 150, ${blushAlpha.toFixed(3)})`;
              ctx.beginPath();
              ctx.ellipse(lCheekX, cheekY, w * 0.095, h * 0.032, -0.08, 0, Math.PI * 2);
              ctx.ellipse(rCheekX, cheekY, w * 0.095, h * 0.032, 0.08, 0, Math.PI * 2);
              ctx.fill();

              // デレ照れの斜め線（///）
              if (mood > 0.48 || isMax) {
                const lineA = isMax ? 0.7 : clamp((mood - 0.48) / 0.35, 0, 1) * 0.65;
                ctx.strokeStyle = `rgba(255, 77, 109, ${lineA.toFixed(3)})`;
                ctx.lineWidth = Math.max(2, w * 0.011);
                ctx.lineCap = "round";
                [lCheekX, rCheekX].forEach((cx0) => {
                  for (let k = -1; k <= 1; k++) {
                    const ox = cx0 + k * w * 0.032;
                    ctx.beginPath();
                    ctx.moveTo(ox + w * 0.012, cheekY - h * 0.016);
                    ctx.lineTo(ox - w * 0.012, cheekY + h * 0.016);
                    ctx.stroke();
                  }
                });
              }
              ctx.restore();
            }

            // 2. 元の不機嫌な目・眉・口を白マスクで滑らかに消す（鼻・髪・輪郭・二重あごは元画像そのまま！）
            const maskAlpha = isMax ? 1 : clamp((mood - 0.16) / 0.24, 0, 1);
            if (maskAlpha <= 0.01) return;

            ctx.save();
            ctx.fillStyle = `rgba(255, 255, 255, ${maskAlpha.toFixed(3)})`;

            // 左眉・左目マスク
            ctx.beginPath();
            ctx.ellipse(xOf(0.3142), yOf(0.3599), w * 0.145, h * 0.072, 0, 0, Math.PI * 2);
            ctx.fill();
            // 眉間マスク（鼻筋の上端まで）
            ctx.fillRect(xOf(0.375), yOf(0.292), w * 0.175, h * 0.084);
            // 右眉・右目マスク
            ctx.beginPath();
            ctx.ellipse(xOf(0.6372), yOf(0.3599), w * 0.152, h * 0.072, 0, 0, Math.PI * 2);
            ctx.fill();
            // 口マスク
            ctx.beginPath();
            ctx.ellipse(xOf(0.4779), yOf(0.5133), w * 0.186, h * 0.038, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 3. ごきげん度に応じた新しい表情パーツを描画（元の劇画タッチの太線と馴染ませる）
            ctx.save();
            ctx.globalAlpha = maskAlpha;
            ctx.strokeStyle = "#19191f";
            ctx.fillStyle = "#19191f";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            const lwBold = Math.max(3, w * 0.022);
            const lwMed = Math.max(2.4, w * 0.016);

            if (isMax) {
              /* === 100% 満面のとびきり笑顔!! === */
              const bounce = Math.sin(time * 9) * h * 0.004;

              // 幸せそうにぐいっと上がったアーチ眉
              ctx.lineWidth = lwBold;
              ctx.beginPath();
              ctx.moveTo(lEyeX - w * 0.095, eyeY - h * 0.056 + bounce);
              ctx.quadraticCurveTo(lEyeX, eyeY - h * 0.084 + bounce, lEyeX + w * 0.085, eyeY - h * 0.052 + bounce);
              ctx.moveTo(rEyeX - w * 0.085, eyeY - h * 0.052 + bounce);
              ctx.quadraticCurveTo(rEyeX, eyeY - h * 0.084 + bounce, rEyeX + w * 0.095, eyeY - h * 0.056 + bounce);
              ctx.stroke();

              // 満面のニッコリ弧目（⌒ ⌒）＋涙袋ラインで元の濃い顔の面影をコミカルに継承
              ctx.lineWidth = lwBold * 1.15;
              [lEyeX, rEyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.moveTo(ex - w * 0.095, eyeY + h * 0.006);
                ctx.quadraticCurveTo(ex, eyeY - h * 0.044, ex + w * 0.095, eyeY + h * 0.006);
                ctx.stroke();
              });
              // 下まぶたの笑いジワ（このキャラらしい濃さと幸福感！）
              ctx.lineWidth = lwMed * 0.72;
              [lEyeX, rEyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.moveTo(ex - w * 0.068, eyeY + h * 0.022);
                ctx.quadraticCurveTo(ex, eyeY + h * 0.032, ex + w * 0.068, eyeY + h * 0.022);
                ctx.stroke();
              });

              // 目元のキラキラ星
              ctx.fillStyle = "#ffd166";
              ctx.strokeStyle = "#19191f";
              ctx.lineWidth = 1.6;
              [
                [lEyeX - w * 0.12, eyeY - h * 0.03],
                [rEyeX + w * 0.125, eyeY - h * 0.025]
              ].forEach(([sx, sy]) => {
                const sr = w * (0.026 + Math.sin(time * 10) * 0.005);
                ctx.save();
                ctx.translate(sx, sy);
                ctx.beginPath();
                ctx.moveTo(0, -sr);
                ctx.quadraticCurveTo(sr * 0.2, -sr * 0.2, sr, 0);
                ctx.quadraticCurveTo(sr * 0.2, sr * 0.2, 0, sr);
                ctx.quadraticCurveTo(-sr * 0.2, sr * 0.2, -sr, 0);
                ctx.quadraticCurveTo(-sr * 0.2, -sr * 0.2, 0, -sr);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
              });

              // 満面の「ニカァッ!!」と開いた笑顔の口（白い歯＋ピンクの口内）
              const mw = w * 0.155;
              const mh = h * 0.056;
              ctx.beginPath();
              ctx.moveTo(mouthX - mw, mouthY - h * 0.016);
              ctx.quadraticCurveTo(mouthX, mouthY - h * 0.002, mouthX + mw, mouthY - h * 0.016);
              ctx.bezierCurveTo(
                mouthX + mw * 0.92, mouthY + mh,
                mouthX - mw * 0.92, mouthY + mh,
                mouthX - mw, mouthY - h * 0.016
              );
              ctx.closePath();
              ctx.fillStyle = "#e63960";
              ctx.fill();

              // クリップして上の白い歯＆舌を描く
              ctx.save();
              ctx.clip();
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(mouthX - mw, mouthY - h * 0.02, mw * 2, h * 0.024);
              ctx.fillStyle = "#ff8fab";
              ctx.beginPath();
              ctx.ellipse(mouthX, mouthY + mh * 0.72, mw * 0.56, mh * 0.42, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();

              ctx.strokeStyle = "#19191f";
              ctx.lineWidth = lwMed * 1.1;
              ctx.stroke();

            } else if (mood >= 0.55) {
              /* === 55%〜99% うっとり・ニヤけデレ顔 === */
              const t = (mood - 0.55) / 0.45; // 0→1

              // 眉がやさしく八の字〜アーチに緩む
              ctx.lineWidth = lwBold * 0.95;
              ctx.beginPath();
              ctx.moveTo(lEyeX - w * 0.09, eyeY - h * 0.044 - t * h * 0.008);
              ctx.quadraticCurveTo(lEyeX, eyeY - h * 0.068 - t * h * 0.01, lEyeX + w * 0.085, eyeY - h * 0.048);
              ctx.moveTo(rEyeX - w * 0.085, eyeY - h * 0.048);
              ctx.quadraticCurveTo(rEyeX, eyeY - h * 0.068 - t * h * 0.01, rEyeX + w * 0.09, eyeY - h * 0.044 - t * h * 0.008);
              ctx.stroke();

              // 気持ちよさそうにうっとり細めた目（^ ^）
              ctx.lineWidth = lwBold * 1.05;
              [lEyeX, rEyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.moveTo(ex - w * 0.09, eyeY + h * 0.004);
                ctx.quadraticCurveTo(ex, eyeY - h * (0.024 + t * 0.016), ex + w * 0.09, eyeY + h * 0.004);
                ctx.stroke();
              });
              // 下まぶたのやわらかい線
              ctx.lineWidth = lwMed * 0.7;
              [lEyeX, rEyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.moveTo(ex - w * 0.06, eyeY + h * 0.02);
                ctx.quadraticCurveTo(ex, eyeY + h * 0.027, ex + w * 0.06, eyeY + h * 0.02);
                ctx.stroke();
              });

              // 口角がニヤ〜ッと上がる笑顔
              ctx.lineWidth = lwBold * 0.95;
              const mw = w * (0.115 + t * 0.032);
              const curve = h * (0.024 + t * 0.02);
              ctx.beginPath();
              ctx.moveTo(mouthX - mw, mouthY - h * 0.008);
              ctx.quadraticCurveTo(mouthX, mouthY + curve, mouthX + mw, mouthY - h * 0.008);
              ctx.stroke();

            } else {
              /* === 20%〜55% ツンデレ戸惑い・ちょっと緩み顔 === */
              const t = clamp((mood - 0.16) / 0.39, 0, 1);

              // 吊り眉が少しずつフラット〜困り眉へ
              ctx.lineWidth = lwBold;
              const innerDrop = lerp(h * 0.016, -h * 0.014, t);
              ctx.beginPath();
              ctx.moveTo(lEyeX - w * 0.1, eyeY - h * 0.048);
              ctx.quadraticCurveTo(lEyeX, eyeY - h * 0.062, lEyeX + w * 0.09, eyeY - h * 0.04 + innerDrop);
              ctx.moveTo(rEyeX - w * 0.09, eyeY - h * 0.04 + innerDrop);
              ctx.quadraticCurveTo(rEyeX, eyeY - h * 0.062, rEyeX + w * 0.1, eyeY - h * 0.048);
              ctx.stroke();

              // 目は元の劇画の面影を残しつつ、少し丸く潤んでこちらをチラ見
              ctx.lineWidth = lwMed;
              [lEyeX, rEyeX].forEach((ex) => {
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.ellipse(ex, eyeY, w * 0.088, h * 0.027, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 少しだけ目を逸らし気味（ツンデレ感）
                ctx.fillStyle = "#19191f";
                ctx.beginPath();
                ctx.arc(ex + w * 0.012 * t, eyeY, w * 0.026, 0, Math.PI * 2);
                ctx.fill();

                // 潤んだ小さなハイライト
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(ex + w * 0.012 * t - w * 0.009, eyeY - h * 0.006, w * 0.009, 0, Math.PI * 2);
                ctx.fill();
              });

              // への字が緩んで、むっ→わずかにピクッと上がる口元
              ctx.lineWidth = lwBold * 0.9;
              const mw = w * 0.105;
              const bend = lerp(-h * 0.016, h * 0.014, t);
              ctx.beginPath();
              ctx.moveTo(mouthX - mw, mouthY);
              ctx.quadraticCurveTo(mouthX, mouthY + bend, mouthX + mw, mouthY);
              ctx.stroke();
            }

            ctx.restore();
          }
        },
