          onHoldStart(x, y, state) {
            state.holdSoundTimer = 0;
            state.soda.shakePhase = 0;
          },

          onHoldMove(x, y, state, api) {
            const tilt = clamp((x - api.centerX) / (api.viewW * 0.45), -0.35, 0.35);
            state.velRot += (tilt - state.rot) * 1.2;
          },

          onHoldUpdate(dt, state, api) {
            const sd = state.soda;
            const speedBoost = 1 + Math.min(sd.mentosCount, 12) * 0.075;
            state.tension = clamp(state.tension + (dt * speedBoost) / this.physics.holdDuration, 0, 1);

            const shakeFreq = 22 + state.tension * 18;
            sd.shakePhase += dt * shakeFreq;
            const shakeAmpY = 26 + state.tension * 22;
            const shakeAmpX = 9 + state.tension * 10;

            state.offsetY = Math.sin(sd.shakePhase) * shakeAmpY;
            state.offsetX = Math.cos(sd.shakePhase * 0.5) * shakeAmpX;
            state.rot = Math.sin(sd.shakePhase * 0.5) * (0.16 + state.tension * 0.16);
            sd.sloshVel += Math.cos(sd.shakePhase) * (16 + state.tension * 24) * dt;

            state.holdSoundTimer -= dt;
            if (state.holdSoundTimer <= 0) {
              SoundEngine.playShakeSlosh(state.tension);
              state.holdSoundTimer = lerp(0.17, 0.08, state.tension);
            }

            if (state.tension >= 1) {
              api.triggerBurst();
            }
          },

          onHoldEnd(state, playSound) {
            if (state.alive && state.tension > 0.12) {
              state.velY = -120;
              state.velScaleX += 1.6;
              state.velScaleY -= 1.6;
              if (playSound) SoundEngine.playFizzCalm(state.tension);
            }
          },

          onIdleUpdate(dt, state) {
            const sd = state.soda;
            const minBase = Math.min(sd.mentosCount * 0.03, 0.32);
            if (state.tension > minBase) {
              state.tension = Math.max(minBase, state.tension - dt * this.physics.coolDownRate);
            }
          },

          onPostPhysics(dt, state, api) {
            const sd = state.soda;
            if (!sd) return;

            sd.capOpenTimer = Math.max(0, sd.capOpenTimer - dt);

            const sloshAcc = -42 * sd.sloshAngle - 5.2 * sd.sloshVel;
            sd.sloshVel += sloshAcc * dt;
            sd.sloshAngle = clamp(sd.sloshAngle + sd.sloshVel * dt, -0.55, 0.55);

            for (let i = sd.fallingMentos.length - 1; i >= 0; i--) {
              const fm = sd.fallingMentos[i];
              fm.progress += dt * 4.2;
              if (fm.progress >= 1) {
                if (sd.seatedMentos.length < 28) {
                  sd.seatedMentos.push({
                    nx: (Math.random() - 0.5) * 0.62,
                    ny: Math.random() * 0.16,
                    rot: (Math.random() - 0.5) * 1.4,
                    color: fm.color
                  });
                }
                sd.fallingMentos.splice(i, 1);
              }
            }

            const fizzSpeed = 1 + state.tension * 3.8 + Math.min(sd.mentosCount, 12) * 0.28;
            for (const b of sd.bubbles) {
              b.ny += b.speed * fizzSpeed * dt;
              b.nx += Math.sin(performance.now() * 0.008 + b.r * 5) * 0.18 * dt;
              if (b.ny > 1) {
                b.ny = 0.02;
                b.nx = (Math.random() - 0.5) * 0.78;
              }
            }

            if (sd.capPopped) {
              sd.capVy += 920 * dt;
              sd.capX += sd.capVx * dt;
              sd.capY += sd.capVy * dt;
              sd.capRot += sd.capVRot * dt;
            }

            if (!state.alive && sd.eruptTimer > 0) {
              sd.eruptTimer = Math.max(0, sd.eruptTimer - dt);
              const progress = sd.eruptTimer / sd.eruptMax;
              const power = sd.eruptPower;

              const targetMinLiquid = clamp(0.32 - power * 0.08, 0.08, 0.32);
              sd.liquidLevel = Math.max(targetMinLiquid, sd.liquidLevel - dt * (0.34 + power * 0.12));

              state.offsetY = lerp(state.offsetY, 18 + power * 10, dt * 10) + (Math.random() - 0.5) * (4 + power * 3);
              state.offsetX = (Math.random() - 0.5) * (3 + power * 2.5);
              state.screenShake = Math.max(state.screenShake, (3 + power * 4.5) * progress);

              const nozzleX = api.centerX + state.offsetX;
              const nozzleY = api.centerY + state.offsetY - api.baseRadius * 1.05;
              const emitCount = Math.ceil((3 + power * 4.2) * (0.35 + progress * 0.65));

              for (let i = 0; i < emitCount; i++) {
                const spread = 0.16 + (1 - progress) * 0.25 + power * 0.05;
                const ang = -Math.PI / 2 + (Math.random() - 0.5) * spread * 2;
                const speed = (480 + power * 280 + Math.random() * 260) * (0.55 + progress * 0.55);
                const isFoam = Math.random() < 0.55;
                api.addParticle({
                  kind: isFoam ? "foam" : "droplet",
                  x: nozzleX + (Math.random() - 0.5) * (14 + power * 5),
                  y: nozzleY,
                  vx: Math.cos(ang) * speed,
                  vy: Math.sin(ang) * speed,
                  size: (isFoam ? 7 : 5) + Math.random() * (6 + power * 4.5),
                  rot: ang,
                  vRot: (Math.random() - 0.5) * 10,
                  color: isFoam ? state.palette.foam : (Math.random() < 0.5 ? state.palette.liquidTop : state.palette.main),
                  gravity: 780,
                  maxLife: 0.72 + Math.random() * 0.55
                });
              }

              if (sd.mentosCount >= 5 && Math.random() < 0.35 * progress) {
                const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
                const speed = 380 + Math.random() * 340;
                api.addParticle({
                  kind: "star",
                  x: nozzleX,
                  y: nozzleY,
                  vx: Math.cos(ang) * speed,
                  vy: Math.sin(ang) * speed,
                  size: 8 + Math.random() * 7,
                  rot: Math.random() * Math.PI,
                  vRot: (Math.random() - 0.5) * 15,
                  color: pick(["#ffd166", "#ff595e", "#ffffff", "#4cc9f0"]),
                  gravity: 520,
                  maxLife: 0.65
                });
              }
            }

            if (!state.alive && !sd.overlayShown) {
              sd.overlayDelay -= dt;
              if (sd.overlayDelay <= 0) {
                sd.overlayShown = true;
                api.showBurstOverlay(sd.pendingOno, sd.pendingMsg, this.texts.respawnLabel);
              }
            }
          },

          onBurst(state, api) {
            const sd = state.soda;
            const m = sd.mentosCount;

            state.alive = false;
            state.tension = 1;

            const power = 1 + Math.min(m, 20) * 0.16;
            const duration = 1.0 + Math.min(m, 14) * 0.11;

            sd.eruptPower = power;
            sd.eruptMax = duration;
            sd.eruptTimer = duration;
            sd.overlayShown = false;
            sd.overlayDelay = Math.min(0.65 + m * 0.05, 1.35);
            state.respawnReadyAt = performance.now() + sd.overlayDelay * 1000 + 250;

            sd.capPopped = true;
            sd.capX = api.centerX;
            sd.capY = api.centerY - api.baseRadius * 1.15;
            sd.capVx = (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 140);
            sd.capVy = -(720 + power * 240);
            sd.capRot = 0;
            sd.capVRot = (sd.capVx > 0 ? 1 : -1) * 18;

            state.screenShake = 12 + Math.min(m, 15) * 1.4;
            state.velY += 260 + power * 90;
            state.velScaleX += 3.2;
            state.velScaleY -= 3.2;

            SoundEngine.playErupt(m);

            const nozzleY = api.centerY - api.baseRadius * 1.05;
            api.addShockwave(api.centerX, nozzleY, 16, api.baseRadius * (1.2 + power * 0.45), 0.35, state.palette.liquidTop);
            if (m >= 5) {
              api.addShockwave(api.centerX, nozzleY, 24, Math.max(api.viewW, api.viewH) * 0.62, 0.48, "#ffd166");
            }

            let ono = "ブシャーッ!!";
            let msg = "普通に大惨事！テーブルびしょびしょ！";
            if (m >= 12) {
              ono = "成層圏突破!!";
              msg = `メントス${m}個は反則!! 宇宙まで噴射した！`;
            } else if (m >= 8) {
              ono = "超・大噴火!!";
              msg = `メントス${m}個の破壊力！天井に穴が空いた！`;
            } else if (m >= 4) {
              ono = "ドバーーーッ!!";
              msg = `メントス${m}個で特大間欠泉！スッキリ爽快！`;
            } else if (m >= 1) {
              ono = "プシャーーッ!!";
              msg = `メントス${m}個の効果バツグン！泡まみれ！`;
            }

            sd.pendingOno = ono;
            sd.pendingMsg = msg;
            api.addPopup(ono, api.centerX, api.centerY - api.baseRadius * 0.9, "#ff2e4c", m >= 6 ? 44 : 38);
          },

          render(ctx, state, env) {
            const sd = state.soda;
            if (!sd) return;
            const { cx, cy, baseR, time } = env;
            const pal = state.palette;
            const tension = state.tension;

            const bodyW = baseR * 1.24;
            const bodyH = baseR * 1.78;
            const neckW = bodyW * 0.34;
            const topY = -bodyH * 0.62;
            const shoulderY = -bodyH * 0.34;
            const bottomY = bodyH * 0.56;

            const shakeAmp = state.alive && tension > 0.25 ? (1.5 + tension * tension * 9) : 0;
            const shakeX = shakeAmp ? (Math.random() - 0.5) * 2 * shakeAmp : 0;
            const shakeY = shakeAmp ? (Math.random() - 0.5) * 2 * shakeAmp : 0;

            const idleFloat = state.alive && !state.isHolding ? Math.sin(time * 2.2) * 3 : 0;
            const posX = cx + state.offsetX + shakeX;
            const posY = cy + baseR * 0.08 + idleFloat + state.offsetY + shakeY;

            const bulge = state.alive ? 1 + tension * 0.11 : 1;
            const sx = state.scaleX * bulge * state.spawnScale;
            const sy = state.scaleY * (1 + (state.alive ? tension * 0.04 : 0)) * state.spawnScale;

            if (!state.alive && sd.eruptTimer > 0) {
              const progress = sd.eruptTimer / sd.eruptMax;
              const power = sd.eruptPower;
              const nozzleWorldX = posX;
              const nozzleWorldY = posY + topY * sy;
              const jetW = (18 + power * 18) * (0.45 + progress * 0.55);
              const jetH = Math.min(nozzleWorldY + 40, (240 + power * 240) * (0.4 + progress * 0.7));

              ctx.save();
              const jetGrad = ctx.createLinearGradient(nozzleWorldX, nozzleWorldY, nozzleWorldX, nozzleWorldY - jetH);
              jetGrad.addColorStop(0, pal.liquidTop);
              jetGrad.addColorStop(0.35, pal.foam);
              jetGrad.addColorStop(1, "rgba(255, 255, 255, 0.88)");

              ctx.beginPath();
              ctx.moveTo(nozzleWorldX - jetW * 0.36, nozzleWorldY + 6);
              ctx.quadraticCurveTo(
                nozzleWorldX - jetW * (0.55 + Math.sin(time * 40) * 0.08),
                nozzleWorldY - jetH * 0.55,
                nozzleWorldX - jetW * 1.15,
                nozzleWorldY - jetH
              );
              ctx.lineTo(nozzleWorldX + jetW * 1.15, nozzleWorldY - jetH);
              ctx.quadraticCurveTo(
                nozzleWorldX + jetW * (0.55 + Math.cos(time * 40) * 0.08),
                nozzleWorldY - jetH * 0.55,
                nozzleWorldX + jetW * 0.36,
                nozzleWorldY + 6
              );
              ctx.closePath();
              ctx.fillStyle = jetGrad;
              ctx.fill();
              ctx.strokeStyle = "rgba(255,255,255,0.9)";
              ctx.lineWidth = 4;
              ctx.stroke();
              ctx.restore();
            }

            ctx.save();
            ctx.translate(posX, posY);
            ctx.rotate(state.rot);
            ctx.scale(sx, sy);

            const traceBottlePath = () => {
              const halfW = bodyW * 0.5;
              const halfNeck = neckW * 0.5;
              ctx.beginPath();
              ctx.moveTo(-halfNeck, topY);
              ctx.lineTo(halfNeck, topY);
              ctx.lineTo(halfNeck, topY + 20);
              ctx.bezierCurveTo(halfNeck, shoulderY - 12, halfW, shoulderY - 14, halfW, shoulderY + 18);
              ctx.bezierCurveTo(halfW + 3, 0, halfW - 6, bodyH * 0.14, halfW, bodyH * 0.28);
              ctx.lineTo(halfW, bottomY - 20);
              ctx.quadraticCurveTo(halfW, bottomY, halfW - 22, bottomY);
              ctx.quadraticCurveTo(halfW * 0.45, bottomY + 3, halfW * 0.22, bottomY - 7);
              ctx.quadraticCurveTo(0, bottomY + 2, -halfW * 0.22, bottomY - 7);
              ctx.quadraticCurveTo(-halfW * 0.45, bottomY + 3, -halfW + 22, bottomY);
              ctx.quadraticCurveTo(-halfW, bottomY, -halfW, bottomY - 20);
              ctx.lineTo(-halfW, bodyH * 0.28);
              ctx.bezierCurveTo(-halfW + 6, bodyH * 0.14, -halfW - 3, 0, -halfW, shoulderY + 18);
              ctx.bezierCurveTo(-halfW, shoulderY - 14, -halfNeck, shoulderY - 12, -halfNeck, topY + 20);
              ctx.closePath();
            };

            traceBottlePath();
            const glassGrad = ctx.createLinearGradient(-bodyW * 0.5, 0, bodyW * 0.5, 0);
            glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.85)");
            glassGrad.addColorStop(0.35, "rgba(235, 248, 255, 0.55)");
            glassGrad.addColorStop(1, "rgba(200, 230, 245, 0.65)");
            ctx.fillStyle = glassGrad;
            ctx.fill();

            ctx.save();
            traceBottlePath();
            ctx.clip();

            const totalInsideH = bottomY - (topY + 16);
            const liqTopY = bottomY - totalInsideH * sd.liquidLevel;
            const foamThickness = 10 + tension * 34 + Math.min(sd.mentosCount, 12) * 2.4;

            const liqMain = state.alive && tension > 0.55
              ? mixColor(pal.main, "#ff1e42", (tension - 0.55) * 0.9)
              : pal.main;
            const liqTopCol = state.alive && tension > 0.55
              ? mixColor(pal.liquidTop, "#ff6b6b", (tension - 0.55) * 0.8)
              : pal.liquidTop;

            const waveTilt = sd.sloshAngle * bodyW * 0.45;
            const waveBob = Math.sin(time * (6 + tension * 18)) * (4 + tension * 9);
            ctx.beginPath();
            ctx.moveTo(-bodyW, bottomY + 20);
            ctx.lineTo(-bodyW, liqTopY - waveTilt);
            ctx.quadraticCurveTo(-bodyW * 0.25, liqTopY - waveTilt * 0.4 + waveBob, 0, liqTopY);
            ctx.quadraticCurveTo(bodyW * 0.25, liqTopY + waveTilt * 0.4 - waveBob, bodyW, liqTopY + waveTilt);
            ctx.lineTo(bodyW, bottomY + 20);
            ctx.closePath();

            const liqGrad = ctx.createLinearGradient(0, liqTopY - 20, 0, bottomY);
            liqGrad.addColorStop(0, liqTopCol);
            liqGrad.addColorStop(0.55, liqMain);
            liqGrad.addColorStop(1, mixColor(liqMain, "#000000", 0.28));
            ctx.fillStyle = liqGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-bodyW, liqTopY - waveTilt + 6);
            ctx.quadraticCurveTo(0, liqTopY + 8, bodyW, liqTopY + waveTilt + 6);
            ctx.lineTo(bodyW, liqTopY + waveTilt - foamThickness);
            ctx.quadraticCurveTo(0, liqTopY - foamThickness - waveBob * 0.7, -bodyW, liqTopY - waveTilt - foamThickness);
            ctx.closePath();
            ctx.fillStyle = pal.foam;
            ctx.fill();

            for (let i = 0; i < sd.seatedMentos.length; i++) {
              const sm = sd.seatedMentos[i];
              const bounce = state.isHolding ? Math.sin(time * 28 + i * 2.1) * (10 + tension * 18) : Math.sin(time * 4 + i) * 1.5;
              const mx = sm.nx * bodyW * 0.5;
              const my = bottomY - 14 - sm.ny * bodyH * 0.45 - Math.abs(bounce);
              ctx.save();
              ctx.translate(mx, my);
              ctx.rotate(sm.rot + (state.isHolding ? time * 8 : 0));
              ctx.fillStyle = sm.color;
              ctx.strokeStyle = "rgba(43, 45, 66, 0.55)";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.ellipse(0, 0, 9.5, 5.5, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
            for (const b of sd.bubbles) {
              const bx = b.nx * bodyW * 0.5;
              const by = lerp(bottomY - 8, liqTopY - foamThickness * 0.5, b.ny);
              ctx.beginPath();
              ctx.arc(bx, by, b.r * (0.85 + tension * 0.35), 0, Math.PI * 2);
              ctx.fill();
            }

            const labelTop = -bodyH * 0.08;
            const labelH = bodyH * 0.39;
            ctx.fillStyle = pal.label;
            ctx.fillRect(-bodyW * 0.6, labelTop, bodyW * 1.2, labelH);

            ctx.fillStyle = "rgba(255,255,255,0.92)";
            ctx.fillRect(-bodyW * 0.6, labelTop + 4, bodyW * 1.2, 4);
            ctx.fillRect(-bodyW * 0.6, labelTop + labelH - 8, bodyW * 1.2, 4);

            this.renderFace(ctx, state, bodyW, labelTop + labelH * 0.5, time);

            ctx.restore();

            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.58)";
            ctx.lineWidth = 7;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-bodyW * 0.34, shoulderY + 20);
            ctx.lineTo(-bodyW * 0.34, bottomY - 26);
            ctx.stroke();
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(bodyW * 0.36, shoulderY + 34);
            ctx.lineTo(bodyW * 0.36, bottomY - 40);
            ctx.stroke();
            ctx.restore();

            traceBottlePath();
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            drawRoundedRect(ctx, -neckW * 0.58, topY + 13, neckW * 1.16, 8, 4);
            ctx.fillStyle = "#e8f4fa";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            if (!sd.capPopped) {
              ctx.save();
              const openLift = sd.capOpenTimer > 0 ? Math.sin((sd.capOpenTimer / 0.26) * Math.PI) : 0;
              ctx.translate(openLift * 14, topY - 14 - openLift * 18);
              ctx.rotate(openLift * 0.55);

              drawRoundedRect(ctx, -neckW * 0.56, -8, neckW * 1.12, 22, 6);
              ctx.fillStyle = pal.cap;
              ctx.fill();
              ctx.lineWidth = 4;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              ctx.strokeStyle = "rgba(255,255,255,0.45)";
              ctx.lineWidth = 2;
              for (let gx = -neckW * 0.35; gx <= neckW * 0.35; gx += neckW * 0.23) {
                ctx.beginPath();
                ctx.moveTo(gx, -4);
                ctx.lineTo(gx, 10);
                ctx.stroke();
              }
              ctx.restore();
            }

            for (const fm of sd.fallingMentos) {
              const p = fm.progress;
              const mx = lerp(fm.startXOffset, 0, Math.min(1, p * 1.5));
              const my = lerp(topY - 95, bottomY - 25, p * p);
              ctx.save();
              ctx.translate(mx, my);
              ctx.rotate(fm.rot + p * 6);
              ctx.fillStyle = fm.color;
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 2.6;
              ctx.beginPath();
              ctx.ellipse(0, 0, 11, 6.5, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            if (state.alive && tension > 0.55) {
              ctx.save();
              ctx.translate(bodyW * 0.44, shoulderY + 6);
              const pulse = 1 + Math.sin(time * 30) * 0.16;
              ctx.scale(pulse, pulse);
              ctx.strokeStyle = "#ff2e4c";
              ctx.lineWidth = 4.2;
              ctx.lineCap = "round";
              const r = 10;
              [
                [-r, -3, -3, -3, -3, -r],
                [r, -3, 3, -3, 3, -r],
                [-r, 3, -3, 3, -3, r],
                [r, 3, 3, 3, 3, r]
              ].forEach(([x1, y1, x2, y2, x3, y3]) => {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.quadraticCurveTo(x2, y2, x3, y3);
                ctx.stroke();
              });
              ctx.restore();
            }

            ctx.restore();

            if (sd.capPopped && sd.capY < env.viewH + 100) {
              ctx.save();
              ctx.translate(sd.capX, sd.capY);
              ctx.rotate(sd.capRot);
              drawRoundedRect(ctx, -neckW * 0.56, -11, neckW * 1.12, 22, 6);
              ctx.fillStyle = pal.cap;
              ctx.fill();
              ctx.lineWidth = 4;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
              ctx.restore();
            }
          },

          renderFace(ctx, state, bodyW, cy, time) {
            const eyeX = bodyW * 0.2;
            const eyeY = cy - 6;
            const sd = state.soda;
            ctx.strokeStyle = "#ffffff";
            ctx.fillStyle = "#ffffff";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (!state.alive) {
              ctx.lineWidth = 3.5;
              [-eyeX, eyeX].forEach((x) => {
                ctx.beginPath();
                ctx.arc(x, eyeY, 9, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x + Math.cos(time * 20) * 2, eyeY + Math.sin(time * 20) * 2, 3, 0, Math.PI * 2);
                ctx.fill();
              });
              ctx.beginPath();
              ctx.ellipse(0, cy + 15, 11, 13, 0, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 2.5;
              ctx.stroke();
            } else if (state.hurtTimer > 0) {
              ctx.lineWidth = 3.5;
              [-eyeX, eyeX].forEach((x) => {
                ctx.beginPath();
                ctx.arc(x, eyeY, 9, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, eyeY, 3.8, 0, Math.PI * 2);
                ctx.fillStyle = "#2b2d42";
                ctx.fill();
              });
              ctx.beginPath();
              ctx.arc(0, cy + 16, 8, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 2.5;
              ctx.stroke();
            } else if (state.isHolding || state.tension > 0.45) {
              ctx.lineWidth = 4.2;
              ctx.beginPath();
              ctx.moveTo(-eyeX - 9, eyeY - 7);
              ctx.lineTo(-eyeX + 7, eyeY);
              ctx.lineTo(-eyeX - 9, eyeY + 7);
              ctx.moveTo(eyeX + 9, eyeY - 7);
              ctx.lineTo(eyeX - 7, eyeY);
              ctx.lineTo(eyeX + 9, eyeY + 7);
              ctx.stroke();

              ctx.beginPath();
              const my = cy + 15;
              ctx.moveTo(-18, my);
              ctx.lineTo(-9, my - 5);
              ctx.lineTo(0, my + 4);
              ctx.lineTo(9, my - 5);
              ctx.lineTo(18, my);
              ctx.stroke();
            } else {
              ctx.beginPath();
              ctx.arc(-eyeX, eyeY, 6.2, 0, Math.PI * 2);
              ctx.arc(eyeX, eyeY, 6.2, 0, Math.PI * 2);
              ctx.fill();

              ctx.lineWidth = 3.8;
              if (sd.mentosCount >= 5) {
                ctx.beginPath();
                ctx.moveTo(-14, cy + 15);
                ctx.quadraticCurveTo(0, cy + 8, 14, cy + 15);
                ctx.stroke();
              } else {
                ctx.beginPath();
                ctx.arc(0, cy + 8, 13, 0.18 * Math.PI, 0.82 * Math.PI);
                ctx.stroke();
              }
            }
          }
        },

              "「うわぁ〜！顔じゅうベッタベタやんか！」",
              "「ちょ、前髪にくっついてもーたやん！」",
              "「なんやこれ、前ぜんぜん見えへんねんけど！」",
              "「やりすぎやて！どないしてくれるん！？」",
              "「あーあ、めっちゃ恥ずかしいやんか〜！」",
              "「うそやん…ほっぺたまでベタベタやわ！」"
            ],
            splatMessagesMega: [
              "「ガム入れすぎやっちゅうねん！顔面ぜんぶ封印されたわ！」",
              "「うそやろ！？おかっぱ全滅レベルやんか〜！」",
              "「これ一生取れへんやつやん！アホか〜！」",
              "「なんぼほど入れんねん！前も後ろもわからんわ！」",
              "「ベッタベタにもほどがあるでホンマ！」"
            ],
            respawnLabel: "タップでベリッと剥がす"
          },

          initExtra(state) {
            state.gum = {
              gumCount: 1,         // 初期1粒。タップで増量可能（最大10粒相当まで巨大化）
              chewTimer: 0,        // タップ時のモグモグアニメーション
              splatProgress: 0,    // 破裂後のベシャッ張り付き進行（0→1）
              dripPhase: 0,        // ベシャッと貼られたガムの垂れ動き
              overlayShown: false,
              overlayDelay: 0,
              splatLobes: [],      // 顔面に貼り付く不定形ガム形状データ
              splatDots: []        // 周囲に飛び散って張り付く小粒ガム
            };
          },

          getSubHudInfo(state) {
            if (!state.gum) return null;
            const g = state.gum.gumCount;
            let level = "low";
            let tag = "ふつうサイズ";
            if (g >= 7) { level = "high"; tag = "顔面完全封印級!!"; }
            else if (g >= 4) { level = "mid"; tag = "特大ガム！"; }
            else if (g >= 2) { level = "mid"; tag = "ボリュームUP！"; }
            return { text: `🍬 ガム × ${g}粒`, tag, level };
          },

          onTap(x, y, state, api) {
            const gm = state.gum;
            gm.gumCount += 1;
            gm.chewTimer = 0.34;
            state.velY += 65;
            state.velScaleX += 1.4;
            state.velScaleY -= 1.4;

            api.incrementAction();
            api.pulseSubHUD();
            SoundEngine.playGumChew(gm.gumCount);

            // ほっぺのあたりにポップな擬音
            api.addPopup(
              pick(this.texts.chewWords),
              clamp(x, 75, api.viewW - 75),
              clamp(y - 26, 130, api.viewH - 140),
              state.palette.shade,
              28 + Math.min(gm.gumCount, 6) * 1.4
            );

            // 小さなキラキラパーティクル
            for (let i = 0; i < 6; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 80 + Math.random() * 120;
              api.addParticle({
                kind: "foam",
                x: api.centerX + (Math.random() - 0.5) * 30,
                y: api.centerY + api.baseRadius * 0.2,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 40,
                size: 4 + Math.random() * 4,
                rot: 0,
                vRot: 0,
                color: state.palette.main,
                gravity: 220,
                maxLife: 0.36
              });
            }
          },

          onHoldStart(x, y, state) {
            state.holdSoundTimer = 0;
          },

          onHoldMove() {},

          onHoldUpdate(dt, state, api) {
            const gm = state.gum;
            // ガムが多いほど少しだけ早く、より大きく膨らむ
            const speedFactor = 1 + Math.min(gm.gumCount - 1, 8) * 0.04;
            state.tension = clamp(state.tension + (dt * speedFactor) / this.physics.holdDuration, 0, 1);

            state.holdSoundTimer -= dt;
            if (state.holdSoundTimer <= 0) {
              SoundEngine.playGumInflate(state.tension);
              state.holdSoundTimer = lerp(0.24, 0.1, state.tension);
            }

            if (state.tension >= 1) {
              api.triggerBurst();
            }
          },

          onHoldEnd(state, playSound) {
            if (state.alive && state.tension > 0.08) {
              state.velScaleX += 1.4;
              state.velScaleY -= 1.4;
              if (playSound) SoundEngine.playGumDeflate(state.tension);
            }
          },

          onIdleUpdate(dt, state) {
            state.tension = Math.max(0, state.tension - dt * this.physics.coolDownRate);
          },

          onPostPhysics(dt, state, api) {
            const gm = state.gum;
            if (!gm) return;
            gm.chewTimer = Math.max(0, gm.chewTimer - dt);

            if (!state.alive) {
              gm.splatProgress = Math.min(1, gm.splatProgress + dt * 6.5);
              gm.dripPhase += dt;
              if (!gm.overlayShown) {
                gm.overlayDelay -= dt;
                if (gm.overlayDelay <= 0) {
                  gm.overlayShown = true;
                  api.showBurstOverlay(gm.pendingOno, gm.pendingMsg, this.texts.respawnLabel);
                }
              }
            }
          },

          onBurst(state, api) {
            const gm = state.gum;
            const g = gm.gumCount;

            state.alive = false;
            state.tension = 1;
            gm.splatProgress = 0.08;
            gm.dripPhase = 0;
            gm.overlayShown = false;
            // ベシャッと貼り付いた顔を0.75秒しっかり見せてから下部にメッセージを出す
            gm.overlayDelay = 0.72;
            state.respawnReadyAt = performance.now() + 920;

            // 顔面に貼り付く不定形ベシャッ形状を生成（ガム増量ほど広範囲！）
            const spreadScale = 1 + Math.min(g - 1, 9) * 0.075;
            gm.splatLobes = [];
            const lobeCount = 16;
            for (let i = 0; i < lobeCount; i++) {
              const ang = (i / lobeCount) * Math.PI * 2;
              const isDrip = Math.sin(ang) > 0.35;
              const rBase = (0.68 + Math.random() * 0.42 + (isDrip ? 0.16 : 0)) * spreadScale;
              gm.splatLobes.push({ ang, r: rBase });
            }

            // 髪やほっぺの端に飛び散った小粒ガム
            gm.splatDots = [];
            const dotCount = 8 + Math.min(g, 8);
            for (let i = 0; i < dotCount; i++) {
              const ang = Math.random() * Math.PI * 2;
              const dist = (0.76 + Math.random() * 0.52) * Math.min(spreadScale, 1.35);
              gm.splatDots.push({
                ang,
                dist,
                rx: 7 + Math.random() * 11,
                ry: 5 + Math.random() * 9,
                rot: Math.random() * Math.PI
              });
            }

            // 衝撃でキャラがのけぞるリアクション
            state.velY += 220;
            state.velScaleX += 3.0;
            state.velScaleY -= 2.8;
            state.velRot += (Math.random() > 0.5 ? 1 : -1) * 3.8;
            state.screenShake = 14 + Math.min(g, 8) * 1.1;

            SoundEngine.playGumSplat(g);

            // 破裂した瞬間の口元中心座標
            const mouthY = api.centerY + api.baseRadius * 0.24;
            api.addShockwave(api.centerX, mouthY, 20, api.baseRadius * 1.45, 0.32, state.palette.main);

            // 四方八方へ飛び散るガムの破片・粘着滴
            const pal = state.palette;
            const fragCount = 26 + Math.min(g, 8) * 3;
            for (let i = 0; i < fragCount; i++) {
              const ang = Math.random() * Math.PI * 2;
              const speed = 170 + Math.random() * 420;
              api.addParticle({
                kind: i % 5 === 0 ? "star" : "foam",
                x: api.centerX + (Math.random() - 0.5) * 30,
                y: mouthY + (Math.random() - 0.5) * 20,
                vx: Math.cos(ang) * speed,
                vy: Math.sin(ang) * speed - 80,
                size: 6 + Math.random() * 11,
                rot: Math.random() * Math.PI,
                vRot: (Math.random() - 0.5) * 14,
                color: i % 5 === 0 ? "#ffd166" : (i % 3 === 0 ? pal.light : pal.main),
                gravity: 540,
                maxLife: 0.55 + Math.random() * 0.45
              });
            }

            // 破裂直後のコミカル擬音
            api.addPopup("パァン!! ベシャッ!!", api.centerX, api.centerY - api.baseRadius * 0.88, "#ff2e4c", 34);

            gm.pendingOno = g >= 5 ? "特大ベシャッ!!" : this.texts.splatWord;
            gm.pendingMsg = g >= 5
              ? pick(this.texts.splatMessagesMega)
              : pick(this.texts.splatMessagesNormal);
          },

          render(ctx, state, env) {
            const gm = state.gum;
            if (!gm) return;
            const { cx, cy, baseR, time } = env;
            const pal = state.palette;
            const tension = state.tension;

            // 顔の中心はやや上に寄せて、下部オーバーレイが出ても全身・顔が見やすい位置に配置
            const headR = baseR * 0.88;
            const idleFloat = state.alive && !state.isHolding ? Math.sin(time * 2.1) * 3.5 : 0;
            const posX = cx + state.offsetX;
            const posY = cy - baseR * 0.14 + idleFloat + state.offsetY;

            // 膨らませ限界付近は顔も力んでブルブル小刻みに震える
            const strainShake = state.alive && tension > 0.55 ? (tension - 0.55) * 9 : 0;
            const sxShake = strainShake ? (Math.random() - 0.5) * strainShake : 0;
            const syShake = strainShake ? (Math.random() - 0.5) * strainShake : 0;

            ctx.save();
            ctx.translate(posX + sxShake, posY + syShake);
            ctx.rotate(state.rot);
            ctx.scale(state.scaleX * state.spawnScale, state.scaleY * state.spawnScale);

            const hairColor = "#24222c";
            const hairHighlight = "rgba(255, 255, 255, 0.22)";
            const skinColor = "#ffe2cc";
            const skinShade = "#f7c7a7";
            const cheekColor = "rgba(255, 118, 148, 0.42)";

            /* --- 1. 首と肩（シンプルな可愛いトップス） --- */
            // 後ろ髪（おかっぱのシルエット・背面）
            ctx.beginPath();
            ctx.moveTo(-headR * 1.18, headR * 0.72);
            ctx.bezierCurveTo(-headR * 1.24, -headR * 0.3, -headR * 1.02, -headR * 1.24, 0, -headR * 1.24);
            ctx.bezierCurveTo(headR * 1.02, -headR * 1.24, headR * 1.24, -headR * 0.3, headR * 1.18, headR * 0.72);
            // あごラインで内巻きに切り揃えたおかっぱの裾
            ctx.quadraticCurveTo(headR * 1.12, headR * 1.02, headR * 0.72, headR * 0.96);
            ctx.lineTo(-headR * 0.72, headR * 0.96);
            ctx.quadraticCurveTo(-headR * 1.12, headR * 1.02, -headR * 1.18, headR * 0.72);
            ctx.closePath();
            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#181720";
            ctx.stroke();

            // 肩・トップス
            ctx.beginPath();
            ctx.moveTo(-headR * 0.78, headR * 1.52);
            ctx.quadraticCurveTo(-headR * 0.74, headR * 1.05, -headR * 0.28, headR * 0.98);
            ctx.lineTo(headR * 0.28, headR * 0.98);
            ctx.quadraticCurveTo(headR * 0.74, headR * 1.05, headR * 0.78, headR * 1.52);
            ctx.closePath();
            ctx.fillStyle = pal.shirt;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // 白い丸襟
            ctx.beginPath();
            ctx.moveTo(-headR * 0.28, headR * 0.98);
            ctx.quadraticCurveTo(-headR * 0.14, headR * 1.22, 0, headR * 1.1);
            ctx.quadraticCurveTo(headR * 0.14, headR * 1.22, headR * 0.28, headR * 0.98);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            // 首
            drawRoundedRect(ctx, -headR * 0.19, headR * 0.72, headR * 0.38, headR * 0.36, 10);
            ctx.fillStyle = skinShade;
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            /* --- 2. 顔の輪郭（膨らませ中・噛み中はほっぺがぷくっと変形） --- */
            const puffCheek = state.alive && state.isHolding
              ? (0.06 + tension * 0.12)
              : (gm.chewTimer > 0 ? Math.sin((gm.chewTimer / 0.34) * Math.PI * 2) * 0.05 : 0);

            ctx.beginPath();
            ctx.moveTo(0, -headR * 0.9);
            ctx.bezierCurveTo(
              headR * 0.96, -headR * 0.9,
              headR * (0.98 + puffCheek), headR * 0.15,
              headR * (0.86 + puffCheek * 0.8), headR * 0.56
            );
            ctx.quadraticCurveTo(headR * 0.56, headR * 0.92, 0, headR * 0.93);
            ctx.quadraticCurveTo(-headR * 0.56, headR * 0.92, -headR * (0.86 + puffCheek * 0.8), headR * 0.56);
            ctx.bezierCurveTo(
              -headR * (0.98 + puffCheek), headR * 0.15,
              -headR * 0.96, -headR * 0.9,
              0, -headR * 0.9
            );
            ctx.closePath();

            // 膨らませ限界時は少し顔が赤らむ（息をこらえている感）
            const faceColor = state.alive && tension > 0.35
              ? mixColor(skinColor, "#ffb5b5", (tension - 0.35) * 0.55)
              : skinColor;
            ctx.fillStyle = faceColor;
            ctx.fill();
            ctx.lineWidth = 4.2;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();

            /* --- 3. 表情（目・眉・チーク・口） --- */
            const eyeY = headR * 0.06;
            const eyeX = headR * 0.36;
            const mouthY = headR * 0.45;

            // チーク（ほっぺの赤み）
            ctx.fillStyle = cheekColor;
            ctx.beginPath();
            ctx.ellipse(-headR * 0.5, headR * 0.28, headR * (0.16 + puffCheek * 0.4), headR * 0.1, 0, 0, Math.PI * 2);
            ctx.ellipse(headR * 0.5, headR * 0.28, headR * (0.16 + puffCheek * 0.4), headR * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#2b2d42";
            ctx.fillStyle = "#2b2d42";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (!state.alive) {
              // ベシャッ直後のショック顔（ガムの下や隙間から見えるコミカルな目！）
              ctx.lineWidth = 4.2;
              // 左目：ジト目・半泣きショック
              ctx.beginPath();
              ctx.moveTo(-eyeX - 13, eyeY - 9);
              ctx.lineTo(-eyeX + 10, eyeY + 1);
              ctx.lineTo(-eyeX - 12, eyeY + 10);
              ctx.stroke();
              // 右目：目が点（またはグルグル）
              ctx.beginPath();
              ctx.arc(eyeX, eyeY, 12, 0, Math.PI * 2);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(eyeX, eyeY, 3.5, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();
              // しょんぼり震える口
              ctx.beginPath();
              ctx.moveTo(-14, mouthY + 8);
              ctx.quadraticCurveTo(0, mouthY - 4, 14, mouthY + 8);
              ctx.stroke();
            } else if (state.isHolding || tension > 0.05) {
              // 息を吹き込んで一生懸命膨らませている顔！
              ctx.lineWidth = 4.2;
              if (tension > 0.65) {
                // 限界間近：ぎゅっと目をつぶる「＞ ＜」＋汗！
                ctx.beginPath();
                ctx.moveTo(-eyeX - 12, eyeY - 9);
                ctx.lineTo(-eyeX + 10, eyeY);
                ctx.lineTo(-eyeX - 12, eyeY + 9);
                ctx.moveTo(eyeX + 12, eyeY - 9);
                ctx.lineTo(eyeX - 10, eyeY);
                ctx.lineTo(eyeX + 12, eyeY + 9);
                ctx.stroke();
              } else {
                // 集中して細めた可愛い目（＾ ＾ / ￣ ￣）
                ctx.beginPath();
                ctx.arc(-eyeX, eyeY + 4, 12, 1.15 * Math.PI, 1.85 * Math.PI);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(eyeX, eyeY + 4, 12, 1.15 * Math.PI, 1.85 * Math.PI);
                ctx.stroke();
              }
              // すぼめた口「ω」ふぅーっ
              ctx.beginPath();
              ctx.arc(0, mouthY, 8, 0, Math.PI * 2);
              ctx.fillStyle = "#d95d78";
              ctx.fill();
              ctx.lineWidth = 3;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
            } else {
              // 通常時：ぱっちり可愛い瞳＋ちょっぴりおすまし笑顔（タップ時はモグモグ）
              [-eyeX, eyeX].forEach((ex) => {
                ctx.beginPath();
                ctx.ellipse(ex, eyeY, 10.5, 13, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#2b2d42";
                ctx.fill();

                // まつげのアクセント
                ctx.lineWidth = 3.2;
                ctx.beginPath();
                const dir = ex < 0 ? -1 : 1;
                ctx.moveTo(ex + dir * 8, eyeY - 8);
                ctx.lineTo(ex + dir * 15, eyeY - 12);
                ctx.stroke();

                // 瞳のキラッとハイライト
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(ex - 3.5, eyeY - 4.5, 3.8, 0, Math.PI * 2);
                ctx.arc(ex + 3.5, eyeY + 4.5, 1.8, 0, Math.PI * 2);
                ctx.fill();
              });

              // 鼻のちょん
              ctx.fillStyle = "rgba(43, 45, 66, 0.35)";
              ctx.beginPath();
              ctx.arc(0, headR * 0.25, 2.2, 0, Math.PI * 2);
              ctx.fill();

              // 口（モグモグ中 or おすまし笑顔）
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 3.6;
              if (gm.chewTimer > 0) {
                const chewWave = Math.sin((gm.chewTimer / 0.34) * Math.PI * 3) * 4;
                ctx.beginPath();
                ctx.moveTo(-13, mouthY + chewWave * 0.4);
                ctx.quadraticCurveTo(0, mouthY + 8 - chewWave, 13, mouthY + chewWave * 0.4);
                ctx.stroke();
              } else {
                // ちょっと口元からガムがチラ見えする可愛い口
                ctx.beginPath();
                ctx.arc(0, mouthY - 4, 12, 0.18 * Math.PI, 0.82 * Math.PI);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(3, mouthY + 4, 4.2, 0, Math.PI * 2);
                ctx.fillStyle = pal.main;
                ctx.fill();
              }
            }

            /* --- 4. おかっぱの前髪＆サイドの髪（ぱっつんボブ） --- */
            // 左右の内巻きサイドバング（顔の輪郭を包むおかっぱライン）
            ctx.fillStyle = hairColor;
            ctx.strokeStyle = "#181720";
            ctx.lineWidth = 4;

            // 左サイド
            ctx.beginPath();
            ctx.moveTo(-headR * 0.86, -headR * 0.62);
            ctx.bezierCurveTo(-headR * 1.18, -headR * 0.1, -headR * 1.16, headR * 0.58, -headR * 0.72, headR * 0.94);
            ctx.quadraticCurveTo(-headR * 0.76, headR * 0.48, -headR * 0.82, -headR * 0.15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 右サイド
            ctx.beginPath();
            ctx.moveTo(headR * 0.86, -headR * 0.62);
            ctx.bezierCurveTo(headR * 1.18, -headR * 0.1, headR * 1.16, headR * 0.58, headR * 0.72, headR * 0.94);
            ctx.quadraticCurveTo(headR * 0.76, headR * 0.48, headR * 0.82, -headR * 0.15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // ぱっつん前髪（眉上でまっすぐ切り揃え＋少しすき間）
            const bangY = -headR * 0.22;
            ctx.beginPath();
            ctx.moveTo(-headR * 0.92, -headR * 0.35);
            ctx.quadraticCurveTo(-headR * 0.92, -headR * 1.15, 0, -headR * 1.16);
            ctx.quadraticCurveTo(headR * 0.92, -headR * 1.15, headR * 0.92, -headR * 0.35);
            ctx.lineTo(headR * 0.84, bangY);
            // ぱっつんライン＋わずかな毛束スリット
            ctx.lineTo(headR * 0.38, bangY + 2);
            ctx.lineTo(headR * 0.33, bangY - 12);
            ctx.lineTo(headR * 0.28, bangY + 2);
            ctx.lineTo(-headR * 0.24, bangY + 2);
            ctx.lineTo(-headR * 0.29, bangY - 11);
            ctx.lineTo(-headR * 0.34, bangY + 2);
            ctx.lineTo(-headR * 0.84, bangY);
            ctx.closePath();
            ctx.fillStyle = hairColor;
            ctx.fill();
            ctx.stroke();

            // 天使の輪（おかっぱのツヤハイライト）
            ctx.save();
            ctx.strokeStyle = hairHighlight;
            ctx.lineWidth = 7;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.arc(0, -headR * 0.2, headR * 0.68, 1.2 * Math.PI, 1.46 * Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, -headR * 0.2, headR * 0.68, 1.56 * Math.PI, 1.76 * Math.PI);
            ctx.stroke();
            ctx.restore();

            // 可愛いクロスヘアピン（フレーバーと連動色）
            ctx.save();
            ctx.translate(headR * 0.56, -headR * 0.44);
            ctx.rotate(0.22);
            drawRoundedRect(ctx, -15, -4, 30, 8, 4);
            ctx.fillStyle = pal.pin;
            ctx.fill();
            ctx.lineWidth = 2.6;
            ctx.strokeStyle = "#2b2d42";
            ctx.stroke();
            ctx.restore();

            // 膨らませ限界間近の冷や汗
            if (state.alive && tension > 0.52) {
              const alpha = clamp((tension - 0.52) / 0.25, 0, 1);
              ctx.save();
              ctx.globalAlpha = alpha;
              const dropY = -headR * 0.1 + ((time * 65) % 20);
              ctx.fillStyle = "#4cc9f0";
              ctx.strokeStyle = "#2b2d42";
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(-headR * 0.72, dropY - 10);
              ctx.quadraticCurveTo(-headR * 0.62, dropY + 5, -headR * 0.72, dropY + 10);
              ctx.quadraticCurveTo(-headR * 0.82, dropY + 5, -headR * 0.72, dropY - 10);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }

            /* --- 5. 膨らむ風船ガム（長押し中） --- */
            if (state.alive && tension > 0.01) {
              // ガム粒数が多いほどさらに巨大に膨らむ！
              const sizeBonus = 1 + Math.min(gm.gumCount - 1, 8) * 0.07;
              const bubbleR = (14 + Math.pow(tension, 0.85) * headR * 1.15) * sizeBonus;
              const wobble = Math.sin(time * (14 + tension * 26)) * (1.2 + tension * 4.5);
              const gumX = 0 + (tension > 0.7 ? (Math.random() - 0.5) * 6 : 0);
              const gumY = mouthY + bubbleR * 0.22 + (tension > 0.7 ? (Math.random() - 0.5) * 6 : 0);

              ctx.save();
              ctx.translate(gumX, gumY);

              // 限界に近づくほど膜が薄く透けてテカる
              const rx = bubbleR + wobble;
              const ry = bubbleR * 0.96 - wobble * 0.7;

              ctx.beginPath();
              ctx.ellipse(0, 0, Math.max(4, rx), Math.max(4, ry), 0, 0, Math.PI * 2);

              const gGrad = ctx.createRadialGradient(-rx * 0.32, -ry * 0.35, rx * 0.08, 0, 0, rx * 1.12);
              gGrad.addColorStop(0, "rgba(255, 255, 255, 0.82)");
              gGrad.addColorStop(0.28, pal.light);
              gGrad.addColorStop(0.75, pal.main);
              gGrad.addColorStop(1, pal.shade);

              ctx.globalAlpha = lerp(0.95, 0.78, tension);
              ctx.fillStyle = gGrad;
              ctx.fill();

              ctx.globalAlpha = 1;
              ctx.lineWidth = lerp(3.8, 2.6, tension);
              ctx.strokeStyle = mixColor("#2b2d42", pal.shade, 0.35);
              ctx.stroke();

              // 風船ガムらしいぷっくりツヤ光沢
              ctx.save();
              ctx.translate(-rx * 0.34, -ry * 0.34);
              ctx.rotate(-0.55);
              ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
              ctx.beginPath();
              ctx.ellipse(0, 0, rx * 0.14, ry * 0.28, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();

              // 85%超えで限界のピカピカ亀裂ライン
              if (tension > 0.82) {
                ctx.strokeStyle = "rgba(255, 255, 255, 0.88)";
                ctx.lineWidth = 2.6;
                ctx.beginPath();
                ctx.moveTo(rx * 0.25, -ry * 0.2);
                ctx.lineTo(rx * 0.42, -ry * 0.05);
                ctx.lineTo(rx * 0.3, ry * 0.12);
                ctx.stroke();
              }

              ctx.restore();
            }

            /* --- 6. 破裂後：顔面にベシャッ!!と張り付いた風船ガム --- */
            if (!state.alive && gm.splatLobes.length > 0) {
              const sp = gm.splatProgress; // 0→1で一気にベシャッと張り付く
              const easeOut = 1 - Math.pow(1 - sp, 3);
              const drip = Math.min(gm.dripPhase * 12, 16); // 時間経過でじわっと下に少し垂れる
              const splatCenterY = headR * 0.22;

              ctx.save();
              ctx.translate(0, splatCenterY);
              ctx.scale(lerp(1.32, 1.0, easeOut), lerp(0.68, 1.0, easeOut));

              // 1) ベシャッ本体（不定形ベジェブロブ）
              const lobes = gm.splatLobes;
              const pts = lobes.map((lb) => {
                const extraDrip = Math.sin(lb.ang) > 0.45 ? drip * Math.sin(lb.ang) : 0;
                return {
                  x: Math.cos(lb.ang) * lb.r * headR * 0.92,
                  y: Math.sin(lb.ang) * lb.r * headR * 0.86 + extraDrip
                };
              });

              ctx.beginPath();
              for (let i = 0; i < pts.length; i++) {
                const curr = pts[i];
                const next = pts[(i + 1) % pts.length];
                const midX = (curr.x + next.x) * 0.5;
                const midY = (curr.y + next.y) * 0.5;
                if (i === 0) {
                  const prev = pts[pts.length - 1];
                  ctx.moveTo((prev.x + curr.x) * 0.5, (prev.y + curr.y) * 0.5);
                }
                ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
              }
              ctx.closePath();

              // 顔に貼り付いた少し半透明でツヤのあるガム質感
              const splatGrad = ctx.createRadialGradient(-headR * 0.2, -headR * 0.2, 8, 0, 0, headR * 1.15);
              splatGrad.addColorStop(0, pal.light);
              splatGrad.addColorStop(0.55, pal.main);
              splatGrad.addColorStop(1, pal.shade);
              ctx.globalAlpha = 0.88;
              ctx.fillStyle = splatGrad;
              ctx.fill();
              ctx.globalAlpha = 1;
              ctx.lineWidth = 3.5;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();

              // 2) ガムのシワ・粘着ツヤ（ベタッと張り付いた立体感）
              ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
              ctx.lineWidth = 5;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.arc(-headR * 0.22, -headR * 0.14, headR * 0.24, 1.1 * Math.PI, 1.65 * Math.PI);
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(headR * 0.25, headR * 0.12, headR * 0.16, 0.1 * Math.PI, 0.65 * Math.PI);
              ctx.stroke();

              // 口のあたりがうっすら透けて見える＆小さく破れた穴から片目がチラ見え！
              ctx.beginPath();
              ctx.ellipse(eyeX, eyeY - splatCenterY, 15, 13, -0.1, 0, Math.PI * 2);
              ctx.fillStyle = skinColor;
              ctx.fill();
              ctx.lineWidth = 2.8;
              ctx.strokeStyle = pal.shade;
              ctx.stroke();

              // 穴から覗くしょんぼり・呆然とした片目！
              ctx.beginPath();
              ctx.arc(eyeX, eyeY - splatCenterY, 8.5, 0, Math.PI * 2);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
              ctx.lineWidth = 2.5;
              ctx.strokeStyle = "#2b2d42";
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(eyeX - 1, eyeY - splatCenterY + 1, 3.2, 0, Math.PI * 2);
              ctx.fillStyle = "#2b2d42";
              ctx.fill();

              // 3) びよーんと垂れる粘着糸と小粒ガム
              for (const d of gm.splatDots) {
                const dx = Math.cos(d.ang) * d.dist * headR;
                const dy = Math.sin(d.ang) * d.dist * headR + (Math.sin(d.ang) > 0.3 ? drip * 0.5 : 0);

                // 本体とつなぐ細いガムの糸
                ctx.beginPath();
                ctx.moveTo(dx * 0.52, dy * 0.52);
                ctx.quadraticCurveTo(dx * 0.78, dy * 0.78 + 6, dx, dy);
                ctx.strokeStyle = pal.main;
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // 飛び散った小粒ガム
                ctx.save();
                ctx.translate(dx, dy);
                ctx.rotate(d.rot);
                ctx.beginPath();
                ctx.ellipse(0, 0, d.rx, d.ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = pal.main;
                ctx.fill();
                ctx.lineWidth = 2.4;
                ctx.strokeStyle = "#2b2d42";
                ctx.stroke();
                ctx.restore();
              }

              // 4) 画面のキャラ右上にコミカルな「ガーン！」の縦線（落ち込み表現）
              ctx.save();
              ctx.strokeStyle = "#4895ef";
              ctx.lineWidth = 3.2;
              ctx.lineCap = "round";
              for (let k = 0; k < 4; k++) {
                const lx = headR * 0.85 + k * 7;
                const ly = -headR * 0.95 + (k % 2) * 5;
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx, ly + 26 + (k % 2) * 8);
                ctx.stroke();
              }
              ctx.restore();

              ctx.restore();
            }

            ctx.restore();
          }
        }
      };

      const OBJECT_ORDER = ["balloon", "soda", "gum"];

      /* =========================================================
       * 4. アプリ状態管理・DOM要素
       * ========================================================= */
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const statActionIconEl = document.getElementById("stat-action-icon");
      const statActionLabelEl = document.getElementById("stat-action-label");
      const actionCountEl = document.getElementById("action-count");
      const statBurstIconEl = document.getElementById("stat-burst-icon");
      const statBurstLabelEl = document.getElementById("stat-burst-label");
      const burstCountEl = document.getElementById("burst-count");
      const statsBarEl = document.getElementById("stats-bar");
      const soundBtnEl = document.getElementById("sound-btn");
      const charSwitcherEl = document.getElementById("char-switcher");
      const subHudEl = document.getElementById("sub-hud");
      const subHudTextEl = document.getElementById("sub-hud-text");
      const subPowerTagEl = document.getElementById("sub-power-tag");
      const gaugeWrapEl = document.getElementById("gauge-wrap");
      const gaugeLabelEl = document.getElementById("gauge-label");
      const gaugePercentEl = document.getElementById("gauge-percent");
      const gaugeFillEl = document.getElementById("gauge-fill");
      const dangerVignetteEl = document.getElementById("danger-vignette");
      const burstOverlayEl = document.getElementById("burst-overlay");
      const burstOnoEl = document.getElementById("burst-onomatopoeia");
      const burstMsgEl = document.getElementById("burst-message");
      const respawnCtaEl = document.getElementById("respawn-cta");
      const respawnCtaOutsideEl = document.getElementById("respawn-cta-outside");
      const hintPillEl = document.getElementById("hint-pill");
      let speechTypeTimer = null;

      function stopSpeechTyping() {
        if (speechTypeTimer !== null) {
          clearInterval(speechTypeTimer);
          speechTypeTimer = null;
        }
      }

      const STORAGE_KEY_V2 = "stress_pop_stats_v2";
      const STORAGE_KEY_V1 = "stress_balloon_stats_v1";

      let currentObjectId = "balloon";
      const getCurrentObject = () => OBJECT_CATALOG[currentObjectId];

      // キャラごとの累計カウント
      const statsByChar = {
        balloon: { action: 0, burst: 0 },
        soda: { action: 0, burst: 0 },
        gum: { action: 0, burst: 0 }
      };

      function loadStats() {
        try {
          const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (rawV2) {
            const parsed = JSON.parse(rawV2);
            for (const id of OBJECT_ORDER) {
              if (parsed[id]) {
                statsByChar[id] = {
                  action: Number(parsed[id].action) || 0,
                  burst: Number(parsed[id].burst) || 0
                };
              }
            }
          } else {
            const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
            if (rawV1) {
              const p1 = JSON.parse(rawV1);
              statsByChar.balloon.action = Number(p1.punches) || 0;
              statsByChar.balloon.burst = Number(p1.bursts) || 0;
            }
          }
        } catch (_) {}
        updateStatsUI();
      }

      function saveStats() {
        try {
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(statsByChar));
        } catch (_) {}
      }

      function updateStatsUI() {
        const obj = getCurrentObject();
        const st = statsByChar[currentObjectId] || { action: 0, burst: 0 };
        statActionIconEl.textContent = obj.hud.actionIcon;
        statActionLabelEl.textContent = obj.hud.actionLabel;
        statBurstIconEl.textContent = obj.hud.burstIcon;
        statBurstLabelEl.textContent = obj.hud.burstLabel;
        actionCountEl.textContent = st.action.toLocaleString("ja-JP");
        burstCountEl.textContent = st.burst.toLocaleString("ja-JP");
      }

      function updateSubHUD() {
        const obj = getCurrentObject();
        const info = obj.getSubHudInfo ? obj.getSubHudInfo(state) : null;
        if (!info) {
          subHudEl.classList.remove("visible", "level-mid", "level-high");
          return;
        }
        subHudEl.classList.add("visible");
        subHudTextEl.textContent = info.text;
        subPowerTagEl.textContent = info.tag;
        subHudEl.classList.remove("level-mid", "level-high");
        if (info.level === "mid") subHudEl.classList.add("level-mid");
        else if (info.level === "high") subHudEl.classList.add("level-high");
      }

      function pulseSubHUD() {
        updateSubHUD();
        subHudEl.classList.remove("pop");
        void subHudEl.offsetWidth;
        subHudEl.classList.add("pop");
        setTimeout(() => subHudEl.classList.remove("pop"), 140);
      }

      // 物理＆アニメーション状態
      const state = {
        alive: true,
        respawnReadyAt: 0,
        paletteIndex: 0,
        palette: OBJECT_CATALOG.balloon.colors[0],

        offsetX: 0,
        offsetY: 0,
        velX: 0,
        velY: 0,
        scaleX: 1,
        scaleY: 1,
        velScaleX: 0,
        velScaleY: 0,
        rot: 0,
        velRot: 0,
        spawnScale: 1,

        dentAmount: 0,
        dentAngle: 0,
        hurtTimer: 0,

        isHolding: false,
        pinchPull: 0,
        pinchAngle: 0,
        tension: 0,
        holdSoundTimer: 0,

        screenShake: 0,
        soda: null,
        gum: null
      };

      const popups = [];
      const shockwaves = [];
      const particles = [];

      // ポインター操作管理（短押し=タップ / 長押し=ホールド）
      const LONG_PRESS_MS = 175;
      const pointer = {
        active: false,
        id: null,
        downTime: 0,
        x: 0,
        y: 0,
        longPressTimer: null
      };

      let viewW = window.innerWidth;
      let viewH = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      let centerX = viewW / 2;
      let centerY = viewH / 2;
      let baseRadius = Math.min(viewW, viewH) * 0.25;

      function resizeCanvas() {
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.floor(viewW * dpr);
        canvas.height = Math.floor(viewH * dpr);
        canvas.style.width = `${viewW}px`;
        canvas.style.height = `${viewH}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        centerX = viewW * 0.5;
        centerY = viewH * 0.51;
        baseRadius = clamp(Math.min(viewW, viewH) * 0.255, 82, 144);
      }

      /* =========================================================
       * 5. キャラ共通API＆アクション制御
       * ========================================================= */
      function getApi() {
        return {
          viewW,
          viewH,
          centerX,
          centerY,
          baseRadius,
          incrementAction() {
            statsByChar[currentObjectId].action += 1;
            updateStatsUI();
            saveStats();
          },
          pulseSubHUD,
          addPopup(text, x, y, color = "#ff2e4c", size = 34) {
            popups.push({
              text,
              x: clamp(x, 65, viewW - 65),
              y: clamp(y, 125, viewH - 130),
              vx: (Math.random() - 0.5) * 85,
              vy: -115 - Math.random() * 55,
              rot: (Math.random() - 0.5) * 0.34,
              color,
              size,
              life: 0,
              maxLife: 0.64
            });
          },
          addShockwave(x, y, r, maxR, maxLife, color) {
            shockwaves.push({ x, y, r, maxR, life: 0, maxLife, color });
          },
          addParticle(p) {
            if (particles.length > 260) particles.shift();
            particles.push({ ...p, life: 0 });
          },
          showBurstOverlay(ono, msg, cta) {
            stopSpeechTyping();
            const obj = getCurrentObject();
            const isSpeech = obj.overlayStyle === "speech";
            burstOverlayEl.classList.toggle("pos-bottom", obj.overlayPosition === "bottom");
            burstOverlayEl.classList.toggle("speech-mode", isSpeech);
            burstOnoEl.textContent = ono;
            respawnCtaEl.textContent = cta;
            respawnCtaOutsideEl.textContent = cta;
            burstOverlayEl.classList.add("visible");
            hintPillEl.textContent = obj.hud.hintDead;
            dangerVignetteEl.style.opacity = "0";

            if (isSpeech) {
              // 吹き出しで1文字ずつしゃべるように表示
              const chars = Array.from(msg);
              let idx = 0;
              burstMsgEl.textContent = "";
              speechTypeTimer = setInterval(() => {
                idx += 1;
                burstMsgEl.textContent = chars.slice(0, idx).join("");
                const ch = chars[idx - 1];
                if (idx % 2 === 1 && ch && !/[「」、。！？…〜!\?]/.test(ch)) {
                  SoundEngine.playVoiceBlip();
                }
                if (idx >= chars.length) {
                  stopSpeechTyping();
                }
              }, 36);
            } else {
              burstMsgEl.textContent = msg;
            }
          },
          triggerBurst() {
            triggerBurst();
          }
        };
      }

      function triggerBurst() {
        if (!state.alive) return;
        const obj = getCurrentObject();
        state.isHolding = false;
        statsByChar[currentObjectId].burst += 1;
        updateStatsUI();
        saveStats();
        obj.onBurst(state, getApi());
      }

      function respawnObject(playSound = true, keepFirstColor = false) {
        const obj = getCurrentObject();
        if (keepFirstColor) {
          state.paletteIndex = 0;
        } else {
          state.paletteIndex = (state.paletteIndex + 1 + Math.floor(Math.random() * Math.max(1, obj.colors.length - 1))) % obj.colors.length;
        }
        state.palette = obj.colors[state.paletteIndex];

        state.alive = true;
        state.offsetX = 0;
        state.offsetY = 30;
        state.velX = 0;
        state.velY = -160;
        state.scaleX = 0.76;
        state.scaleY = 1.26;
        state.velScaleX = 3.2;
        state.velScaleY = -2.4;
        state.rot = 0;
        state.velRot = 0;
        state.spawnScale = 0.16;
        state.dentAmount = 0;
        state.hurtTimer = 0;
        state.isHolding = false;
        state.pinchPull = 0;
        state.tension = 0;
        state.holdSoundTimer = 0;
        state.soda = null;
        state.gum = null;

        if (obj.initExtra) obj.initExtra(state);

        stopSpeechTyping();
        burstOverlayEl.classList.remove("visible", "pos-bottom", "speech-mode");
        dangerVignetteEl.style.opacity = "0";
        hintPillEl.textContent = obj.hud.hintAlive;
        updateSubHUD();
        if (playSound) SoundEngine.playSpawn();
      }

      function switchCharacter(newId) {
        if (!OBJECT_CATALOG[newId] || newId === currentObjectId) return;
        clearLongPressTimer();
        pointer.active = false;
        pointer.id = null;

        currentObjectId = newId;
        const obj = getCurrentObject();

        document.body.classList.remove("mode-balloon", "mode-soda", "mode-gum");
        if (obj.bodyClass) document.body.classList.add(obj.bodyClass);

        for (const btn of charSwitcherEl.querySelectorAll(".char-tab")) {
          const isActive = btn.dataset.charId === newId;
          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-selected", String(isActive));
        }

        popups.length = 0;
        shockwaves.length = 0;
        particles.length = 0;

        updateStatsUI();
        respawnObject(true, true);
      }

      function buildCharacterSwitcher() {
        charSwitcherEl.innerHTML = "";
        for (const id of OBJECT_ORDER) {
          const obj = OBJECT_CATALOG[id];
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `char-tab${id === currentObjectId ? " active" : ""}`;
          btn.dataset.charId = id;
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", String(id === currentObjectId));
          btn.textContent = `${obj.tabIcon} ${obj.name}`;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            SoundEngine.unlock();
            switchCharacter(id);
          });
          charSwitcherEl.appendChild(btn);
        }
      }

      /* =========================================================
       * 6. 入力イベント処理（iPhone Safari・Android最適化）
       * ========================================================= */
      function clearLongPressTimer() {
        if (pointer.longPressTimer !== null) {
          clearTimeout(pointer.longPressTimer);
          pointer.longPressTimer = null;
        }
      }

      function handlePointerDown(e) {
        if (e.isPrimary === false) return;
        e.preventDefault();
        SoundEngine.unlock();

        if (!state.alive) {
          if (performance.now() >= state.respawnReadyAt) {
            respawnObject(true, false);
          }
          return;
        }

        clearLongPressTimer();
        pointer.active = true;
        pointer.id = e.pointerId;
        pointer.downTime = performance.now();
        pointer.x = e.clientX;
        pointer.y = e.clientY;

        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (_) {}

        state.velScaleX += 0.85;
        state.velScaleY -= 0.85;

        pointer.longPressTimer = setTimeout(() => {
          pointer.longPressTimer = null;
          if (pointer.active && state.alive) {
            state.isHolding = true;
            getCurrentObject().onHoldStart(pointer.x, pointer.y, state, getApi());
          }
        }, LONG_PRESS_MS);
      }

      function handlePointerMove(e) {
        if (!pointer.active || e.pointerId !== pointer.id) return;
        e.preventDefault();
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        if (state.isHolding && state.alive) {
          getCurrentObject().onHoldMove(e.clientX, e.clientY, state, getApi());
        }
      }

      function handlePointerUpOrCancel(e) {
        if (!pointer.active || e.pointerId !== pointer.id) return;
        e.preventDefault();
        const elapsed = performance.now() - pointer.downTime;
        const wasHolding = state.isHolding;
        const upX = e.clientX || pointer.x;
        const upY = e.clientY || pointer.y;

        clearLongPressTimer();
        pointer.active = false;
        pointer.id = null;
        state.isHolding = false;

        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}

        const obj = getCurrentObject();
        if (wasHolding) {
          obj.onHoldEnd(state, e.type !== "pointercancel");
        } else if (e.type === "pointerup" && elapsed < LONG_PRESS_MS + 45 && state.alive) {
          obj.onTap(upX, upY, state, getApi());
        }
      }

      canvas.addEventListener("pointerdown", handlePointerDown, { passive: false });
      canvas.addEventListener("pointermove", handlePointerMove, { passive: false });
      canvas.addEventListener("pointerup", handlePointerUpOrCancel, { passive: false });
      canvas.addEventListener("pointercancel", handlePointerUpOrCancel, { passive: false });

      // iOS Safariのダブルタップズーム・長押しメニュー・ピンチ拡大を防止
      canvas.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
      window.addEventListener("blur", () => {
        clearLongPressTimer();
        pointer.active = false;
        if (state.isHolding) {
          state.isHolding = false;
          getCurrentObject().onHoldEnd(state, false);
        }
      });

      soundBtnEl.addEventListener("click", (e) => {
        e.stopPropagation();
        SoundEngine.enabled = !SoundEngine.enabled;
        soundBtnEl.textContent = SoundEngine.enabled ? "🔊" : "🔇";
        soundBtnEl.classList.toggle("muted", !SoundEngine.enabled);
        if (SoundEngine.enabled) {
          SoundEngine.unlock();
          SoundEngine.playSpawn();
        }
      });

      statsBarEl.addEventListener("click", (e) => {
        e.stopPropagation();
        const st = statsByChar[currentObjectId];
        if (st.action === 0 && st.burst === 0) return;
        const obj = getCurrentObject();
        if (window.confirm(`「${obj.name}」のカウントを 0 にリセットしますか？`)) {
          st.action = 0;
          st.burst = 0;
          updateStatsUI();
          saveStats();
        }
      });

      /* =========================================================
       * 7. メイン物理更新＆描画ループ
       * ========================================================= */
      function updateGaugeUI(obj) {
        const pct = Math.round(clamp(state.tension, 0, 1) * 100);
        gaugeFillEl.style.width = `${pct}%`;
        gaugePercentEl.textContent = `${pct}%`;

        const isActive = state.isHolding || pct > 0;
        gaugeWrapEl.classList.toggle("active", isActive);
        gaugeWrapEl.classList.toggle("danger", state.alive && pct >= 70);

        if (!state.alive) {
          gaugeLabelEl.textContent = obj.hud.gaugeBurst;
        } else if (state.isHolding) {
          const cries = obj.texts.holdCry;
          const idx = Math.min(cries.length - 1, Math.floor(state.tension * cries.length));
          gaugeLabelEl.textContent = `${obj.tabIcon} ${cries[idx]}`;
        } else {
          gaugeLabelEl.textContent = obj.hud.gaugeIdle;
        }

        if (state.alive && state.tension > 0.38) {
          const vAlpha = clamp((state.tension - 0.38) / 0.62, 0, 1);
          dangerVignetteEl.style.opacity = String(vAlpha * 0.88);
        } else {
          dangerVignetteEl.style.opacity = "0";
        }
      }

      function stepPhysics(dt, obj) {
        const k = obj.physics.springK;
        const d = obj.physics.damping;

        if (state.spawnScale < 1) {
          state.spawnScale = Math.min(1, state.spawnScale + dt * 5.8);
        }

        const directShake = currentObjectId === "soda" && state.isHolding && state.alive;
        if (!directShake) {
          const ax = -k * state.offsetX - d * state.velX;
          const ay = -k * state.offsetY - d * state.velY;
          state.velX += ax * dt;
          state.velY += ay * dt;
          state.offsetX += state.velX * dt;
          state.offsetY += state.velY * dt;

          const aRot = -k * 0.85 * state.rot - d * 0.85 * state.velRot;
          state.velRot += aRot * dt;
          state.rot = clamp(state.rot + state.velRot * dt, -0.55, 0.55);
        }

        const asx = -k * 1.15 * (state.scaleX - 1) - d * 0.9 * state.velScaleX;
        const asy = -k * 1.15 * (state.scaleY - 1) - d * 0.9 * state.velScaleY;
        state.velScaleX += asx * dt;
        state.velScaleY += asy * dt;
        state.scaleX = clamp(state.scaleX + state.velScaleX * dt, 0.58, 1.5);
        state.scaleY = clamp(state.scaleY + state.velScaleY * dt, 0.58, 1.5);

        state.dentAmount = Math.max(0, state.dentAmount - dt * 4.4);
        state.hurtTimer = Math.max(0, state.hurtTimer - dt);

        if (state.alive) {
          if (state.isHolding) {
            obj.onHoldUpdate(dt, state, getApi());
          } else {
            obj.onIdleUpdate(dt, state, getApi());
          }
        }

        if (obj.onPostPhysics) {
          obj.onPostPhysics(dt, state, getApi());
        }

        state.screenShake = Math.max(0, state.screenShake - dt * 52);

        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.life += dt;
          if (sw.life >= sw.maxLife) shockwaves.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.985;
          p.rot += p.vRot * dt;
        }

        for (let i = popups.length - 1; i >= 0; i--) {
          const pop = popups[i];
          pop.life += dt;
          if (pop.life >= pop.maxLife) {
            popups.splice(i, 1);
            continue;
          }
          pop.x += pop.vx * dt;
          pop.y += pop.vy * dt;
          pop.vy *= 0.92;
        }
      }

      function drawStar(ctx, r) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 === 0 ? r : r * 0.45;
          const ang = (i * Math.PI) / 5 - Math.PI / 2;
          const x = Math.cos(ang) * rad;
          const y = Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      function renderScene(time, obj) {
        ctx.clearRect(0, 0, viewW, viewH);

        ctx.save();
        if (state.screenShake > 0.2) {
          const sx = (Math.random() - 0.5) * 2 * state.screenShake;
          const sy = (Math.random() - 0.5) * 2 * state.screenShake;
          ctx.translate(sx, sy);
        }

        // 地面のやわらかい影
        if (state.alive || currentObjectId === "soda" || currentObjectId === "gum") {
          const shadowScale = clamp(1 - state.offsetY / 420, 0.65, 1.25) * state.spawnScale;
          let shadowY = centerY + baseRadius * 1.62;
          if (currentObjectId === "soda") shadowY = centerY + baseRadius * 1.18;
          else if (currentObjectId === "gum") shadowY = centerY + baseRadius * 1.24;

          ctx.save();
          ctx.beginPath();
          ctx.ellipse(
            centerX + state.offsetX * 0.45,
            shadowY,
            baseRadius * 0.66 * shadowScale,
            baseRadius * 0.14 * shadowScale,
            0, 0, Math.PI * 2
          );
          ctx.fillStyle = "rgba(43, 45, 66, 0.1)";
          ctx.fill();
          ctx.restore();
        }

        // メイン物体の描画
        obj.render(ctx, state, {
          cx: centerX,
          cy: centerY,
          baseR: baseRadius,
          viewW,
          viewH,
          time
        });

        // 衝撃リング
        for (const sw of shockwaves) {
          const t = sw.life / sw.maxLife;
          const r = lerp(sw.r, sw.maxR, 1 - Math.pow(1 - t, 3));
          ctx.save();
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, r, 0, Math.PI * 2);
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = 1 - t;
          ctx.lineWidth = lerp(9, 1.5, t);
          ctx.stroke();
          ctx.restore();
        }

        // パーティクル描画
        for (const p of particles) {
          const t = p.life / p.maxLife;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = clamp(1 - t * t, 0, 1);
          ctx.fillStyle = p.color;
          ctx.strokeStyle = "#2b2d42";
          ctx.lineWidth = 2;

          if (p.kind === "star") {
            drawStar(ctx, p.size);
            ctx.fill();
            ctx.stroke();
          } else if (p.kind === "shard") {
            ctx.beginPath();
            ctx.moveTo(-p.size, -p.size * 0.35);
            ctx.quadraticCurveTo(0, -p.size * 0.8, p.size, 0);
            ctx.lineTo(-p.size * 0.4, p.size * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (p.kind === "spark") {
            ctx.beginPath();
            ctx.moveTo(-p.size * 1.1, 0);
            ctx.lineTo(0, -p.size * 0.35);
            ctx.lineTo(p.size * 1.1, 0);
            ctx.lineTo(0, p.size * 0.35);
            ctx.closePath();
            ctx.fill();
          } else if (p.kind === "foam") {
            ctx.beginPath();
            ctx.arc(0, 0, p.size * (0.85 + t * 0.4), 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(43, 45, 66, 0.25)";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          } else if (p.kind === "droplet") {
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 1.25, p.size * 0.65, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size * 0.5, -p.size * 0.35, p.size, p.size * 0.7);
          }
          ctx.restore();
        }

        // コミカル擬音ポップアップ
        for (const pop of popups) {
          const t = pop.life / pop.maxLife;
          const scale = t < 0.18 ? lerp(0.4, 1.18, t / 0.18) : lerp(1.18, 0.96, (t - 0.18) / 0.82);
          const alpha = t < 0.65 ? 1 : 1 - (t - 0.65) / 0.35;

          ctx.save();
          ctx.translate(pop.x, pop.y);
          ctx.rotate(pop.rot);
          ctx.scale(scale, scale);
          ctx.globalAlpha = clamp(alpha, 0, 1);

          ctx.font = `900 ${pop.size}px "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineJoin = "round";

          ctx.lineWidth = 8;
          ctx.strokeStyle = "#ffffff";
          ctx.strokeText(pop.text, 0, 0);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#2b2d42";
          ctx.strokeText(pop.text, 0, 0);
          ctx.fillStyle = pop.color;
          ctx.fillText(pop.text, 0, 0);
          ctx.restore();
        }

        ctx.restore();
      }

      /* =========================================================
       * 8. ホーム画面追加用アイコン生成
       * ========================================================= */
      function generateAppleTouchIcon() {
        try {
          const iconCanvas = document.createElement("canvas");
          iconCanvas.width = 180;
          iconCanvas.height = 180;
          const ictx = iconCanvas.getContext("2d");
          ictx.fillStyle = "#fff3df";
          ictx.fillRect(0, 0, 180, 180);

          ictx.fillStyle = "#ff595e";
          ictx.strokeStyle = "#2b2d42";
          ictx.lineWidth = 6;
          ictx.beginPath();
          ictx.ellipse(90, 82, 50, 60, 0, 0, Math.PI * 2);
          ictx.fill();
          ictx.stroke();

          ictx.fillStyle = "rgba(255,255,255,0.45)";
          ictx.beginPath();
          ictx.ellipse(70, 58, 11, 20, -0.35, 0, Math.PI * 2);
          ictx.fill();

          ictx.fillStyle = "#2b2d42";
          ictx.beginPath();
          ictx.arc(73, 80, 6, 0, Math.PI * 2);
          ictx.arc(107, 80, 6, 0, Math.PI * 2);
          ictx.fill();

          ictx.beginPath();
          ictx.arc(90, 92, 14, 0.15 * Math.PI, 0.85 * Math.PI);
          ictx.stroke();

          const link = document.getElementById("app-icon");
          if (link) link.href = iconCanvas.toDataURL("image/png");
        } catch (_) {}
      }

      /* =========================================================
       * 9. 初期化＆アニメーション開始
       * ========================================================= */
      let lastTs = performance.now();
      function loop(ts) {
        const dt = Math.min((ts - lastTs) / 1000, 0.05);
        lastTs = ts;

        const obj = getCurrentObject();
        stepPhysics(dt, obj);
        renderScene(ts / 1000, obj);
        updateGaugeUI(obj);

        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resizeCanvas);
      buildCharacterSwitcher();
      loadStats();
      resizeCanvas();
      respawnObject(false, true);
      generateAppleTouchIcon();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
